<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Neeve · shared record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#f4eadc; --card:#fbf6ee; --ink:#42332b; --ink-soft:#6b574a; --muted:#9a8473;
    --clay:#bb6147; --sage:#6f7551; --plum:#6b4f63; --gold:#c08a3e; --line:#e6d8c4; --line-soft:#efe4d2; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{display:flex;min-height:100vh;max-width:1280px;margin:0 auto;}
  .sidebar{width:248px;flex:none;background:#efe2cf;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:16px;}
  .brand{display:flex;align-items:center;gap:9px;font-family:"Fraunces",serif;font-size:20px;font-weight:500;}
  .brand .mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--clay);}
  .pt-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;}
  .pt-card .nm{font-family:"Fraunces",serif;font-size:20px;font-weight:500;}
  .pt-card .pr{font-size:12px;color:var(--muted);margin-top:3px;}
  nav{display:flex;flex-direction:column;gap:3px;}
  nav button{display:flex;align-items:center;font:inherit;font-size:14px;font-weight:500;color:var(--ink-soft);background:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;}
  nav button:hover{background:rgba(255,255,255,.5);} nav button.on{background:var(--ink);color:var(--paper);}
  .side-foot{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.5;}
  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;gap:12px;padding:22px 26px 14px;border-bottom:1px solid var(--line);}
  .topbar h1{font-family:"Fraunces",serif;font-weight:500;font-size:24px;margin:0;}
  .topbar .sub{font-size:12.5px;color:var(--muted);}
  .content{padding:22px 26px 60px;}
  .panel{display:none;} .panel.on{display:block;}
  .soft{color:var(--ink-soft);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;}
  .il-h{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .il-cat{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);}
  .il-count{margin-left:auto;font-size:11.5px;color:var(--muted);background:#f1e7d8;border-radius:999px;padding:3px 10px;font-weight:600;}
  .il-card .it{font-family:"Fraunces",serif;font-weight:500;font-size:19px;color:var(--ink);margin:0 0 6px;}
  .il-sig{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 10px;}
  .surfaced{border-left:3px solid var(--sage);background:rgba(111,117,81,.08);padding:11px 14px;border-radius:0 10px 10px 0;font-size:13px;color:var(--ink);margin:2px 0 12px;line-height:1.5;}
  .il-research p{font-size:13px;color:var(--ink-soft);line-height:1.55;margin:0 0 8px;}
  .ref{color:var(--clay);font-weight:700;cursor:pointer;border-bottom:1px dotted var(--clay);font-size:11.5px;}
  .qbox{margin:6px 0 10px;border-left:3px solid var(--gold);background:rgba(233,205,162,.18);border-radius:0 8px 8px 0;padding:9px 13px;}
  .qbox .qs{font-size:10.5px;color:var(--muted);margin:0;line-height:1.4;}
  .il-foot{margin-top:8px;padding-top:10px;border-top:1px solid var(--line-soft);}
  .il-foot a{color:var(--clay);font-size:12.5px;font-weight:600;cursor:pointer;}
  #cal-frame{width:100%;border:0;min-height:760px;background:transparent;}
  .hamb{display:none;}
  .msg{padding:40px 4px;color:var(--muted);font-size:14px;}
  @media(max-width:780px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:.2s;}
    .sidebar.open{transform:none;}
    .ov{display:none;position:fixed;inset:0;background:rgba(40,30,24,.4);z-index:25;} .ov.on{display:block;}
    .hamb{display:inline-flex;flex-direction:column;gap:4px;background:none;border:0;cursor:pointer;padding:4px;}
    .hamb i{width:20px;height:2px;background:var(--ink);border-radius:2px;}
    .content{padding:18px 16px 60px;}
  }
</style>
</head>
<body>
<div class="ov" id="ov" onclick="closeNav()"></div>
<div class="wrap">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="mk"></span> Neeve</div>
    <div class="pt-card"><div class="nm" id="pt-name">—</div><div class="pr" id="pt-period"></div></div>
    <nav id="nav">
      <button data-p="overview" class="on" onclick="go('overview')">Insights</button>
      <button data-p="calendar" onclick="go('calendar')">Calendar</button>
    </nav>
    <div class="side-foot">Shared by the patient. Describes patterns to support a conversation. Does not diagnose.</div>
  </aside>
  <main class="main">
    <div class="topbar"><button class="hamb" onclick="openNav()"><i></i><i></i><i></i></button>
      <div><h1 id="pt-title">Insights</h1><div class="sub" id="pt-sub">what the data suggests · describes, does not diagnose</div></div></div>
    <div class="content">
      <section class="panel on" id="p-overview"><div class="msg" id="ins-msg">Loading…</div></section>
      <section class="panel" id="p-calendar"><iframe id="cal-frame" title="Calendar" scrolling="no"></iframe></section>
    </div>
  </main>
</div>
<script>
const TITLES={overview:['Insights','what the data suggests · describes, does not diagnose'],calendar:['Calendar','Everything tracked · month at a glance']};
function go(p){
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  document.getElementById('p-'+p).classList.add('on');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.getElementById('pt-title').textContent=TITLES[p][0];
  document.getElementById('pt-sub').textContent=TITLES[p][1];
  window.scrollTo(0,0); closeNav();
}
function openNav(){document.getElementById('sidebar').classList.add('open');document.getElementById('ov').classList.add('on');}
function closeNav(){document.getElementById('sidebar').classList.remove('open');document.getElementById('ov').classList.remove('on');}

let LIVE_REFS={};
window.toggleCite=function(el,n){ const p=el.closest('p'); const nx=p.nextElementSibling;
  if(nx&&nx.classList.contains('qbox')){nx.remove();return;}
  const c=LIVE_REFS[n]; if(!c) return;
  const box=document.createElement('div'); box.className='qbox'; box.innerHTML='<p class="qs">['+n+'] '+c+'</p>'; p.after(box); };

function renderLiveInsights(data){
  LIVE_REFS={}; (data.references||[]).forEach(r=>LIVE_REFS[r.n]=r.citation);
  const cards=(data.patterns||[]).map(p=>{
    const claims=(p.research||[]).map(c=>`<p>${c.claim} ${(c.refs||[]).map(n=>`<a class="ref" onclick="toggleCite(this,${n})">[${n}]</a>`).join(' ')}</p>`).join('');
    return `<div class="card il-card">
      <div class="il-h"><span class="il-cat">${p.category||''}</span><span class="il-count">seen ${p.count}×</span></div>
      <div class="it">${p.label}</div>
      <p class="il-sig">${p.signal||''}</p>
      ${p.surfaced?`<p class="surfaced">${p.surfaced}</p>`:''}
      ${claims?`<div class="il-research">${claims}</div>`:''}
      <div class="il-foot"><a onclick="go('calendar')">see it on the calendar →</a></div>
    </div>`;
  }).join('');
  const name=data.patient||'this';
  const poss = name==='this' ? 'this' : (name.endsWith('s') ? name+'’' : name+'’s');
  document.getElementById('p-overview').innerHTML =
    `<p class="soft" style="margin:0 0 16px">The patterns the engines surfaced this period — each with its evidence, drawn live from ${poss} record.</p>`+
    (cards||'<p class="soft">No patterns surfaced this period yet.</p>');
}

(function boot(){
  const code=new URLSearchParams(location.search).get('c');
  const fail=msg=>{ const m=document.getElementById('ins-msg'); if(m) m.textContent=msg; document.getElementById('pt-name').textContent='—'; };
  if(!code){ fail('No share code in the link.'); return; }
  const f=document.getElementById('cal-frame');
  f.src='neeve-calendar.html?embed=1&c='+encodeURIComponent(code);
  f.addEventListener('load',()=>{ try{ const b=f.contentDocument.body; const fit=()=>{const h=b.scrollHeight; if(h) f.style.height=(h+10)+'px';}; new ResizeObserver(fit).observe(b); fit(); }catch(e){} });
  fetch('https://api.noti.au/share/'+encodeURIComponent(code)+'/data').then(r=>r.json()).then(j=>{
    if(!j||!j.ok){ fail(j&&j.error==='expired'?'This share link has expired.':j&&j.error==='revoked'?'This share link was revoked.':'This link wasn’t found.'); return; }
    document.getElementById('pt-name').textContent=j.patient||'Shared record';
    renderLiveInsights(j);
  }).catch(()=>fail('Couldn’t load this record. Please check the link.'));
})();
</script>
</body>
</html>

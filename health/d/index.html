<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Neeve · shared record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#f4eadc; --card:#fbf6ee; --ink:#42332b; --ink-soft:#6b574a; --muted:#9a8473;
    --clay:#bb6147; --sage:#6f7551; --plum:#6b4f63; --gold:#c08a3e; --line:#e6d8c4; --line-soft:#efe4d2; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{display:flex;min-height:100vh;}
  .sidebar{width:248px;flex:none;background:#efe2cf;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:16px;}
  .brand{display:flex;align-items:center;gap:9px;font-family:"Fraunces",serif;font-size:20px;font-weight:500;}
  .brand .mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--clay);}
  .pt-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;}
  .pt-card .nm{font-family:"Fraunces",serif;font-size:20px;font-weight:500;}
  .pt-card .pr{font-size:12px;color:var(--muted);margin-top:3px;}
  nav{display:flex;flex-direction:column;gap:3px;}
  nav button{display:flex;align-items:center;font:inherit;font-size:14px;font-weight:500;color:var(--ink-soft);background:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;}
  nav button:hover{background:rgba(255,255,255,.5);} nav button.on{background:var(--ink);color:var(--paper);}
  .side-foot{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.5;}
  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;gap:12px;padding:22px 30px 16px;border-bottom:1px solid var(--line);max-width:800px;margin:0 auto;width:100%;}
  .topbar h1{font-family:"Fraunces",serif;font-weight:500;font-size:24px;margin:0;}
  .topbar .sub{font-size:12.5px;color:var(--muted);}
  .content{padding:24px 30px 60px;max-width:800px;margin:0 auto;}
  .panel{display:none;} .panel.on{display:block;}
  .soft{color:var(--ink-soft);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;}
  .il-h{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .il-cat{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);}
  .il-count{margin-left:auto;font-size:11.5px;color:var(--muted);background:#f1e7d8;border-radius:999px;padding:3px 10px;font-weight:600;}
  .il-card .it{font-family:"Fraunces",serif;font-weight:500;font-size:19px;color:var(--ink);margin:0 0 6px;}
  .il-sig{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 10px;}
  .surfaced{border-left:3px solid var(--sage);background:rgba(111,117,81,.08);padding:11px 14px;border-radius:0 10px 10px 0;font-size:13px;color:var(--ink);margin:2px 0 12px;line-height:1.5;}
  .il-research p{font-size:13px;color:var(--ink-soft);line-height:1.55;margin:0 0 8px;}
  .ref{color:var(--clay);font-weight:700;cursor:pointer;border-bottom:1px dotted var(--clay);font-size:11.5px;}
  .qbox{margin:6px 0 10px;border-left:3px solid var(--gold);background:rgba(233,205,162,.18);border-radius:0 8px 8px 0;padding:9px 13px;}
  .qbox .qs{font-size:10.5px;color:var(--muted);margin:0;line-height:1.4;}
  .il-foot{margin-top:8px;padding-top:10px;border-top:1px solid var(--line-soft);}
  .il-foot a{color:var(--clay);font-size:12.5px;font-weight:600;cursor:pointer;}
  #cal-frame{width:100%;border:0;min-height:760px;background:transparent;}
  .back{color:var(--clay);font-size:13px;font-weight:600;cursor:pointer;display:inline-block;margin-bottom:8px;}
  .dt-h{font-family:"Fraunces",serif;font-weight:500;font-size:24px;margin:4px 0 6px;}
  .sec{font-family:"Fraunces",serif;font-weight:500;font-size:15px;color:var(--ink);margin:0 0 12px;}
  .occ-list{display:flex;flex-direction:column;}
  .occ{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  .occ span:first-child{color:var(--ink-soft);} .occ-v{color:var(--ink);font-weight:600;}
  .dframe{width:100%;border:0;min-height:600px;background:transparent;}
  .vt-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;}
  .vt-top{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .vt-name{font-family:"Fraunces",serif;font-weight:500;font-size:17px;color:var(--ink);}
  .vt-unit{font-size:12px;color:var(--muted);}
  .vt-big{margin-left:auto;font-family:"Fraunces",serif;font-weight:500;font-size:26px;color:var(--ink);line-height:1;}
  .vt-big small{font-size:13px;color:var(--muted);font-family:"Hanken Grotesk",sans-serif;}
  .vt-bar{position:relative;height:30px;margin:6px 0 4px;}
  .vt-track{position:absolute;top:13px;left:0;right:0;height:4px;border-radius:3px;background:#ece0cd;}
  .vt-band{position:absolute;top:11px;height:8px;border-radius:5px;background:rgba(111,117,81,.42);}
  .vt-dot{position:absolute;top:8px;width:14px;height:14px;border-radius:50%;background:var(--sage);border:2px solid var(--card);transform:translateX(-50%);}
  .vt-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px;}
  .vt-meta{font-size:12px;color:var(--ink-soft);line-height:1.5;margin:10px 0 0;}
  .vt-meta b{color:var(--ink);font-weight:600;}
  .vt-cov{font-size:11px;color:var(--muted);margin-top:6px;}
  .hamb{display:none;}
  .msg{padding:40px 4px;color:var(--muted);font-size:14px;}
  @media(max-width:780px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:.2s;}
    .sidebar.open{transform:none;}
    .ov{display:none;position:fixed;inset:0;background:rgba(40,30,24,.4);z-index:25;} .ov.on{display:block;}
    .hamb{display:inline-flex;flex-direction:column;gap:4px;background:none;border:0;cursor:pointer;padding:4px;}
    .hamb i{width:20px;height:2px;background:var(--ink);border-radius:2px;}
    .content{padding:18px 16px 60px;}
  }
</style>
</head>
<body>
<div class="ov" id="ov" onclick="closeNav()"></div>
<div class="wrap">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="mk"></span> Neeve</div>
    <div class="pt-card"><div class="nm" id="pt-name">—</div><div class="pr" id="pt-period"></div></div>
    <nav id="nav">
      <button data-p="overview" class="on" onclick="go('overview')">Insights</button>
      <button data-p="vitals" onclick="go('vitals')">Vitals</button>
      <button data-p="calendar" onclick="go('calendar')">Calendar</button>
    </nav>
    <div class="side-foot">Shared by the patient. Describes patterns to support a conversation. Does not diagnose.</div>
  </aside>
  <main class="main">
    <div class="topbar"><button class="hamb" onclick="openNav()"><i></i><i></i><i></i></button>
      <div><h1 id="pt-title">Insights</h1><div class="sub" id="pt-sub">what the data suggests · describes, does not diagnose</div></div></div>
    <div class="content">
      <section class="panel on" id="p-overview"><div class="msg" id="ins-msg">Loading…</div></section>
      <section class="panel" id="p-vitals"></section>
      <section class="panel" id="p-calendar"><iframe id="cal-frame" title="Calendar" scrolling="no"></iframe></section>
      <section class="panel" id="p-detail"></section>
    </div>
  </main>
</div>
<script>
const TITLES={overview:['Insights','what the data suggests · describes, does not diagnose'],vitals:['Vitals','recorded ranges over this period · how each is measured'],calendar:['Calendar','Everything tracked · month at a glance']};
function go(p){
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  document.getElementById('p-'+p).classList.add('on');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.getElementById('pt-title').textContent=TITLES[p][0];
  document.getElementById('pt-sub').textContent=TITLES[p][1];
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  window.scrollTo(0,0); closeNav();
}
function openNav(){document.getElementById('sidebar').classList.add('open');document.getElementById('ov').classList.add('on');}
function closeNav(){document.getElementById('sidebar').classList.remove('open');document.getElementById('ov').classList.remove('on');}

let LIVE_REFS={};
window.toggleCite=function(el,n){ const p=el.closest('p'); const nx=p.nextElementSibling;
  if(nx&&nx.classList.contains('qbox')){nx.remove();return;}
  const c=LIVE_REFS[n]; if(!c) return;
  const box=document.createElement('div'); box.className='qbox'; box.innerHTML='<p class="qs">['+n+'] '+c+'</p>'; p.after(box); };

// each pattern has its own calendar scope (its marker) for the detail page
const PATTERN_SCOPE = { orthostatic:'stand', respiratory:'breath', daytime_rest:'rest', blood_pressure:'bp', pem:'pem', migraine:'migraine', pre_migraine:'migraine' };
let LIVE_DATA=null;
function claimsHtml(p){ return (p.research||[]).map(c=>`<p>${c.claim} ${(c.refs||[]).map(n=>`<a class="ref" onclick="toggleCite(this,${n})">[${n}]</a>`).join(' ')}</p>`).join(''); }
function detailVal(d){ if(!d) return '';
  if(d.peak_hr!=null&&d.baseline_hr!=null) return '+'+Math.round(d.peak_hr-d.baseline_hr)+' bpm (to '+Math.round(d.peak_hr)+')';
  if(d.delta_bpm!=null) return '+'+Math.round(d.delta_bpm)+' bpm';
  if(d.minutes!=null) return Math.round(d.minutes)+' min';
  if(d.drop!=null) return '−'+Math.round(d.drop)+' bpm';
  if(d.sys!=null&&d.dia!=null) return Math.round(d.sys)+'/'+Math.round(d.dia);
  if(d.value!=null) return Math.round(d.value)+(d.baseline!=null?' · usual '+Math.round(d.baseline):'');
  return ''; }
// A dedicated page per pattern: what it is, the data, the research, its calendar.
window.openPattern=function(key){
  const p=(LIVE_DATA&&LIVE_DATA.patterns||[]).find(x=>x.key===key); if(!p) return;
  const code=new URLSearchParams(location.search).get('c'); const scope=PATTERN_SCOPE[key]||'';
  const occ=(p.occurrences||[]).slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  const occRows=occ.length? occ.map(o=>{
    const d=new Date(o.ts); const day=d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
    const t=d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}).toLowerCase();
    return `<div class="occ"><span>${day} · ${t}</span><span class="occ-v">${detailVal(o.detail)}</span></div>`;
  }).join('') : '<p class="soft" style="font-size:13px;margin:0">No individual events recorded — surfaced from the trend.</p>';
  document.getElementById('p-detail').innerHTML=
    `<a class="back" onclick="go('overview')">‹ Insights</a>
     <div class="il-h"><span class="il-cat">${p.category||''}</span><span class="il-count">seen ${p.count}×</span></div>
     <div class="dt-h">${p.label}</div>
     <p class="il-sig" style="margin-bottom:14px">${p.signal||''}</p>
     ${p.surfaced?`<p class="surfaced">${p.surfaced}</p>`:''}
     <div class="card"><div class="sec">When it showed up</div><div class="occ-list">${occRows}</div></div>
     <div class="card"><div class="sec">On the calendar</div><iframe class="dframe" src="neeve-calendar.html?embed=1&c=${encodeURIComponent(code)}${scope?'&scope='+scope:''}" scrolling="no"></iframe></div>
     <div class="card"><div class="sec">The research</div><div class="il-research">${claimsHtml(p)||'<p class="soft" style="margin:0">—</p>'}</div></div>`;
  const df=document.querySelector('#p-detail .dframe');
  if(df) df.addEventListener('load',()=>{ try{ const b=df.contentDocument.body; const fit=()=>{const h=b.scrollHeight; if(h) df.style.height=(h+10)+'px';}; new ResizeObserver(fit).observe(b); fit(); }catch(e){} });
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  document.getElementById('p-detail').classList.add('on');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('on'));
  document.getElementById('pt-title').textContent=p.label;
  document.getElementById('pt-sub').textContent='what the data is showing · with the evidence';
  try{ history.replaceState(null,'','#p='+key); }catch(e){}
  window.scrollTo(0,0); closeNav();
};
function renderLiveInsights(data){
  LIVE_DATA=data; LIVE_REFS={}; (data.references||[]).forEach(r=>LIVE_REFS[r.n]=r.citation);
  const cards=(data.patterns||[]).map(p=>{
    return `<div class="card il-card">
      <div class="il-h"><span class="il-cat">${p.category||''}</span><span class="il-count">seen ${p.count}×</span></div>
      <div class="it">${p.label}</div>
      <p class="il-sig">${p.signal||''}</p>
      ${p.surfaced?`<p class="surfaced">${p.surfaced}</p>`:''}
      ${claimsHtml(p)?`<div class="il-research">${claimsHtml(p)}</div>`:''}
      <div class="il-foot"><a onclick="openPattern('${p.key}')">see the full picture →</a></div>
    </div>`;
  }).join('');
  const name=data.patient||'this';
  const poss = name==='this' ? 'this' : (name.endsWith('s') ? name+'’' : name+'’s');
  document.getElementById('p-overview').innerHTML =
    `<p class="soft" style="margin:0 0 16px">The patterns the engines surfaced this period — each with its evidence, drawn live from ${poss} record.</p>`+
    (cards||'<p class="soft">No patterns surfaced this period yet.</p>');
  renderVitals(data);
}

// Vitals overview — recorded ranges over the period, in the locked min–max
// range-bar style. Each card shows the typical value, the usual band, the full
// observed range, how it's measured and why it matters, and coverage. BP is
// intentionally absent: ring-estimated BP must never appear on a doctor-facing
// surface (cuff-only rule), and this payload's BP is ring-derived.
const VMETRICS=[
  {k:'hrv', name:'Heart-rate variability', unit:'ms', dp:0,
   why:'Beat-to-beat variation in heart rate, measured overnight. Higher generally reflects a more rested autonomic state; a sustained drop can track strain or poorer recovery.'},
  {k:'hr', name:'Heart rate', unit:'bpm', dp:0,
   why:'Recorded heart rate across the day, including rest and activity. The full range matters more than any single reading.'},
  {k:'rr', name:'Respiratory rate', unit:'breaths/min', dp:0,
   why:'Breaths per minute from the finger PPG waveform. Steady overnight; a rise can accompany exertion, arousal or feeling unwell.'},
  {k:'spo2', name:'Blood-oxygen (SpO₂)', unit:'%', dp:0,
   why:'Estimated oxygen saturation. Sits near 96–99% for most people; brief low readings are usually movement or contact artefacts.'},
];
function median(a){ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function pct(a,p){ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y); return s[Math.max(0,Math.min(s.length-1,Math.round((s.length-1)*p)))]; }
function renderVitals(data){
  const days=data.days||{}; const dates=Object.keys(days);
  const total=dates.length;
  const cards=VMETRICS.map(M=>{
    const avgs=[],los=[],his=[]; let cov=0;
    for(const d of dates){ const v=days[d]&&days[d].vitals&&days[d].vitals[M.k];
      if(!v||v[0]==null) continue; avgs.push(+v[0]); los.push(+v[1]); his.push(+v[2]); cov++; }
    if(cov<2) return '';
    const typ=median(avgs), b1=pct(avgs,.25), b2=pct(avgs,.75);
    const lo=Math.min(...los), hi=Math.max(...his), span=Math.max(1e-6,hi-lo);
    const P=v=>Math.max(0,Math.min(100,(v-lo)/span*100));
    const r=n=>n==null?'—':n.toFixed(M.dp);
    return `<div class="vt-card">
      <div class="vt-top"><span class="vt-name">${M.name}</span><span class="vt-unit">${M.unit}</span>
        <span class="vt-big">${r(typ)}<small> typical</small></span></div>
      <div class="vt-bar">
        <div class="vt-track"></div>
        <div class="vt-band" style="left:${P(b1)}%;width:${Math.max(2,P(b2)-P(b1))}%"></div>
        <div class="vt-dot" style="left:${P(typ)}%"></div>
      </div>
      <div class="vt-ends"><span>${r(lo)}</span><span>${r(hi)}</span></div>
      <p class="vt-meta"><b>How:</b> typical = the middle of ${cov} daily readings; the band spans where values usually sat (${r(b1)}–${r(b2)}), the line ends are the lowest and highest recorded. <b>Why:</b> ${M.why}</p>
      <div class="vt-cov">Recorded on ${cov} of ${total} days this period.</div>
    </div>`;
  }).filter(Boolean).join('');
  document.getElementById('p-vitals').innerHTML =
    `<p class="soft" style="margin:0 0 16px">What ${data.patient||'this record'}’s vitals actually ranged across this period — measured, with how each is derived. Blood pressure is shown only from cuff readings, on a separate page.</p>`+
    (cards||'<p class="soft">Not enough recorded vitals this period to summarise.</p>');
}

(function boot(){
  const code=new URLSearchParams(location.search).get('c');
  const fail=msg=>{ const m=document.getElementById('ins-msg'); if(m) m.textContent=msg; document.getElementById('pt-name').textContent='—'; };
  if(!code){ fail('No share code in the link.'); return; }
  const f=document.getElementById('cal-frame');
  f.src='neeve-calendar.html?embed=1&c='+encodeURIComponent(code);
  f.addEventListener('load',()=>{ try{ const b=f.contentDocument.body; const fit=()=>{const h=b.scrollHeight; if(h) f.style.height=(h+10)+'px';}; new ResizeObserver(fit).observe(b); fit(); }catch(e){} });
  fetch('https://api.noti.au/share/'+encodeURIComponent(code)+'/data').then(r=>r.json()).then(j=>{
    if(!j||!j.ok){ fail(j&&j.error==='expired'?'This share link has expired.':j&&j.error==='revoked'?'This share link was revoked.':'This link wasn’t found.'); return; }
    document.getElementById('pt-name').textContent=j.patient||'Shared record';
    renderLiveInsights(j);
    const m=(location.hash.match(/p=([a-z_]+)/)); if(m){ openPattern(m[1]); return; }
    const h=location.hash.replace('#','');
    if(h==='vitals'||h==='calendar') go(h);
  }).catch(()=>fail('Couldn’t load this record. Please check the link.'));
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F1E7" />
<link rel="manifest" href="/health/manifest.json" />
<link rel="apple-touch-icon" href="/health/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Neeve" />
<title>Neeve</title>

<!-- Earthy Minimalism: Fraunces for the wordmark + headers, Hanken
     Grotesk for body copy. Same type system the iOS app uses, so
     web login feels like the same product. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F8F1E7; --cream-soft:#FFFDF9; --bone-deep:#F2EBE0;
  --ink:#2B2018; --ink-soft:#5C4F45; --taupe:#9A8369;
  --clay:#BF5A3C; --salmon:#CB8270; --plum:#8F6C86; --gold:#C8A23F;
  --line:rgba(43,32,24,.10);
  --shadow:0 1px 2px rgba(43,32,24,.04), 0 10px 30px rgba(43,32,24,.06);
}
html{min-height:100%}
body{
  font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  min-height:100dvh; position:relative; overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
  /* Warm mesh gradient — peach edges fading into cream centre. The
     iOS app uses a similar atmosphere on Today + Sleep; web login
     borrows the colour story so it reads as the same place. */
  background:
    radial-gradient(circle at 12% -8%,  #FFE8D8 0%, transparent 42%),
    radial-gradient(circle at 92% 8%,   #F6D5C2 0%, transparent 45%),
    radial-gradient(circle at 50% 110%, #E8C9B1 0%, transparent 55%),
    var(--cream);
  background-attachment:fixed;
}
.wrap{
  position:relative; z-index:1; padding:60px 22px 80px; max-width:460px; margin:0 auto;
  min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
}
.eyebrow{
  font-family:"Hanken Grotesk",sans-serif; font-size:11.5px; font-weight:500;
  letter-spacing:.28em; text-transform:uppercase; color:var(--taupe);
  text-align:center; margin-bottom:14px;
}
.brand{
  font-family:"Fraunces",Georgia,serif; font-weight:500;
  font-size:clamp(58px,12vw,84px); line-height:.95; letter-spacing:-.02em;
  text-align:center; margin:0; color:var(--ink);
}
.brand .dot{color:var(--clay); font-style:normal}
.sub{
  text-align:center; max-width:380px; margin:20px auto 40px;
  color:var(--ink-soft); font-size:17px; line-height:1.55;
  font-family:"Fraunces",Georgia,serif; font-style:italic; font-weight:400;
}
.card{
  background:rgba(255,253,249,.78);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line); border-radius:22px;
  padding:28px 24px 24px; box-shadow:var(--shadow);
}
.card h2{
  font-family:"Fraunces",Georgia,serif; font-weight:500; font-size:24px;
  letter-spacing:-.01em; margin-bottom:6px; color:var(--ink);
}
.card .help{
  font-size:14.5px; color:var(--ink-soft); margin-bottom:20px; line-height:1.5;
}
label{
  display:block; font-family:"Hanken Grotesk",sans-serif; font-size:11px;
  font-weight:500; letter-spacing:.18em; text-transform:uppercase;
  color:var(--taupe); margin-bottom:8px;
}
input{
  width:100%; background:#fff; border:1.5px solid var(--line); border-radius:12px;
  padding:14px 16px; font-size:17px; color:var(--ink); font-family:inherit;
  -webkit-appearance:none; appearance:none; outline:none; transition:border-color .15s;
}
input:focus{border-color:var(--clay)}
button{
  width:100%; background:var(--ink); color:var(--cream); border:0;
  padding:16px; border-radius:14px; font-family:"Hanken Grotesk",sans-serif;
  font-size:14.5px; font-weight:500; letter-spacing:.04em;
  cursor:pointer; margin-top:18px; transition:opacity .15s;
}
button:active{opacity:.86}
button:disabled{opacity:.45; cursor:wait}
.error{
  color:var(--clay); font-size:13.5px; margin-top:14px; text-align:center;
  min-height:18px; font-family:inherit;
}
.back{
  font-size:13px; color:var(--ink-soft); margin-top:16px; text-align:center;
  cursor:pointer; font-family:inherit;
}
.foot{
  text-align:center; margin-top:18px; font-size:13.5px; color:var(--ink-soft);
  font-family:inherit;
}
.foot a{color:var(--ink); font-weight:500; text-decoration:underline; cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">a daily companion</p>
  <h1 class="brand">neeve<span class="dot">.</span></h1>
  <p class="sub">A daily companion for when<br>chronic illness makes life hard to read.</p>

  <div class="card" id="step-phone">
    <h2>Sign in</h2>
    <p class="help">We'll text you a 6-digit code.</p>
    <label for="phone">Your phone number</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="0433 461 432" autocomplete="tel" />
    <button id="btn-code">Send me a code</button>
    <div class="error" id="err1"></div>
    <div class="foot">New here? <a onclick="location.href='/health/signup'">Sign up</a></div>
  </div>

  <div class="card hidden" id="step-code">
    <h2>Enter the code</h2>
    <p class="help" id="code-help">We sent a 6-digit code to your phone.</p>
    <label for="code">6-digit code</label>
    <input id="code" type="tel" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code" />
    <button id="btn-verify">Verify</button>
    <div class="error" id="err2"></div>
    <div class="back" id="back">← change number</div>
  </div>
</div>

<script>
const API = 'https://noti-health-api.ancient-bread-01fe.workers.dev';

const $ = (id) => document.getElementById(id);
const show = (id) => $(id).classList.remove('hidden');
const hide = (id) => $(id).classList.add('hidden');

// If already signed in, skip straight to home
if (localStorage.getItem('noti_token')) {
  window.location.href = '/health/home';
}

$('btn-code').addEventListener('click', async () => {
  const phone = $('phone').value.trim();
  if (!phone) { $('err1').textContent = 'Enter your phone number.'; return; }
  $('btn-code').disabled = true;
  $('err1').textContent = '';
  try {
    const res = await fetch(API + '/auth/code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone })
    });
    const data = await res.json();
    if (!data.success) {
      $('err1').textContent = data.message || 'Could not send code.';
      $('btn-code').disabled = false;
      return;
    }
    window.__phone = phone;
    $('code-help').textContent = `We sent a code to ${phone}.`;
    hide('step-phone'); show('step-code');
    $('code').focus();
  } catch (e) {
    $('err1').textContent = 'Network issue — try again.';
    $('btn-code').disabled = false;
  }
});

$('btn-verify').addEventListener('click', async () => {
  const code = $('code').value.trim();
  if (code.length !== 6) { $('err2').textContent = 'Enter the 6-digit code.'; return; }
  $('btn-verify').disabled = true;
  $('err2').textContent = '';
  try {
    const res = await fetch(API + '/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: window.__phone, code })
    });
    const data = await res.json();
    if (!data.success) {
      $('err2').textContent = data.message || 'Invalid code.';
      $('btn-verify').disabled = false;
      return;
    }
    localStorage.setItem('noti_token', data.token);
    localStorage.setItem('noti_user', JSON.stringify(data.user));
    window.location.href = '/health/home';
  } catch (e) {
    $('err2').textContent = 'Network issue — try again.';
    $('btn-verify').disabled = false;
  }
});

$('back').addEventListener('click', () => {
  hide('step-code'); show('step-phone');
  $('code').value = ''; $('err1').textContent = '';
  $('btn-code').disabled = false;
});

$('code').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '');
  if (e.target.value.length === 6) $('btn-verify').click();
});
</script>
<script src="/health/push-client.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neeve · Research Foundations</title>
<meta name="robots" content="noindex">
<!-- Live render of research-foundations.md (the markdown is the single source of
     truth). To update the published doc: replace research-foundations.md and
     redeploy — never hand-edit this file's content. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --ink:#4A1B0C; --muted:#712B13; --accent:#993C1D; --cta:#4A1B0C; --cta-text:#FFE4D0;
    --bg:linear-gradient(160deg,#FFE8C7 0%,#FFCBA4 25%,#F5A887 55%,#EC7E5C 85%,#D85A30 100%);
    --card:#FFFDF9; --line:#ECDFCF; --quote:#FAF3E9; --max:48rem;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; color:var(--ink);
    background:var(--bg); background-attachment:fixed; min-height:100vh;
  }
  /* ---- sticky glass toolbar (app chrome) ---- */
  #bar{
    position:sticky; top:0; z-index:10; display:flex; gap:.75rem; align-items:center;
    padding:.7rem 1.1rem; font-size:.85rem; color:var(--ink);
    background:rgba(255,255,255,.45);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.7);
  }
  #bar .brand{font-weight:700; letter-spacing:-.2px}
  #bar .meta{color:var(--muted); opacity:.85; font-weight:400}
  #bar button{
    margin-left:auto; cursor:pointer; border:0; background:var(--cta); color:var(--cta-text);
    border-radius:14px; padding:.5rem 1.05rem; font:inherit; font-weight:600;
  }
  #bar button:hover{filter:brightness(1.12)}
  /* ---- reading card on the gradient ---- */
  main{
    max-width:var(--max); margin:2.2rem auto 5rem; background:var(--card);
    border:1px solid rgba(255,255,255,.85); border-radius:22px;
    box-shadow:0 24px 60px -28px rgba(74,27,12,.45);
    padding:3rem 3.2rem;
  }
  /* ---- typography ---- */
  h1,h2,h3,h4{line-height:1.22; letter-spacing:-.3px}
  h1{font-size:2.1rem; font-weight:700; margin:0 0 .2em}
  h2{font-size:1.5rem; font-weight:600; margin:2.5em 0 .5em; padding-top:.7em; border-top:1px solid var(--line)}
  h3{font-size:1.2rem; font-weight:600; margin:1.9em 0 .4em}
  h4{font-size:.78rem; font-weight:600; letter-spacing:1.3px; text-transform:uppercase; color:var(--accent); margin:1.7em 0 .4em}
  p,li{font-size:1rem; line-height:1.68}
  a{color:var(--accent); text-underline-offset:2px}
  strong{font-weight:600}
  hr{border:0; border-top:1px solid var(--line); margin:2.2em 0}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86em; background:#F2E7D8; padding:.12em .38em; border-radius:5px}
  blockquote{
    margin:1.3em 0; padding:.9em 1.2em; background:var(--quote);
    border-left:4px solid var(--accent); border-radius:0 12px 12px 0;
  }
  blockquote p{margin:.4em 0; font-size:.95rem}
  table{border-collapse:collapse; width:100%; margin:1.3em 0; font-size:.88rem}
  th,td{border:1px solid var(--line); padding:.55em .65em; text-align:left; vertical-align:top}
  th{background:#F6ECDD; font-weight:600}
  tbody tr:nth-child(even){background:#FBF5EC}
  /* ---- TOC ---- */
  #toc{background:#FBF5EC; border:1px solid var(--line); border-radius:14px; padding:1.1rem 1.4rem; margin:1.6rem 0 2.2rem}
  #toc .lbl{font-size:.72rem; font-weight:600; letter-spacing:1.3px; text-transform:uppercase; color:var(--accent); margin-bottom:.55rem}
  #toc ul{list-style:none; margin:0; padding:0; columns:2; column-gap:2rem; font-size:.9rem}
  #toc li{margin:.18rem 0; break-inside:avoid}
  #toc a{text-decoration:none; color:var(--ink)}
  #toc a:hover{color:var(--accent)}
  #status{max-width:var(--max); margin:3rem auto; background:var(--card); border-radius:18px; padding:2rem 2.4rem; color:var(--muted); line-height:1.6}
  /* ---- print: drop the app chrome, go clean clinical b/w ---- */
  @page{ margin:18mm 16mm; }
  @media print{
    html,body{background:#fff !important; color:#000}
    #bar{display:none}
    main{max-width:none; margin:0; padding:0; border:0; border-radius:0; box-shadow:none; background:#fff}
    a{color:#000; text-decoration:none}
    h2{page-break-before:always; border-top:none}
    h1,h2.first-section{page-break-before:avoid}
    h2,h3,h4{page-break-after:avoid}
    tr,blockquote,li,img,pre{page-break-inside:avoid}
    thead{display:table-header-group}
    blockquote{background:#f4f4f4 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    th{background:#eee !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    tbody tr:nth-child(even){background:#f7f7f7 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    #toc{break-inside:avoid; page-break-after:always; background:#f7f7f7 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  }
  @media (max-width:640px){ main{padding:1.8rem 1.3rem; margin:1.2rem; border-radius:16px} #toc ul{columns:1} }
</style>
</head>
<body>
  <div id="bar">
    <span class="brand">Neeve</span>
    <span class="meta" id="srcmeta">Research Foundations · live</span>
    <button onclick="window.print()">Print / Save as PDF</button>
  </div>

  <div id="status">Loading the latest from <code>research-foundations.md</code>…</div>
  <main id="doc" hidden></main>

<script>
  const MD_FILE = "research-foundations.md";           // sits next to this file
  const url = MD_FILE + "?t=" + Date.now();            // cache-bust so edits always show
  marked.setOptions({ gfm:true, breaks:false, headerIds:true, mangle:false });
  const slug = s => s.toLowerCase().replace(/[^\w]+/g,"-").replace(/^-+|-+$/g,"");

  fetch(url)
    .then(r => { if(!r.ok) throw new Error("HTTP "+r.status);
      const lm = r.headers.get("Last-Modified");
      if(lm){ const d=new Date(lm);
        document.getElementById("srcmeta").textContent =
          "Research Foundations · updated " + d.toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}); }
      return r.text(); })
    .then(md => {
      const doc = document.getElementById("doc");
      doc.innerHTML = marked.parse(md);
      const tocItems=[]; let first=true;
      doc.querySelectorAll("h2,h3").forEach(h=>{
        if(!h.id) h.id = slug(h.textContent);
        if(h.tagName==="H2"){ if(first){h.classList.add("first-section");first=false;} tocItems.push(h); }
      });
      if(tocItems.length){
        const toc=document.createElement("nav"); toc.id="toc";
        toc.innerHTML='<div class="lbl">Contents</div><ul>'+
          tocItems.map(h=>`<li><a href="#${h.id}">${h.textContent}</a></li>`).join("")+'</ul>';
        const fs=doc.querySelector("h2.first-section"); if(fs) doc.insertBefore(toc,fs);
      }
      document.getElementById("status").remove();
      doc.hidden=false;
    })
    .catch(err => {
      document.getElementById("status").innerHTML =
        "<strong>Couldn't load the document.</strong><br>research-foundations.md must sit next to this page and be served over http(s) (not file://). ("+err.message+")";
    });
</script>
</body>
</html>

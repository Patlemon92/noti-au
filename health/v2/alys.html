<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F1E7" />
<link rel="manifest" href="/health/manifest-health.json" />
<link rel="apple-touch-icon" href="/health/icon-192.png" />
<title>Alys · Neeve</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">
<script src="/health/v2/alys-orb.js"></script>

<style>
  /* Soft peach-to-cream gradient matching Today + Record. */
  :root {
    --ink-2: #2b2018;
    --clay-2: #bf5a3c;
    --taupe-2: #9a8369;
    --warm-card: #fffdf9;
  }
  body {
    background: linear-gradient(180deg, #f6e6d6 0%, #f6efe4 30%, #f6efe4 100%);
    background-attachment: fixed;
    color: var(--ink-2);
  }
  .page-alys {
    max-width: 460px; margin: 0 auto;
    padding: 0 22px 200px;
    animation: page-fade .55s ease;
  }
  @keyframes page-fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  /* Frozen header — orb + observations + "Talk to me" label all
     pinned at the top so the chat below scrolls independently
     underneath them. Patrick: "it should freeze from the talk to
     me and the whole header be a bit smaller." */
  .alys-header {
    position: sticky; top: 0;
    z-index: 5;
    margin: 0 -22px;
    padding: 14px 22px 6px;
    background: linear-gradient(180deg,
      rgba(246, 230, 214, .98) 0%,
      rgba(246, 239, 228, .94) 80%,
      rgba(246, 239, 228, 0) 100%);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: padding .3s ease;
  }

  /* Orb hero — smaller default, even smaller when stuck */
  .orb-stage {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 10px;
  }
  .orb-stage .alys-orb { transition: transform .3s ease; }
  .alys-header[data-stuck="true"] {
    padding: 6px 22px 4px;
  }
  .alys-header[data-stuck="true"] .alys-orb {
    transform: scale(.42);
    margin: -28px 0;
  }
  .alys-header[data-stuck="true"] .here,
  .alys-header[data-stuck="true"] .quiet,
  .alys-header[data-stuck="true"] .eyebrow:not(.eyebrow-talk),
  .alys-header[data-stuck="true"] #obs-list {
    display: none;
  }
  .orb-stage .here {
    font-family: 'Apricosa', 'Fraunces', serif;
    font-size: 17px; color: var(--ink);
    margin-top: 10px; letter-spacing: -.2px;
    transition: opacity .25s ease;
  }
  .orb-stage .quiet {
    font-family: 'Fraunces', serif; font-style: italic;
    font-size: 13px; color: var(--taupe);
    margin-top: 6px; line-height: 1.5; max-width: 320px; text-align: center;
    transition: opacity .25s ease;
  }

  /* Eyebrows */
  .eyebrow {
    font-family: 'Inter Tight', sans-serif;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--taupe); font-weight: 600;
    margin: 16px 0 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .eyebrow.eyebrow-talk { margin-top: 4px; margin-bottom: 8px; }
  .eyebrow::before {
    content: ''; flex-shrink: 0;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--clay, #BF5A3C); opacity: .65;
  }
  .eyebrow::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(43,32,24,.12) 0%, transparent 100%);
  }

  /* Observations */
  .obs {
    background: linear-gradient(180deg, #ffffff 0%, #fffaf2 100%);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 10px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 14px 28px -22px rgba(140, 80, 50, .28);
  }
  .obs .said {
    font-family: 'Apricosa', 'Fraunces', serif;
    font-size: 17px; line-height: 1.5; color: var(--ink);
    letter-spacing: -.1px;
  }
  .obs .where {
    display: inline-block; margin-top: 10px;
    color: var(--clay, #BF5A3C); font-size: 13px;
    font-weight: 500; text-decoration: none;
  }

  /* Chat */
  .chat { margin-bottom: 32px; }
  .day-divider {
    font-family: 'Inter Tight', sans-serif;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--taupe); font-weight: 600;
    margin: 18px 0 14px 4px;
  }
  .msg { margin-bottom: 18px; }
  .msg .who {
    font-family: 'Inter Tight', sans-serif;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--taupe); font-weight: 600; margin-bottom: 6px;
  }
  .msg .who.alys { color: var(--clay, #BF5A3C); }
  .msg .body {
    font-family: 'Apricosa', 'Fraunces', serif;
    font-size: 17px; line-height: 1.55; color: var(--ink);
    letter-spacing: -.1px; white-space: pre-wrap;
  }
  .msg .body.thinking {
    font-style: italic; color: var(--taupe);
  }

  /* Composer */
  .composer-wrap {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 10px 22px max(calc(56px + env(safe-area-inset-bottom)), 70px);
    background: linear-gradient(180deg,
      rgba(248, 241, 231, 0) 0%,
      rgba(248, 241, 231, .92) 18%,
      var(--cream) 38%);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .composer {
    max-width: 460px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    background: white;
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 22px; padding: 8px 8px 8px 16px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 18px 38px -28px rgba(140, 80, 50, .42),
      0 4px 12px -8px rgba(140, 80, 50, .18);
  }
  .composer textarea {
    flex: 1; border: none; outline: none; resize: none;
    background: transparent;
    font-family: inherit; font-size: 16px; line-height: 1.45;
    color: var(--ink); padding: 9px 4px;
    min-height: 22px; max-height: 140px;
  }
  .composer textarea::placeholder {
    color: var(--taupe); font-style: italic;
  }
  .composer .send {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--ink); color: #fff7f0;
    border: none; cursor: pointer; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-size: 18px;
    transition: transform .12s ease, opacity .15s ease;
  }
  .composer .send:disabled { opacity: .35; cursor: default; }
  .composer .send:active:not(:disabled) { transform: scale(.94); }
</style>
</head>
<body>

<div class="page-alys">
  <div class="alys-header" id="alys-header">
    <div class="orb-stage">
      <div id="alys-orb-mount"></div>
      <div class="here" id="alys-here">I'm here.</div>
      <div class="quiet" id="alys-quiet"></div>
    </div>

    <div class="eyebrow" id="obs-eyebrow" style="display:none">What I'm holding</div>
    <div id="obs-list"></div>

    <div class="eyebrow eyebrow-talk">Talk to me</div>
  </div>

  <div class="chat" id="chat"></div>
</div>

<div class="composer-wrap">
  <form class="composer" id="composer" onsubmit="event.preventDefault(); sendMessage();">
    <textarea id="composer-input" rows="1" placeholder="Say something…"
      oninput="autoSize(this); refreshSend()"></textarea>
    <button class="send" id="composer-send" type="submit" disabled aria-label="Send">↑</button>
  </form>
</div>

<div id="nav-mount"></div>

<script src="lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('alys');

// Mount the orb — smaller default (130px) so the frozen header
// doesn't dominate the viewport. Shrinks further when scroll-stuck.
(function bootOrb() {
  const mount = document.getElementById('alys-orb-mount');
  if (mount && typeof renderAlysOrb === 'function') {
    mount.innerHTML = renderAlysOrb({ size: 130 });
  }
})();

// Sticky-header shrink: when the page scrolls past ~60px the
// frozen header collapses to a compact pinned bar (small orb +
// "Talk to me" eyebrow) so chat reading isn't blocked.
(function bootStickyHeader() {
  const stage = document.getElementById('alys-header');
  if (!stage) return;
  let raf = null;
  function update() {
    raf = null;
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    stage.setAttribute('data-stuck', y > 60 ? 'true' : 'false');
  }
  window.addEventListener('scroll', () => {
    if (raf == null) raf = requestAnimationFrame(update);
  }, { passive: true });
  update();
})();

loadAll();

async function loadAll() {
  await Promise.all([loadObservations(), loadChat()]);
  paintQuietLine();
}

async function loadObservations() {
  const list = document.getElementById('obs-list');
  const eyebrow = document.getElementById('obs-eyebrow');
  try {
    const r = await api('/me/alys-observations?limit=3').catch(() => null);
    const items = (r && r.observations) || [];
    if (!items.length) {
      eyebrow.style.display = 'none';
      list.innerHTML = '';
      return;
    }
    eyebrow.style.display = '';
    list.innerHTML = items.map(o => `
      <div class="obs">
        <div class="said">${escapeHtml(o.text || '')}</div>
        ${o.link ? `<a class="where" href="${escapeHtml(o.link)}">${escapeHtml(o.link_label || 'see more')} →</a>` : ''}
      </div>`).join('');
  } catch (e) {
    eyebrow.style.display = 'none';
    list.innerHTML = '';
  }
}

async function loadChat() {
  const chat = document.getElementById('chat');
  try {
    const r = await api('/me/messages?limit=50').catch(() => ({ messages: [] }));
    const msgs = (r.messages || []).sort((a, b) =>
      new Date(a.created_at || a.ts) - new Date(b.created_at || b.ts));
    renderChat(msgs);
  } catch (e) {
    chat.innerHTML = '';
  }
}

function renderChat(msgs) {
  const chat = document.getElementById('chat');
  if (!msgs.length) {
    chat.innerHTML = '';
    return;
  }
  let html = '';
  let lastDay = '';
  for (const m of msgs) {
    const ts = new Date(m.created_at || m.ts);
    const day = ts.toLocaleDateString('en-AU',
      { weekday: 'short', day: 'numeric', month: 'short' });
    if (day !== lastDay) {
      html += `<div class="day-divider">${escapeHtml(day)}</div>`;
      lastDay = day;
    }
    const isAlys = (m.role === 'alys') || (m.from === 'alys') || m.is_alys;
    html += `
      <div class="msg">
        <div class="who ${isAlys ? 'alys' : ''}">${isAlys ? 'alys' : 'you'}</div>
        <div class="body">${escapeHtml(m.body || m.text || '')}</div>
      </div>`;
  }
  chat.innerHTML = html;
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
}

function paintQuietLine() {
  const el = document.getElementById('alys-quiet');
  const hasObs = document.getElementById('obs-list').children.length > 0;
  const hasChat = document.getElementById('chat').children.length > 0;
  const hour = new Date().getHours();
  let line = '';
  if (hasObs) {
    line = "A couple of things worth noticing. No verdicts — just what I see.";
  } else if (hour < 5 || hour >= 22) {
    line = "It's late. Whenever you need.";
  } else if (!hasChat) {
    line = "Nothing standing out from your data right now. That's not a verdict — just what I see.";
  } else {
    line = "Here, listening.";
  }
  el.textContent = line;
}

function autoSize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(140, el.scrollHeight) + 'px';
}
function refreshSend() {
  const text = document.getElementById('composer-input').value.trim();
  document.getElementById('composer-send').disabled = !text;
}

async function sendMessage() {
  const input = document.getElementById('composer-input');
  const text = input.value.trim();
  if (!text) return;
  document.getElementById('composer-send').disabled = true;

  appendMessage('you', text, false);
  appendMessage('alys', '…', true);
  input.value = '';
  autoSize(input);

  try {
    const r = await api('/me/message', {
      method: 'POST',
      body: JSON.stringify({ body: text }),
    });
    const reply = (r && (r.reply || r.alys_reply || r.body)) || '';
    replacePlaceholder(reply || "I'm here, but I didn't catch that. Try again?");
  } catch (e) {
    replacePlaceholder("I couldn't get that through. Try again in a moment.");
  } finally {
    refreshSend();
  }
}

function appendMessage(who, body, isThinking) {
  const chat = document.getElementById('chat');
  const isAlys = who === 'alys';
  const todayLabel = new Date().toLocaleDateString('en-AU',
    { weekday: 'short', day: 'numeric', month: 'short' });
  if (!chat.innerHTML.includes(todayLabel)) {
    chat.insertAdjacentHTML('beforeend',
      `<div class="day-divider">${escapeHtml(todayLabel)}</div>`);
  }
  chat.insertAdjacentHTML('beforeend', `
    <div class="msg" ${isThinking ? 'data-thinking="1"' : ''}>
      <div class="who ${isAlys ? 'alys' : ''}">${isAlys ? 'alys' : 'you'}</div>
      <div class="body ${isThinking ? 'thinking' : ''}">${escapeHtml(body)}</div>
    </div>`);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function replacePlaceholder(text) {
  const chat = document.getElementById('chat');
  const placeholder = chat.querySelector('.msg[data-thinking="1"]');
  if (placeholder) {
    placeholder.removeAttribute('data-thinking');
    const body = placeholder.querySelector('.body');
    if (body) {
      body.classList.remove('thinking');
      body.textContent = text;
    }
  } else {
    appendMessage('alys', text, false);
  }
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',
  }[c]));
}
</script>
</body>
</html>

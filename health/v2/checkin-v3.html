<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F1E7" />
<title>Check-in · Neeve</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
  /* Soft peach-to-cream gradient — matches the Today everyday design.
     The check-in flow lives on the same warm canvas. */
  :root {
    --ink-2: #2b2018;
    --clay-2: #bf5a3c;
    --taupe-2: #9a8369;
    --warm-card: #fffdf9;
  }
  body {
    background: linear-gradient(180deg, #f6e6d6 0%, #f6efe4 30%, #f6efe4 100%);
    background-attachment: fixed;
    color: var(--ink-2);
  }
  .checkin-page {
    max-width: 460px; margin: 0 auto;
    padding: 16px 22px max(96px, env(safe-area-inset-bottom));
    min-height: 100dvh; display: flex; flex-direction: column;
    animation: page-fade .5s ease;
  }
  @keyframes page-fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  /* ── Top bar: back + progress dots ─────────────────── */
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .back-btn {
    width: 36px; height: 36px; border-radius: 12px;
    background: white; border: 1px solid rgba(43,32,24,.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .back-btn svg { stroke: var(--ink); }
  .progress {
    flex: 1; display: flex; gap: 6px; align-items: center;
  }
  .progress .seg {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(43,32,24,.12);
    transition: background .2s ease;
  }
  .progress .seg.done { background: var(--ink); }
  .progress .seg.cur  { background: var(--terra); transform: scale(1.15); }
  .resume-banner {
    background: var(--cream); border: 1px solid rgba(43,32,24,.08);
    border-radius: 14px; padding: 10px 14px; margin-bottom: 14px;
    color: var(--ink-soft); font-size: 13px; line-height: 1.4;
  }

  /* ── Section page header ───────────────────────────── */
  .slot-label {
    font-family: 'Inter Tight', sans-serif;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--taupe); font-weight: 600;
    margin-bottom: 6px;
  }
  .section-title {
    font-family: 'Apricosa', 'Fraunces', serif; font-weight: 500;
    font-size: 32px; letter-spacing: -.6px; line-height: 1.1;
    color: var(--ink); margin-bottom: 10px;
  }
  /* Distinctive accent strip per template — same treatment as Today's
     slot cards. Each template has its own warm gradient identity so
     the user instantly knows where they are. */
  .section-accent {
    width: 56px; height: 4px; border-radius: 2px;
    margin-bottom: 26px;
  }
  .section-accent.baseline {
    background: linear-gradient(90deg, #f5b78c 0%, #ecd6a7 100%);
  }
  .section-accent.migraine {
    background: linear-gradient(90deg, #c97f6a 0%, #bf5a3c 100%);
  }
  .section-accent.pots {
    background: linear-gradient(90deg, #b8709a 0%, #8f6c86 100%);
  }
  .section-accent.anxiety {
    background: linear-gradient(90deg, #c5d4a7 0%, #94a87a 100%);
  }
  .section-accent.cycle {
    background: linear-gradient(90deg, #f0a890 0%, #cb8270 100%);
  }

  /* ── Question card ───────────────────────────────────
     Crafted depth matching Today's slot cards. Sequential rise-up
     animation gives each question its own moment. */
  .q {
    background: linear-gradient(180deg, #ffffff 0%, #fffaf2 100%);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 12px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 18px 34px -26px rgba(140, 80, 50, .32),
      0 3px 10px -6px rgba(140, 80, 50, .1);
    animation: q-rise .42s ease both;
  }
  @keyframes q-rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .q:nth-child(2) { animation-delay: .06s; }
  .q:nth-child(3) { animation-delay: .12s; }
  .q:nth-child(4) { animation-delay: .18s; }
  .q:nth-child(5) { animation-delay: .24s; }
  .q:nth-child(6) { animation-delay: .30s; }
  .q:nth-child(7) { animation-delay: .36s; }
  .q:nth-child(8) { animation-delay: .42s; }
  .qtext {
    font-family: 'Apricosa', 'Fraunces', serif; font-weight: 500;
    font-size: 18px; line-height: 1.32; color: var(--ink);
    margin: 0 0 14px;
  }
  .hint {
    font-size: 12.5px; color: var(--ink-mute);
    margin-top: 8px;
  }
  .hint a { color: var(--terra); text-decoration: none; cursor: pointer; }

  /* Scale */
  .scale-row {
    display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px;
  }
  .scale-num {
    font-family: 'Apricosa', 'Fraunces', serif; font-weight: 500;
    font-size: 32px; line-height: 1; color: var(--ink);
    min-width: 48px;
  }
  .scale-word {
    font-size: 14px; color: var(--ink-soft);
  }
  .scale-slider {
    -webkit-appearance: none; appearance: none; width: 100%;
    height: 4px; background: rgba(43,32,24,.12); border-radius: 2px;
    outline: none;
  }
  .scale-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--ink);
    cursor: pointer;
  }
  .scale-slider::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--ink); border: none; cursor: pointer;
  }
  .scale-ends {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--ink-mute); margin-top: 6px;
  }

  /* Numeric */
  .numeric-row {
    display: flex; align-items: baseline; gap: 10px;
  }
  .numeric-input {
    font-family: 'Apricosa', 'Fraunces', serif; font-weight: 500;
    font-size: 28px; line-height: 1; color: var(--ink);
    background: var(--cream); border: 1px solid rgba(43,32,24,.1);
    border-radius: 10px; padding: 8px 12px;
    width: 92px; text-align: center;
    box-sizing: border-box;
  }
  .numeric-unit { font-size: 14.5px; color: var(--ink-soft); }

  /* Choice */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 10px 16px; border-radius: 99px;
    border: 1px solid rgba(43,32,24,.12);
    background: white;
    font-family: inherit; font-size: 14px;
    color: var(--ink-soft); cursor: pointer;
  }
  .chip.on { background: var(--ink); color: #fff7f0; border-color: var(--ink); }

  /* Text */
  .text-input {
    width: 100%; box-sizing: border-box;
    background: var(--cream); border: 1px solid rgba(43,32,24,.1);
    border-radius: 10px; padding: 12px 14px;
    font-family: inherit; font-size: 16px; line-height: 1.45;
    color: var(--ink); resize: vertical; min-height: 70px;
  }

  /* ── Bottom actions ────────────────────────────────── */
  .actions {
    display: flex; gap: 10px; align-items: center;
    margin-top: 18px;
  }
  .actions .skip {
    background: transparent; border: 1px solid rgba(43,32,24,.12);
    color: var(--ink-soft); font-family: inherit; font-size: 14px;
    padding: 12px 18px; border-radius: 99px; cursor: pointer;
  }
  .actions .next {
    flex: 1; background: var(--ink); color: #fff7f0;
    border: none; font-family: inherit; font-size: 15px; font-weight: 500;
    padding: 14px 22px; border-radius: 99px; cursor: pointer;
  }
  .actions .next.submit { background: var(--terra); }

  /* ── Done / envelope screen ────────────────────────── */
  .envelope {
    background: white; border: 1px solid rgba(43,32,24,.08);
    border-radius: 18px; padding: 24px 22px; margin-top: 28px;
  }
  .envelope-title {
    font-family: 'Apricosa', 'Fraunces', serif; font-weight: 500;
    font-size: 26px; letter-spacing: -.3px; color: var(--ink);
    margin-bottom: 10px;
  }
  .envelope-summary {
    font-family: 'Apricosa', 'Fraunces', serif; font-weight: 500;
    font-size: 16px; line-height: 1.45; color: var(--ink);
    margin-bottom: 16px;
  }
  .envelope-line {
    font-size: 13.5px; color: var(--ink-soft);
    line-height: 1.5; margin-top: 4px;
  }
  .envelope-actions {
    display: flex; gap: 10px; margin-top: 24px;
  }
  .envelope-actions .btn {
    flex: 1; padding: 13px 16px; border-radius: 99px;
    font-family: inherit; font-size: 14.5px; font-weight: 500;
    border: 1px solid rgba(43,32,24,.12); cursor: pointer;
    text-align: center; text-decoration: none;
  }
  .envelope-actions .btn.primary {
    background: var(--ink); color: #fff7f0; border-color: var(--ink);
  }
  .envelope-actions .btn.ghost {
    background: white; color: var(--ink);
  }

  /* ── View-only mode (?checkin=<id>) ─────────────────── */
  .view-area { animation: fade .22s ease; padding-bottom: 80px; }
  .view-summary {
    font-family: 'Apricosa', 'Fraunces', serif; font-weight: 500;
    font-size: 24px; line-height: 1.3; color: var(--ink);
    letter-spacing: -.3px; margin: 4px 0 18px;
  }
  .co-witness {
    background: var(--cream); border: 1px solid rgba(43,32,24,.08);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 22px;
  }
  .co-witness-eyebrow {
    font-family: 'Inter Tight', sans-serif;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--taupe); font-weight: 600; margin-bottom: 10px;
  }
  .co-witness-group {
    margin-bottom: 14px;
  }
  .co-witness-group:last-child { margin-bottom: 0; }
  .co-witness-group h4 {
    font-family: 'Inter Tight', sans-serif;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--terra); font-weight: 600; margin: 0 0 6px;
  }
  .co-witness-row {
    display: flex; justify-content: space-between;
    font-size: 14px; color: var(--ink); padding: 3px 0;
  }
  .co-witness-row .key { color: var(--ink-soft); }
  .view-list {
    background: white; border: 1px solid rgba(43,32,24,.08);
    border-radius: 16px; overflow: hidden;
  }
  .view-section-head {
    font-family: 'Inter Tight', sans-serif;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--terra); font-weight: 600;
    background: var(--cream); padding: 10px 18px;
  }
  .view-row {
    padding: 12px 18px; border-bottom: 1px solid rgba(43,32,24,.06);
  }
  .view-row:last-child { border-bottom: 0; }
  .view-q { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  .view-a { font-size: 15.5px; color: var(--ink); }
  .view-a strong { font-weight: 600; }
  .view-soft { color: var(--ink-mute); font-weight: 400; }
  .view-empty-val { color: var(--ink-mute); }
  .view-back {
    display: inline-block; margin-top: 22px;
    color: var(--terra); text-decoration: none; font-size: 14px;
  }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink); }
  .empty-state h2 { font-family: 'Apricosa', 'Fraunces', serif; font-weight: 500; font-size: 22px; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 18px; }

  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .page-anim { animation: fade .22s ease; }

  /* ── Single-scroll groups (v3) ─────────────────────── */
  .cigroup { background: var(--warm-card,#fffdf9); border:1px solid rgba(43,32,24,.06);
             border-radius:18px; padding:4px 16px 14px; margin-bottom:16px; }
  .cigroup-head { display:flex; align-items:center; gap:8px;
             font-family:'Hanken Grotesk',sans-serif; font-size:11px; letter-spacing:.09em;
             text-transform:uppercase; color:var(--taupe-2,#9a8369); font-weight:600;
             padding:14px 0 2px; }
  .cigroup-head .section-accent { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .cigroup .q { padding:14px 0; border-bottom:1px solid rgba(43,32,24,.05); }
  .cigroup .q:last-child { border-bottom:none; }
  .cigroup .q.gated[hidden], .q.gated[style*="display: none"] { display:none; }


  /* ── Tap-dot scales (v3, mock look) ────────────────── */
  .scale-head { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .scale-head .scale-num { font-family:'Apricosa','Fraunces',serif; font-weight:500;
        font-size:30px; line-height:1; color:var(--clay-2,#bf5a3c); min-width:30px; }
  .usual { font-size:11px; letter-spacing:.03em; color:var(--taupe-2,#9a8369); font-weight:500; }
  .dotbar { position:relative; display:flex; gap:4px; margin-top:4px; }
  .dotbar .dot { flex:1; height:32px; border-radius:9px; border:none;
        background:rgba(43,32,24,.06); color:var(--taupe-2,#9a8369);
        font-size:10px; font-family:inherit; cursor:pointer;
        transition:background .14s, color .14s; -webkit-tap-highlight-color:transparent; }
  .dotbar .dot.on  { background:#e0998b; color:#fff7f0; }
  .dotbar .dot.cur { background:#bf5a3c; color:#fff7f0; }
  .dotbar .dot:active { transform:scale(.92); }
  .basemark { position:absolute; top:-5px; bottom:-5px; width:2px; z-index:2;
        background:rgba(43,32,24,.42); border-radius:2px; transform:translateX(-1px); pointer-events:none; }
  .basemark::after { content:'usual'; position:absolute; top:-12px; left:50%; transform:translateX(-50%);
        font-size:7.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--taupe-2,#9a8369); white-space:nowrap; }


  /* per-category scale colour + ring-filled (v3) */
  .dotbar .dot.on  { background: var(--fill,#e0998b); color:#fff7f0; }
  .dotbar .dot.cur { background: var(--fill,#bf5a3c); filter:brightness(.82); color:#fff7f0; }
  .ring-filled { padding:14px 0; border-bottom:1px solid rgba(43,32,24,.05); }
  .cigroup .ring-filled:last-child { border-bottom:none; }
  .ring-line { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .ring-q { font-family:'Apricosa','Fraunces',serif; font-weight:500; font-size:15.5px; color:var(--ink); }
  .ring-val { font-size:14px; color:var(--clay-2,#bf5a3c); font-weight:600; }
  .ring-val em { font-style:normal; color:var(--taupe-2,#9a8369); font-weight:500; font-size:11.5px; }
  .ring-change { font-size:12px; color:var(--taupe-2,#9a8369); cursor:pointer; margin-left:auto; text-decoration:underline; }


  /* ── Match the mock: flat airy rows on cream, no cards ───────── */
  .cigroup { background:transparent; border:none; border-radius:0; padding:0; margin-bottom:2px; box-shadow:none; }
  .cigroup-head { padding:20px 0 0; font-size:10px; letter-spacing:.1em; color:var(--taupe-2,#9a8369); }
  .cigroup-head .section-accent { width:7px; height:7px; }
  .q { background:transparent; border:none; border-radius:0; box-shadow:none; padding:20px 0 16px; margin:0; }
  .cigroup .q { border-bottom:1px solid rgba(43,32,24,.08); }
  .cigroup .q:last-child { border-bottom:none; }
  .qtext { font-size:21px; line-height:1.2; margin:0 0 16px; }
  .scale-ends { margin-top:8px; }
  .scale-head .scale-num { font-size:26px; }
  .dotbar .dot { height:34px; border-radius:9px; }
  /* bottom save pill — match the mock */
  .actions { margin-top:24px; }
  .actions .next.submit { border-radius:99px; padding:16px; font-size:15px; }


  /* short label + sublabel (mock) */
  .qtext .qsub { display:block; font-family:'Hanken Grotesk',sans-serif; font-weight:600;
    font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--taupe-2,#9a8369); margin-top:4px; }


  /* per-item "+ note" + global note (v3) */
  .addnote { display:inline-block; font-size:12px; color:var(--clay-2,#bf5a3c); font-weight:600; cursor:pointer; margin-top:10px; -webkit-tap-highlight-color:transparent; }
  .inlinenote { margin-top:8px; }
  .inlinenote[hidden] { display:none; }
  .notefield { width:100%; box-sizing:border-box; background:var(--warm-card,#fffdf9);
    border:1px solid rgba(43,32,24,.12); border-radius:12px; padding:12px 14px;
    font-family:'Fraunces',serif; font-style:italic; font-size:15px; line-height:1.5;
    color:var(--ink); resize:vertical; min-height:54px; outline:none; }
  .notefield::placeholder { color:var(--taupe-2,#9a8369); font-style:italic; }
  .notegroup .cigroup-head { color:var(--ink); font-family:'Apricosa','Fraunces',serif;
    font-size:16px; font-weight:500; text-transform:none; letter-spacing:0; padding:18px 0 10px; }

</style>
</head>
<body>

<div class="checkin-page" id="page">
  <div class="topbar" id="topbar">
    <div class="back-btn" id="btn-back" onclick="history.back()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 18 4 12 10 6"/>
      </svg>
    </div>
    <div class="progress" id="progress"></div>
  </div>
  <div id="resume" class="resume-banner" style="display:none">Resuming where you left off.</div>
  <div id="main"></div>
</div>

<div id="nav-mount"></div>

<script src="lib.js"></script>
<script>
(async function () {
  // ── State ─────────────────────────────────────────
  const params      = new URLSearchParams(location.search);
  let   sessionId   = params.get('session');
  const checkinId   = params.get('checkin');         // view-mode
  const viewMode    = !!checkinId;

  let session = null;
  let sections = [];        // array of section objects [{key, name, accent, questions: [...]}]
  let answers  = {};
  let sectionIdx = 0;

  // Per-question in-flight values (so we can save on Next even if user
  // hasn't blurred a field yet).
  let inflight = {};

  // For carry-forward defaults — populated by fetching the most recent
  // same-slot check-in once we know the slot.
  let yesterdayAnswers = {};

  // Keys that benefit from carry-forward (scales the user is unlikely
  // to change every single day).
  const CARRY_FORWARD = new Set([
    'sleep', 'mood', 'fatigue', 'fog', 'anxiety', 'energy', 'pain', 'headache'
  ]);

  document.getElementById('nav-mount').innerHTML = renderNav('checkin');

  // ── Routing & loading ──────────────────────────────
  async function loadCheckinForView() {
    const res = await fetch(API_BASE + '/me/checkin/' + encodeURIComponent(checkinId), {
      headers: { 'Authorization': 'Bearer ' + getToken() },
    });
    if (!res.ok) throw new Error('couldnt_load_checkin');
    const data = await res.json();
    if (!data.checkin) throw new Error('not_found');
    return data.checkin;
  }

  async function routeByState() {
    try {
      const r = await api('/me/checkins?days=1');
      const checkins = r.checkins || [];
      const hour = new Date().getHours();
      const slot = hour < 14 ? 'morning' : 'evening';
      const today = new Date().toDateString();
      const done = checkins.find(c =>
        c.slot === slot &&
        new Date(c.completed_at).toDateString() === today);
      if (done) {
        location.replace('/health/v2/record.html');
        return true;
      }
    } catch (_) {}
    return false;
  }

  async function startNewSession() {
    const hour = new Date().getHours();
    const slot = hour < 14 ? 'morning' : 'evening';
    try {
      const r = await api('/me/start-checkin', {
        method: 'POST',
        body: JSON.stringify({ slot }),
      });
      if (r.success && r.sessionId) return r.sessionId;
      showEmpty('Nothing to check in on yet',
        r.message || 'Pick what you want to track from More → Templates, then come back.');
    } catch (e) {
      showEmpty("Couldn't start check-in", (e && e.message) ? String(e.message).slice(0, 200) : 'Try again in a moment.');
    }
    return null;
  }

  async function loadSession() {
    const res = await fetch(API_BASE + '/session/' + sessionId);
    if (!res.ok) throw new Error('bad session');
    session = await res.json();
    if (session.error) throw new Error(session.error);

    // Convert sections from the API into local objects with accent keys.
    sections = (session.sections || []).map(s => ({
      key: s.key || s.name || 'baseline',
      name: s.name || s.key || 'Section',
      accent: pickAccent(s.key || s.name),
      questions: s.questions || [],
    })).filter(s => s.questions.length > 0);

    if (sections.length === 0) {
      showEmpty('All done for now', 'No questions queued. Try again later.');
      throw new Error('empty');
    }

    answers = session.answers || {};
    inflight = {};

    // Figure out resume position: first section with an unanswered question.
    let resumeAt = 0;
    for (let i = 0; i < sections.length; i++) {
      const allDone = sections[i].questions.every(q => q.key in answers);
      if (!allDone) { resumeAt = i; break; }
      if (i === sections.length - 1) resumeAt = i;
    }
    sectionIdx = resumeAt;

    // Show the resume banner if there are already answers.
    if (Object.keys(answers).length > 0) {
      document.getElementById('resume').style.display = '';
    }

    // Load yesterday's answers for carry-forward defaults (best-effort).
    try {
      const slot = session.slot;
      const r = await api(`/me/checkins?days=3&slot=${encodeURIComponent(slot)}`);
      const prior = (r.checkins || []).find(c => c.slot === slot);
      if (prior && prior.answers) yesterdayAnswers = prior.answers;
    } catch (_) {}
  }

  function pickAccent(key) {
    if (!key) return 'baseline';
    const k = String(key).toLowerCase();
    if (k.includes('migraine') || k.includes('headache')) return 'migraine';
    if (k.includes('pots'))                                return 'pots';
    if (k.includes('anxiety'))                             return 'anxiety';
    if (k.includes('cycle') || k.includes('menstrual'))    return 'cycle';
    return 'baseline';
  }

  // ── Render: single-scroll — every section stacked on one page ──
  function renderCurrentSection() {
    inflight = {};
    const slotName = session.slot === 'morning' ? 'Morning check-in' : 'Evening check-in';
    const title = session.slot === 'morning'
      ? 'How did last night go, and how are you now?'
      : 'How did today go?';

    let html = '<div class="page-anim">';
    html += `<div class="slot-label">${slotName}</div>`;
    html += `<h1 class="section-title">${title}</h1>`;

    for (const s of sections) {
      html += `<div class="cigroup"><div class="cigroup-head"><span class="section-accent ${s.accent}"></span>${escapeHtml(s.name)}</div>`;
      for (const q of s.questions) {
        const saved = (q.key in answers) ? answers[q.key] : null;
        const carry = (saved == null && CARRY_FORWARD.has(q.key) && yesterdayAnswers[q.key] != null)
          ? yesterdayAnswers[q.key] : null;
        const ring  = q.ring_suggestion && q.ring_suggestion.value != null
          ? q.ring_suggestion.value : null;

        // The ring already knows this (e.g. sleep) — don't ask it. Show it
        // confirmed + auto-save; "change" expands it to a manual entry.
        if (ring != null && saved == null && !ringExpanded.has(q.key)) {
          const unit = q.key === 'sleep' ? 'h' : '';
          html += `<div class="ring-filled" data-q="${escapeHtml(q.key)}" data-ringval="${ring}">
            <div class="ring-line"><span class="ring-q">${escapeHtml(q.question)}</span>
            <span class="ring-val">${ring}${unit} <em>from your ring</em></span>
            <a class="ring-change" onclick="expandRing('${escapeHtml(q.key)}')">change</a></div></div>`;
          continue;
        }

        const gAttr = q.gated_by
          ? ` data-gated-by="${escapeHtml(q.gated_by)}" data-gate-baseline="${q.gate_baseline == null ? '' : q.gate_baseline}" data-gate-direction="${escapeHtml(q.gate_direction || 'higher_is_worse')}"`
          : '';
        html += '<div class="q' + (q.gated_by ? ' gated' : '') + '" data-q="' + escapeHtml(q.key) + '"' + gAttr + '>';
        const lbl = LABELS[q.key];
        html += `<p class="qtext">${lbl ? escapeHtml(lbl[0]) + '<small class="qsub">' + escapeHtml(lbl[1]) + '</small>' : escapeHtml(q.question)}</p>`;
        const initial = (saved != null) ? saved
                      : (carry != null) ? carry
                      : (ring  != null) ? ring : null;

        if (q.type === 'scale')       html += renderScale(q, initial);
        else if (q.type === 'choice') html += renderChoice(q, initial);
        else if (q.type === 'numeric') html += renderNumeric(q, initial);
        else                           html += renderText(q, initial);

        // per-item "+ note" (scales) — optional, attaches to this item
        if (q.type === 'scale') {
          const nk = q.key + '__note';
          const nv = answers[nk] != null ? String(answers[nk]) : '';
          html += `<a class="addnote">＋ note</a><div class="inlinenote"${nv ? '' : ' hidden'}><textarea class="notefield" data-notekey="${escapeHtml(nk)}" rows="2" placeholder="anything to add about this…">${escapeHtml(nv)}</textarea></div>`;
        }

        if (saved == null && carry != null) {
          html += `<div class="hint">Carried forward from yesterday — <a onclick="clearCarry('${escapeHtml(q.key)}')">change ↺</a></div>`;
        }
        html += '</div>';
      }
      html += '</div>';
    }

    // Global "anything you want to add?" note
    html += `<div class="cigroup notegroup"><div class="cigroup-head">Anything you want to add?</div>
      <textarea class="notefield notefield-big" data-notekey="anything_new" rows="3" placeholder="Skip if nothing — that's fine.">${escapeHtml(answers['anything_new'] != null ? String(answers['anything_new']) : '')}</textarea></div>`;
    html += '<div class="actions"><button class="next submit" type="button" onclick="submitAll()">Save check-in</button></div>';
    html += '</div>';
    document.getElementById('main').innerHTML = html;
    attachAllHandlers(sections[0] || null);
    applyGates();
  }

  async function submitAll() {
    flushInflight();
    await submitEnvelope();
  }
  window.submitAll = submitAll;

  let ringExpanded = new Set();
  window.expandRing = function(k) { ringExpanded.add(k); renderCurrentSection(); };

  // ── Baseline gating ────────────────────────────────
  // Detail questions tagged by the server (gated_by / gate_baseline /
  // gate_direction) show only when their headline scale comes in worse
  // than the user's own baseline. Missing value or baseline → show.
  // Re-evaluated live as the headline slider moves.
  function gateCurrentVal(key) {
    if (key in inflight && inflight[key] != null) return inflight[key];
    if (key in answers && answers[key] != null)   return answers[key];
    return null;
  }
  function gateShouldShow(gatedBy, baseStr, direction) {
    const base = (baseStr === '' || baseStr == null) ? null : Number(baseStr);
    if (base === null || !isFinite(base)) return true;   // no baseline → can't gate, show
    const hv = gateCurrentVal(gatedBy);
    if (hv == null || hv === '') return false;           // headline not set yet → hide; reveal when set above usual
    const val = Number(hv);
    if (!isFinite(val)) return false;
    return direction === 'higher_is_better' ? (val < base) : (val > base);
  }
  function applyGates() {
    document.querySelectorAll('.q.gated').forEach(el => {
      const show = gateShouldShow(el.dataset.gatedBy, el.dataset.gateBaseline, el.dataset.gateDirection);
      el.style.display = show ? '' : 'none';
    });
  }

  function renderProgress() {
    const total = sections.length || 1;
    const dots = [];
    for (let i = 0; i < total; i++) {
      let cls = 'seg';
      if (i < sectionIdx) cls += ' done';
      else if (i === sectionIdx) cls += ' cur';
      dots.push(`<div class="${cls}"></div>`);
    }
    document.getElementById('progress').innerHTML = dots.join('');
  }

  // ── Question renderers ─────────────────────────────
  const scaleWords = ['rough','rough','tough','tough','okay','okay','pretty good','pretty good','bright','bright','bright'];

  // Short labels + sublabels (mock look). Maps the DB question to a clean
  // headline + small context line. Keys not listed keep their full question.
  const LABELS = {
    sleep:                 ['Sleep', 'last night'],
    morning_energy:        ['Energy', 'this morning'],
    morning_mood:          ['Mood', 'this morning'],
    morning_clarity:       ['Head', 'how clear, right now'],
    morning_anxiety_level: ['Anxiety', 'right now'],
    morning_fatigue_level: ['Fatigue', 'this morning'],
    pem:                   ['Yesterday', 'did it catch up with you?'],
    fatigue_level:         ['Fatigue', 'today overall'],
    pain_level:            ['Pain', 'today, at its worst'],
    fog_level:             ['Brain fog', 'right now'],
    mood:                  ['Mood', 'right now'],
    anxiety_level:         ['Anxiety', 'right now'],
    overall:               ['Overall', 'how your body felt today'],
    gut_discomfort:        ['Gut', 'today'],
    energy:                ['Energy', 'today'],
    stress:                ['Stress', 'today'],
    heart_rate:            ['Heart', 'racing or pounding, today'],
    period_pain:           ['Period pain', 'today'],
  };
  function scaleColour(key) {
    const k = String(key || '');
    if (k.includes('sleep')) return '#9bb088';                                                  // sage
    if (k.includes('mood') || k.includes('energy') || k.includes('clarity')) return '#d4a64a';  // butter
    if (k.includes('gut') || k.includes('dizz') || k.includes('heart') || k.includes('pots') || k.includes('orthostatic')) return '#97718c'; // plum
    return '#cf7350';                                                                            // clay (pain/fatigue/fog/anxiety/overall)
  }
  function renderScale(q, initial) {
    const v = (initial == null) ? null : Math.max(0, Math.min(10, Math.round(Number(initial))));
    const base = (q.baseline != null) ? Math.max(0, Math.min(10, Math.round(Number(q.baseline)))) : null;
    const colour = scaleColour(q.key);
    let dots = '';
    for (let n = 0; n <= 10; n++) {
      const on  = (v != null && n <= v) ? ' on' : '';
      const cur = (v != null && n === v) ? ' cur' : '';
      dots += `<button type="button" class="dot${on}${cur}" data-q="${escapeHtml(q.key)}" data-n="${n}">${n}</button>`;
    }
    const usual = base != null ? `<span class="usual">usual ${base}</span>` : '';
    const mark  = base != null ? `<span class="basemark" style="left:${(base/10*100).toFixed(1)}%"></span>` : '';
    return `
      <div class="scale-head"><span class="scale-num" id="val-${escapeHtml(q.key)}" style="color:${colour}">${v == null ? '–' : v}</span>${usual}</div>
      <div class="dotbar" data-q="${escapeHtml(q.key)}" style="--fill:${colour}">${mark}${dots}</div>
      <div class="scale-ends"><span>rough</span><span>bright</span></div>`;
  }

  function renderChoice(q, initial) {
    const opts = q.options || [];
    return `<div class="chips">` + opts.map(o => {
      const value = (o && typeof o === 'object') ? (o.value ?? o.label ?? o) : o;
      const label = (o && typeof o === 'object') ? (o.label ?? o.value ?? o) : o;
      const on = (initial == value) ? 'on' : '';
      return `<button type="button" class="chip ${on}" data-q="${escapeHtml(q.key)}" data-v="${escapeHtml(String(value))}">${escapeHtml(String(label))}</button>`;
    }).join('') + `</div>`;
  }

  function renderNumeric(q, initial) {
    const v = (initial == null) ? '' : String(initial);
    const unit = q.unit || q.key === 'sleep' ? 'h' : '';
    return `
      <div class="numeric-row">
        <input class="numeric-input" type="number" inputmode="decimal" step="0.5"
               data-q="${escapeHtml(q.key)}" value="${escapeHtml(v)}" />
        <span class="numeric-unit">${escapeHtml(q.unit || unit)}</span>
      </div>`;
  }

  function renderText(q, initial) {
    const v = initial == null ? '' : String(initial);
    return `<textarea class="text-input" data-q="${escapeHtml(q.key)}" rows="2"
              placeholder="Anything you want noted">${escapeHtml(v)}</textarea>`;
  }

  // ── Handlers ───────────────────────────────────────
  function attachAllHandlers(s) {
    // Ring-filled values (e.g. sleep) — auto-capture so they save without asking
    document.querySelectorAll('.ring-filled[data-ringval]').forEach(el => {
      const k = el.dataset.q; const v = Number(el.dataset.ringval);
      if (!Number.isNaN(v)) inflight[k] = v;
    });
    // Scales (tap-dot bars)
    document.querySelectorAll('.dotbar').forEach(bar => {
      const k = bar.dataset.q;
      const cur = bar.querySelector('.dot.cur');
      // capture carried/saved value so it persists even if never tapped
      if (cur) inflight[k] = Number(cur.dataset.n);
      bar.querySelectorAll('.dot').forEach(d => {
        d.addEventListener('click', () => {
          const v = Number(d.dataset.n);
          bar.querySelectorAll('.dot').forEach(x => {
            const n = Number(x.dataset.n);
            x.classList.toggle('on', n <= v);
            x.classList.toggle('cur', n === v);
          });
          const valEl = document.getElementById('val-' + k);
          if (valEl) valEl.textContent = v;
          inflight[k] = v;
          saveAnswer(k, v);
          applyGates();
        });
      });
    });
    // Choices
    document.querySelectorAll('.chip[data-q]').forEach(el => {
      el.addEventListener('click', () => {
        const k = el.dataset.q;
        const v = el.dataset.v;
        document.querySelectorAll(`.chip[data-q="${k}"]`).forEach(c => c.classList.remove('on'));
        el.classList.add('on');
        inflight[k] = v;
        saveAnswer(k, v);
      });
      if (el.classList.contains('on')) {
        inflight[el.dataset.q] = el.dataset.v;
      }
    });
    // Numerics
    document.querySelectorAll('input.numeric-input').forEach(el => {
      const k = el.dataset.q;
      el.addEventListener('input',  () => { inflight[k] = el.value === '' ? null : Number(el.value); });
      el.addEventListener('change', () => { saveAnswer(k, el.value === '' ? null : Number(el.value)); });
      if (el.value !== '') inflight[k] = Number(el.value);
    });
    // Text
    document.querySelectorAll('textarea.text-input').forEach(el => {
      const k = el.dataset.q;
      el.addEventListener('input',  () => { inflight[k] = el.value || null; });
      el.addEventListener('blur',   () => { saveAnswer(k, el.value || null); });
      if (el.value) inflight[k] = el.value;
    });
    // "+ note" toggles + note fields (per-item and the global note)
    document.querySelectorAll('.addnote').forEach(a => {
      a.addEventListener('click', () => {
        const n = a.nextElementSibling;
        if (n && n.classList.contains('inlinenote')) {
          n.hidden = !n.hidden;
          if (!n.hidden) { const t = n.querySelector('textarea'); if (t) t.focus(); }
        }
      });
    });
    document.querySelectorAll('textarea.notefield').forEach(el => {
      const k = el.dataset.notekey;
      if (el.value) inflight[k] = el.value;
      el.addEventListener('input', () => { inflight[k] = el.value || null; });
      el.addEventListener('blur',  () => { saveAnswer(k, el.value || null); });
    });
  }

  function saveAnswer(key, value) {
    answers[key] = value;
    fetch(API_BASE + '/session/' + sessionId + '/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value, step: sectionIdx }),
    }).catch(() => {});
  }

  function flushInflight() {
    // Push any in-flight values that weren't yet saved (e.g. never
    // blurred). Best-effort.
    Object.entries(inflight).forEach(([k, v]) => {
      if (answers[k] === v) return;
      saveAnswer(k, v);
    });
  }

  // ── Section navigation ─────────────────────────────
  function goNext() {
    flushInflight();
    sectionIdx++;
    if (sectionIdx >= sections.length) submitEnvelope();
    else renderCurrentSection();
  }
  function skipSection() {
    // Mark all questions in this section as null (explicit skip).
    const s = sections[sectionIdx];
    for (const q of s.questions) saveAnswer(q.key, null);
    sectionIdx++;
    if (sectionIdx >= sections.length) submitEnvelope();
    else renderCurrentSection();
  }
  function clearCarry(key) {
    // User tapped "change ↺" — reset to default (5 for scales,
    // empty for numerics/text). Re-render the page in place.
    delete answers[key];
    inflight[key] = null;
    renderCurrentSection();
  }
  // Expose handlers for inline onclick=
  window.goNext       = goNext;
  window.skipSection  = skipSection;
  window.clearCarry   = clearCarry;

  // ── Submit / envelope screen ───────────────────────
  async function submitEnvelope() {
    flushInflight();

    // Loading state
    document.getElementById('progress').innerHTML =
      sections.map(() => '<div class="seg done"></div>').join('');
    document.getElementById('resume').style.display = 'none';
    document.getElementById('main').innerHTML = `
      <div class="page-anim">
        <div class="envelope">
          <div class="envelope-title">Logged.</div>
          <div class="envelope-line">Just a moment — sealing the envelope.</div>
        </div>
      </div>`;

    let result = null;
    try {
      const res = await fetch(API_BASE + '/session/' + sessionId + '/complete', { method: 'POST' });
      result = await res.json();
    } catch (e) {}

    const summary = summariseAnswers(answers);
    const ring = result?.checkin?.ring_snapshot || {};
    const env  = result?.checkin?.environment_snapshot || {};
    const id   = result?.checkin?.checkin_id;

    const lines = [];
    // Ring co-witness line — only show if we have anything meaningful.
    const ringBits = [];
    if (ring.hr_avg)           ringBits.push(`HR ${Math.round(ring.hr_avg)}`);
    if (ring.hrv_avg)          ringBits.push(`HRV ${Math.round(ring.hrv_avg)}`);
    if (ring.sleep_total_min)  ringBits.push(`${Math.floor(ring.sleep_total_min/60)}h ${Math.round(ring.sleep_total_min%60)}m sleep`);
    if (ringBits.length)       lines.push(`Last night: ${ringBits.join(', ')}.`);

    // Environment co-witness line
    const envBits = [];
    if (env.temperature != null) envBits.push(`${Math.round(env.temperature)}°`);
    if (env.weather_label)        envBits.push(env.weather_label);
    if (envBits.length)           lines.push(`${session.slot === 'morning' ? 'This morning' : 'This evening'}: ${envBits.join(', ')}.`);

    const linesHtml = lines.map(l => `<div class="envelope-line">${escapeHtml(l)}</div>`).join('');

    document.getElementById('main').innerHTML = `
      <div class="page-anim">
        <div class="envelope">
          <div class="envelope-title">Logged.</div>
          <div class="envelope-summary">${escapeHtml(summary)}</div>
          ${linesHtml}
          <div class="envelope-actions">
            ${id ? `<a class="btn ghost" href="checkin.html?checkin=${encodeURIComponent(id)}">See the full check-in</a>` : ''}
            <a class="btn primary" href="today.html">Done</a>
          </div>
        </div>
      </div>`;
  }

  // ── View-only render ───────────────────────────────
  function renderViewMode(checkin) {
    const answers = checkin.answers || {};
    const sectionsView = checkin.sections || [];  // grouped by template
    const slot = checkin.slot || 'morning';
    const slotLabel = slot === 'morning' ? 'Morning' : 'Evening';
    const when = checkin.completed_at
      ? new Date(checkin.completed_at).toLocaleString('en-AU', {
          weekday: 'short', day: 'numeric', month: 'short',
          hour: 'numeric', minute: '2-digit',
        }) : '';
    const summary = summariseAnswers(answers);
    const ring = checkin.ring_snapshot || {};
    const env  = checkin.environment_snapshot || {};

    document.getElementById('progress').style.display = 'none';
    document.getElementById('resume').style.display = 'none';

    let html = '<div class="view-area page-anim">';
    html += `<div class="slot-label">${slotLabel} check-in${when ? ' · ' + escapeHtml(when) : ''}</div>`;
    html += `<h1 class="view-summary">${escapeHtml(summary)}</h1>`;

    // Co-witness card
    const ringRows = [];
    if (ring.sleep_total_min)  ringRows.push(['sleep', `${Math.floor(ring.sleep_total_min/60)}h ${Math.round(ring.sleep_total_min%60)}m`]);
    if (ring.hr_avg)           ringRows.push(['HR overnight', `${Math.round(ring.hr_avg)} avg`]);
    if (ring.hrv_avg)          ringRows.push(['HRV', `${Math.round(ring.hrv_avg)} ms`]);
    if (ring.resp_avg)         ringRows.push(['resp rate', `${Math.round(ring.resp_avg)} br/min`]);
    const envRows = [];
    if (env.temperature != null)         envRows.push(['weather', `${Math.round(env.temperature)}°${env.weather_label ? ', ' + env.weather_label : ''}`]);
    if (env.air_quality_index != null)   envRows.push(['air quality', `AQI ${env.air_quality_index}`]);
    if (env.pollen_grass != null)        envRows.push(['pollen', env.pollen_label || 'logged']);
    if (env.uv_index != null)            envRows.push(['UV', String(env.uv_index)]);

    if (ringRows.length || envRows.length) {
      html += `<div class="co-witness">`;
      html += `<div class="co-witness-eyebrow">While you were logging</div>`;
      if (ringRows.length) {
        html += `<div class="co-witness-group"><h4>Your body</h4>`;
        ringRows.forEach(([k, v]) => {
          html += `<div class="co-witness-row"><span class="key">${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`;
        });
        html += `</div>`;
      } else {
        html += `<div class="co-witness-group"><h4>Your body</h4><div class="co-witness-row"><span class="key">No Neeve Ring data for this window.</span></div></div>`;
      }
      if (envRows.length) {
        html += `<div class="co-witness-group"><h4>Around you</h4>`;
        envRows.forEach(([k, v]) => {
          html += `<div class="co-witness-row"><span class="key">${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    }

    // Per-section answers
    if (sectionsView.length) {
      html += `<div class="view-list">`;
      for (const sec of sectionsView) {
        html += `<div class="view-section-head">${escapeHtml(sec.name || sec.key || 'Section')}</div>`;
        for (const q of (sec.questions || [])) {
          const v = answers[q.key];
          html += `
            <div class="view-row">
              <div class="view-q">${escapeHtml(q.question || q.key)}</div>
              <div class="view-a">${formatAnswerForView(q, v)}</div>
            </div>`;
        }
      }
      html += `</div>`;
    } else if (checkin.questions && checkin.questions.length) {
      // Fallback if API doesn't return grouped sections
      html += `<div class="view-list">`;
      for (const q of checkin.questions) {
        const v = answers[q.key];
        html += `
          <div class="view-row">
            <div class="view-q">${escapeHtml(q.question || q.key)}</div>
            <div class="view-a">${formatAnswerForView(q, v)}</div>
          </div>`;
      }
      html += `</div>`;
    }

    html += `<a class="view-back" href="/health/v2/record.html">← Back to Record</a>`;
    html += '</div>';
    document.getElementById('main').innerHTML = html;
  }

  function formatAnswerForView(q, v) {
    if (v == null || v === '') return '<span class="view-empty-val">—</span>';
    if (q.type === 'scale') {
      const n = Number(v);
      const word = !isNaN(n) ? scaleWords[Math.max(0, Math.min(10, Math.round(n)))] : '';
      return `<strong>${escapeHtml(String(v))}</strong>${word ? ' <span class="view-soft">· ' + escapeHtml(word) + '</span>' : ''}`;
    }
    if (q.type === 'choice' && Array.isArray(q.options)) {
      const opt = q.options.find(o => (o.value ?? o) === v) || {};
      const label = opt.label || String(v);
      return `<strong>${escapeHtml(label)}</strong>`;
    }
    return `<strong>${escapeHtml(String(v))}</strong>`;
  }

  // ── Empty state helper ─────────────────────────────
  function showEmpty(title, body) {
    document.getElementById('topbar').style.visibility = 'hidden';
    document.getElementById('main').innerHTML = `
      <div class="empty-state">
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(body)}</p>
        <a class="btn primary" style="display:inline-block;padding:12px 24px;background:var(--ink);color:#fff7f0;border-radius:99px;text-decoration:none" href="today.html">Back to Today</a>
      </div>`;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',
    }[c]));
  }

  // ── Boot ───────────────────────────────────────────
  try {
    if (viewMode) {
      const checkin = await loadCheckinForView();
      renderViewMode(checkin);
    } else if (sessionId) {
      await loadSession();
      renderCurrentSection();
    } else {
      const routed = await routeByState();
      if (!routed) {
        sessionId = await startNewSession();
        if (!sessionId) return;
        await loadSession();
        renderCurrentSection();
      }
    }
  } catch (e) {
    if (e && e.message === 'empty') return;
    console.error('checkin boot:', e);
    showEmpty("Couldn't load check-in",
      (e && e.message) ? String(e.message).slice(0, 200) : 'Try again in a moment.');
  }
})();

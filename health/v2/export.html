<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6F0" />
<title>Export · Neeve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,50;9..144,500,50;9..144,600,50&family=Inter+Tight:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">
<style>
.field-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.field-row:last-child { border-bottom: none; }
.field-row .k { color: var(--ink-soft); }
.field-row select, .field-row input {
  background: white; border: 1px solid var(--hair); border-radius: 10px;
  padding: 8px 12px; font-family: 'Inter Tight', sans-serif; font-size: 15px;
  color: var(--ink);
}
.toggle { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.toggle:last-child { border-bottom: none; }
.toggle input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--terra); }
.toggle label { color: var(--ink); cursor: pointer; }
.toggle .sub { color: var(--ink-mute); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<main class="page">
  <p class="label">Export</p>
  <h1 class="title">A PDF for your doctor</h1>
  <p class="caption" style="margin-bottom:20px">A clinical-style summary of your tracking — symptoms, sleep, ring metrics, patterns. The same report you can take to an appointment.</p>

  <section class="section">
    <div class="section-label">Date range</div>
    <div class="card">
      <div class="field-row">
        <span class="k">Quick</span>
        <select id="quick-range" onchange="applyQuickRange()">
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="60">Last 60 days</option>
          <option value="90">Last 90 days</option>
          <option value="custom">Custom…</option>
        </select>
      </div>
      <div class="field-row">
        <span class="k">From</span>
        <input id="date-from" type="date">
      </div>
      <div class="field-row">
        <span class="k">To</span>
        <input id="date-to" type="date">
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-label">For your doctor</div>
    <div class="card">
      <div class="field-row" style="flex-direction:column; align-items:stretch; gap:8px">
        <span class="k">Recipient (optional)</span>
        <input id="recipient" type="text" placeholder="Dr Evelyn Chen, Neurology" style="width:100%">
      </div>
      <div class="field-row" style="flex-direction:column; align-items:stretch; gap:8px">
        <span class="k">Cover note (optional)</span>
        <textarea id="note" rows="3"
          style="width:100%;background:white;border:1px solid var(--hair);border-radius:10px;padding:12px;font-family:'Inter Tight',sans-serif;font-size:15px;color:var(--ink);resize:vertical"
          placeholder="A short note that appears on the front page. e.g. 'For my appointment on June 3rd — recent changes since last visit.'"></textarea>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-label">Include</div>
    <div class="card">
      <div class="toggle">
        <input type="checkbox" id="sec-summary" checked>
        <label for="sec-summary">
          <div>Summary</div>
          <div class="sub">Headline patterns, baseline averages</div>
        </label>
      </div>
      <div class="toggle">
        <input type="checkbox" id="sec-checkins" checked>
        <label for="sec-checkins">
          <div>Daily check-ins</div>
          <div class="sub">Every logged entry by date</div>
        </label>
      </div>
      <div class="toggle">
        <input type="checkbox" id="sec-ring" checked>
        <label for="sec-ring">
          <div>Ring data</div>
          <div class="sub">HR, SpO2, sleep, steps, BP</div>
        </label>
      </div>
      <div class="toggle">
        <input type="checkbox" id="sec-patterns" checked>
        <label for="sec-patterns">
          <div>Detected patterns</div>
          <div class="sub">Correlations the system has noticed</div>
        </label>
      </div>
      <div class="toggle">
        <input type="checkbox" id="sec-notes" checked>
        <label for="sec-notes">
          <div>Free-text notes</div>
          <div class="sub">Things you wrote</div>
        </label>
      </div>
    </div>
  </section>

  <div style="margin-top:24px; text-align:center">
    <button class="btn btn-primary" id="go" onclick="generate()">Generate PDF</button>
    <div id="status" class="caption" style="margin-top:12px"></div>
  </div>
</main>

<div id="nav-mount"></div>
<script src="/health/v2/lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('more');

// Apply default dates (last 30 days) on load
const today = new Date();
const ago30 = new Date(today.getTime() - 30 * 86400 * 1000);
document.getElementById('date-from').value = ago30.toISOString().slice(0,10);
document.getElementById('date-to').value   = today.toISOString().slice(0,10);

function applyQuickRange() {
  const v = document.getElementById('quick-range').value;
  if (v === 'custom') return;
  const days = Number(v);
  const t = new Date();
  const f = new Date(t.getTime() - days * 86400 * 1000);
  document.getElementById('date-from').value = f.toISOString().slice(0,10);
  document.getElementById('date-to').value   = t.toISOString().slice(0,10);
}

async function generate() {
  const go = document.getElementById('go');
  const status = document.getElementById('status');
  go.disabled = true;
  status.textContent = 'Generating…';

  const dateFrom  = document.getElementById('date-from').value;
  const dateTo    = document.getElementById('date-to').value;
  const recipient = document.getElementById('recipient').value.trim();
  const note      = document.getElementById('note').value.trim();
  // Derive 'days' from the date range so it works with the existing worker.
  const days = Math.max(1, Math.round(
    (new Date(dateTo).getTime() - new Date(dateFrom).getTime()) / 86400000
  ));
  const sections = {
    summary:  document.getElementById('sec-summary').checked,
    checkins: document.getElementById('sec-checkins').checked,
    ring:     document.getElementById('sec-ring').checked,
    patterns: document.getElementById('sec-patterns').checked,
    notes:    document.getElementById('sec-notes').checked,
  };

  try {
    const token = getToken();
    const res = await fetch('https://api.noti.au/me/export', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
      body: JSON.stringify({ days, dateFrom, dateTo, recipient, note, sections }),
    });
    if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    // iOS WKWebView can't always trigger Blob downloads — open in new tab
    // and let the user share/save. Native shell can call this same URL too.
    const a = document.createElement('a');
    a.href = url;
    a.download = `neeve-${new Date().toISOString().slice(0,10)}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.textContent = 'PDF generated and downloaded.';
  } catch (e) {
    status.textContent = 'Couldn\'t generate: ' + e.message;
  } finally {
    go.disabled = false;
  }
}
</script>
</body>
</html>

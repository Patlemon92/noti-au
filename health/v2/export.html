<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6F0" />
<title>Export · Neeve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,50;9..144,500,50;9..144,600,50&family=Inter+Tight:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">
<style>
.field-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.field-row:last-child { border-bottom: none; }
.field-row .k { color: var(--ink-soft); }
.field-row select, .field-row input, .field-row textarea {
  background: white; border: 1px solid var(--hair); border-radius: 10px;
  padding: 8px 12px; font-family: 'Inter Tight', sans-serif; font-size: 15px;
  color: var(--ink);
}
.sec-row {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 0;
  border-bottom: 1px solid var(--hair); cursor: pointer;
}
.sec-row:last-child { border-bottom: none; }
.sec-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--terra); margin-top: 2px; }
.sec-row .title { color: var(--ink); font-weight: 500; }
.sec-row .sub { color: var(--ink-mute); font-size: 12px; margin-top: 2px; }
.sec-row.locked { opacity: 0.85; cursor: default; }
.sec-row.locked input { pointer-events: none; }
.locked-pill {
  font-size: 10px; padding: 1px 6px; border-radius: 4px;
  background: var(--bone-deep); color: var(--ink-mute);
  letter-spacing: 0.05em; text-transform: uppercase; margin-left: 6px;
}
</style>
</head>
<body>
<main class="page">
  <p class="label">Export</p>
  <h1 class="title">A PDF for your doctor</h1>
  <p class="caption" style="margin-bottom:20px">A clinical-style summary of your tracking, by condition. The same report you'd take to an appointment.</p>

  <section class="section">
    <div class="section-label">Date range</div>
    <div class="card">
      <div class="field-row">
        <span class="k">Quick</span>
        <select id="quick-range" onchange="applyQuickRange()">
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="60">Last 60 days</option>
          <option value="90">Last 90 days</option>
          <option value="custom">Custom…</option>
        </select>
      </div>
      <div class="field-row">
        <span class="k">From</span>
        <input id="date-from" type="date">
      </div>
      <div class="field-row">
        <span class="k">To</span>
        <input id="date-to" type="date">
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-label">For your doctor</div>
    <div class="card">
      <div class="field-row" style="flex-direction:column; align-items:stretch; gap:8px">
        <span class="k">Recipient (optional)</span>
        <input id="recipient" type="text" placeholder="Dr Evelyn Chen, Neurology" style="width:100%">
      </div>
      <div class="field-row" style="flex-direction:column; align-items:stretch; gap:8px">
        <span class="k">Cover note (optional)</span>
        <textarea id="note" rows="3"
          style="width:100%; resize:vertical"
          placeholder="A short note for the front page. e.g. 'For my appointment on June 3rd — recent changes since last visit.'"></textarea>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-label">Sections to include</div>
    <div class="card" id="sections-list"></div>
  </section>

  <div style="margin-top:24px; text-align:center">
    <button class="btn btn-primary" id="go" onclick="generate()">Generate PDF</button>
    <div id="status" class="caption" style="margin-top:12px"></div>
  </div>
</main>

<div id="nav-mount"></div>
<script src="/health/v2/lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('more');

// Section list matches the v1 export — these keys are what the
// worker /me/export expects in body.sections (array form).
const SECTIONS = [
  { key: 'cover_findings', title: 'Cover & key findings',        sub: 'Always included · 2 pages',                   pages: 2, locked: true, on: true },
  { key: 'mood',           title: 'Mood',                         sub: 'Daily averages, weekly trend · 1 page',       pages: 1, on: true },
  { key: 'anxiety',        title: 'Anxiety',                      sub: 'Daily averages, patterns · 1 page',           pages: 1, on: true },
  { key: 'depression',     title: 'Depression',                   sub: 'Low-mood markers, patterns · 1 page',         pages: 1, on: true },
  { key: 'headaches',      title: 'Headaches',                    sub: 'Frequency, intensity, triggers · 1 page',     pages: 1, on: true },
  { key: 'pots',           title: 'POTS',                         sub: 'Dizziness, standing, triggers · 1 page',      pages: 1, on: true },
  { key: 'pain',           title: 'Pain',                         sub: 'Averages, sites, intensity · 1 page',         pages: 1, on: true },
  { key: 'fatigue',        title: 'Fatigue',                      sub: 'Severity, context · 1 page',                  pages: 1, on: true },
  { key: 'fog',            title: 'Brain fog',                    sub: 'Severity, context · 1 page',                  pages: 1, on: true },
  { key: 'gut',            title: 'Gut & digestion',              sub: 'Symptoms, patterns · 1 page',                 pages: 1, on: true },
  { key: 'cycle',          title: 'Cycle',                        sub: 'Phases, correlations · 1 page',               pages: 1, on: true },
  { key: 'weight',         title: 'Weight',                       sub: 'Trend over period · 1 page',                  pages: 1, on: true },
  { key: 'medications',    title: 'Medications',                  sub: 'Log of medications taken · 1 page',           pages: 1, on: true },
  { key: 'lifestyle',      title: 'Sleep, hydration & lifestyle', sub: 'Averages, distribution · 1 page',             pages: 1, on: true },
  { key: 'daily_log',      title: 'Daily log',                    sub: 'Scannable table, one row per day · 1 page',   pages: 1, on: true },
  { key: 'own_words',      title: 'Notes & reflections',          sub: 'Free-text entries, grouped by theme · 1 page',pages: 1, on: true },
];

// Render sections
document.getElementById('sections-list').innerHTML = SECTIONS.map(s => `
  <label class="sec-row ${s.locked ? 'locked' : ''}">
    <input type="checkbox" data-key="${s.key}" ${s.on ? 'checked' : ''} ${s.locked ? 'disabled' : ''}>
    <div>
      <div class="title">${s.title}${s.locked ? '<span class="locked-pill">always</span>' : ''}</div>
      <div class="sub">${s.sub}</div>
    </div>
  </label>
`).join('');

// Default dates
const today = new Date();
const ago30 = new Date(today.getTime() - 30 * 86400 * 1000);
document.getElementById('date-from').value = ago30.toISOString().slice(0,10);
document.getElementById('date-to').value   = today.toISOString().slice(0,10);

function applyQuickRange() {
  const v = document.getElementById('quick-range').value;
  if (v === 'custom') return;
  const days = Number(v);
  const t = new Date();
  const f = new Date(t.getTime() - days * 86400 * 1000);
  document.getElementById('date-from').value = f.toISOString().slice(0,10);
  document.getElementById('date-to').value   = t.toISOString().slice(0,10);
}

async function generate() {
  const go = document.getElementById('go');
  const status = document.getElementById('status');
  go.disabled = true;
  status.textContent = 'Generating…';

  const from = document.getElementById('date-from').value;
  const to   = document.getElementById('date-to').value;
  const recipient = document.getElementById('recipient').value.trim();
  const note      = document.getElementById('note').value.trim();
  const sections = Array.from(document.querySelectorAll('#sections-list input[type=checkbox]'))
    .filter(cb => cb.checked || cb.disabled) // locked sections always sent
    .map(cb => cb.dataset.key);

  // Worker expects { from, to, sections: [keys], recipient, note }.
  // 'days' is also accepted as fallback if from/to missing.
  const body = { from, to, sections, recipient, note };

  try {
    const token = getToken();
    const res = await fetch('https://api.noti.au/me/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `neeve-${new Date().toISOString().slice(0,10)}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.textContent = 'PDF generated.';
  } catch (e) {
    status.textContent = 'Couldn\'t generate: ' + e.message;
  } finally {
    go.disabled = false;
  }
}
</script>
</body>
</html>

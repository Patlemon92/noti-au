<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6F0" />
<title>History · Neeve</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,50;9..144,500,50;9..144,600,50&family=Inter+Tight:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">
</head>
<body>

<main class="page">
  <p class="label">History</p>
  <h1 class="title">Everything you've logged</h1>

  <div id="content">
    <div class="empty">Loading…</div>
  </div>
</main>

<div id="nav-mount"></div>

<script src="/health/v2/lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('history');

(async function load() {
  try {
    const { samples } = await api('/ring/samples?limit=500');
    if (!samples.length) {
      document.getElementById('content').innerHTML =
        '<div class="empty">Nothing logged yet. Pair the ring on the Ring tab.</div>';
      return;
    }
    // Group by day
    const byDay = {};
    for (const s of samples) {
      const day = new Date(s.ts).toLocaleDateString('en-AU', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
      (byDay[day] = byDay[day] || []).push(s);
    }
    const html = Object.entries(byDay).map(([day, list]) => `
      <section class="section">
        <h2 class="title-sm">${day}</h2>
        <div class="card" style="margin-top:8px">
          ${list.slice(0, 30).map(s => `
            <div class="metric-row">
              <span class="metric-label">${metricLabel(s.metric)}</span>
              <span>
                <span class="metric-value" style="font-size:16px">${formatValue(s.metric, s.value)}</span>
                <span class="metric-unit">${metricUnit(s.metric, s.unit)}</span>
              </span>
            </div>
          `).join('')}
          ${list.length > 30 ? `<div class="caption" style="padding-top:8px">+${list.length - 30} more</div>` : ''}
        </div>
      </section>
    `).join('');
    document.getElementById('content').innerHTML = html;
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="empty">Couldn't load: ${e.message}</div>`;
  }
})();
</script>
</body>
</html>

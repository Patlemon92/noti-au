<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6F0" />
<title>Settings · Neeve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,50;9..144,500,50;9..144,600,50&family=Inter+Tight:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">
<style>
.kv { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.kv:last-child { border-bottom: none; }
.kv .k { color: var(--ink-soft); }
.kv .v { color: var(--ink); font-weight: 500; }
.row-link {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0; border-bottom: 1px solid var(--hair);
  text-decoration: none; color: var(--ink);
}
.row-link:last-child { border-bottom: none; }
.row-link .chev { color: var(--ink-mute); font-size: 18px; }
.row-link .sub { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
.row-danger { color: var(--rose-deep); }
.time-input {
  background: white; border: 1px solid var(--hair); border-radius: 10px;
  padding: 8px 12px; font-family: 'Inter Tight', sans-serif; font-size: 15px;
  color: var(--ink); width: 110px;
}
</style>
</head>
<body>
<main class="page">
  <p class="label">Settings</p>
  <h1 class="title" id="hi">Your profile</h1>

  <section class="card" id="who">
    <div class="empty">Loading…</div>
  </section>

  <section class="section">
    <div class="section-label">Daily schedule</div>
    <div class="card" id="schedule">
      <div class="empty">Loading…</div>
    </div>
  </section>

  <section class="section">
    <div class="section-label">Records & export</div>
    <div class="card">
      <a class="row-link" href="/health/v2/record.html">
        <div>
          <div>Past check-ins</div>
          <div class="sub">Day-by-day record of what you've logged</div>
        </div>
        <span class="chev">›</span>
      </a>
      <a class="row-link" href="/health/v2/export.html">
        <div>
          <div>Generate a PDF for your doctor</div>
          <div class="sub">Clinical-style summary you can share</div>
        </div>
        <span class="chev">›</span>
      </a>
    </div>
  </section>

  <section class="section">
    <div class="section-label">Account</div>
    <div class="card">
      <a class="row-link row-danger" href="#" onclick="signOut(); return false;">
        <div>Sign out</div>
        <span class="chev">›</span>
      </a>
    </div>
  </section>
</main>

<div id="nav-mount"></div>

<script src="/health/v2/lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('more');

(async function load() {
  try {
    const { user } = await api('/me');
    renderUser(user);
    renderSchedule(user);
  } catch (e) {
    document.getElementById('who').innerHTML =
      `<div class="empty">Couldn't load: ${e.message}</div>`;
  }
})();

function renderUser(u) {
  document.getElementById('hi').textContent = u.name ? `Hi ${u.name}.` : 'Your profile';
  document.getElementById('who').innerHTML = `
    <div class="kv"><span class="k">Name</span><span class="v">${u.name || '—'}</span></div>
    <div class="kv"><span class="k">Phone</span><span class="v">${u.phone || '—'}</span></div>
  `;
}

function renderSchedule(u) {
  const el = document.getElementById('schedule');
  el.innerHTML = `
    <div class="kv">
      <span class="k">Morning check-in</span>
      <input class="time-input" type="time" id="morning" value="${(u.morningTime||'07:30').slice(0,5)}">
    </div>
    <div class="kv">
      <span class="k">Evening check-in</span>
      <input class="time-input" type="time" id="evening" value="${(u.eveningTime||'20:00').slice(0,5)}">
    </div>
    <div style="text-align:right; margin-top:12px">
      <button class="btn btn-primary" onclick="saveSchedule()">Save times</button>
    </div>
  `;
}

async function saveSchedule() {
  const morning = document.getElementById('morning').value;
  const evening = document.getElementById('evening').value;
  try {
    await api('/me/schedule', { method: 'POST',
      body: JSON.stringify({ morningTime: morning, eveningTime: evening }) });
    alert('Saved.');
  } catch (e) { alert('Couldn\'t save: ' + e.message); }
}

function signOut() {
  if (!confirm('Sign out of Neeve?')) return;
  if (window.neeve?.postMessage) {
    // Native shell — let iOS clear Keychain too
    window.neeve.postMessage(JSON.stringify({ method: 'signOut' }));
  } else {
    clearToken();
    window.location.href = '/health/login.html';
  }
}
</script>
</body>
</html>

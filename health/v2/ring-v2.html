<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f1e5d4" />
<title>Ring · Neeve</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">

<style>
  /* Ring hub — grouped "Your data" list with a plain-language pacing
     hero. Self-contained palette so the surface reads warm + earthy;
     styles.css is still loaded for the shared bottom nav + sheet. */
  :root{
    --paper:#f1e5d4;
    --card:#fbf6ee;
    --ink:#42332b;
    --ink-soft:#6b574a;
    --muted:#9a8473;
    --clay:#bb6147;
    --line:#6f7551;
    --sage:#8d8a6a;
    --hair:#e7dac6;
  }
  body{
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    background:var(--paper);
    background-attachment:fixed;
    color:var(--ink);
  }
  .page{
    max-width:412px;margin:0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(120px + env(safe-area-inset-bottom));
    animation:ring-fade .5s ease;
  }
  @keyframes ring-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* header */
  .head{display:flex;justify-content:space-between;align-items:flex-start;margin:10px 4px 18px;}
  .head .eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;}
  .head h1{font-family:"Fraunces",serif;font-weight:500;font-size:42px;line-height:1;margin-top:6px;letter-spacing:-.01em;color:var(--ink);}
  .head-actions{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .conn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--hair);
    padding:8px 14px;border-radius:30px;font-size:13.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;}
  .conn i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;}
  .conn i.on{background:#7c9a6a;box-shadow:0 0 0 3px rgba(124,154,106,.22);}

  /* sync indicator */
  .sync-indicator{display:inline-flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:50%;color:var(--clay);background:#fff;
    border:1px solid var(--hair);cursor:pointer;opacity:.9;transition:opacity .2s ease,transform .12s ease;}
  .sync-indicator:active{transform:scale(.94);}
  .sync-indicator svg{width:17px;height:17px;transition:transform .3s ease;}
  .sync-indicator.spinning svg{animation:sync-spin 1s linear infinite;}
  @keyframes sync-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  /* HERO — the pacing read, in words */
  .hero{position:relative;border-radius:30px;padding:26px 24px 24px;overflow:hidden;isolation:isolate;
    background:linear-gradient(155deg,#f6dcb6 0%, #ecbf97 42%, #d79e88 78%, #c08a7e 100%);
    box-shadow:0 14px 34px rgba(150,100,70,.18);}
  .hero::before{content:"";position:absolute;z-index:-1;width:260px;height:260px;left:72%;top:18%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,244,228,.85),rgba(220,160,130,.25) 45%,transparent 70%);
    filter:blur(4px);animation:breathe 8s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.9}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}
  .hero .date{font-size:13.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7a4f3d;opacity:.85;}
  .hero h2{font-family:"Fraunces",serif;font-weight:500;font-size:32px;line-height:1.08;margin-top:8px;color:#4a2f24;letter-spacing:-.01em;}
  .hero p{font-size:16px;line-height:1.55;color:#5c3d30;margin-top:12px;max-width:30ch;}
  .states{display:flex;gap:8px;margin-top:20px;}
  .states span{flex:1;text-align:center;font-size:13.5px;font-weight:500;padding:9px 4px;border-radius:20px;
    background:rgba(255,255,255,.22);color:#6e4636;border:1px solid rgba(255,255,255,.28);}
  .states span.on{background:#fbf4ea;color:#4a2f24;font-weight:600;box-shadow:0 2px 8px rgba(120,70,50,.18);}

  /* slim tie back to Today's readiness read */
  .fromtoday{display:flex;align-items:center;gap:10px;background:#fcf7ef;border:1px solid var(--hair);border-radius:20px;
    padding:12px 16px;margin:0 2px;font-size:14.5px;color:var(--ink-soft);text-decoration:none;}
  .fromtoday .dot{width:9px;height:9px;border-radius:50%;background:#e0a07e;flex:none;}
  .fromtoday b{color:var(--ink);font-weight:600;}
  .fromtoday .go{margin-left:auto;color:var(--muted);font-size:18px;}

  /* period toggle */
  .period{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 4px 8px;}
  .period .plabel{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .period .pseg{display:flex;gap:8px;}
  .period button{font-family:inherit;font-size:14px;font-weight:600;padding:7px 16px;border-radius:20px;border:none;cursor:pointer;}
  .period button.on{background:var(--ink);color:#f6ecdd;}
  .period button.off{background:#fff;color:var(--muted);border:1px solid var(--hair);}

  /* groups */
  .group{margin-top:18px;}
  .glabel{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 6px 10px;}
  .gnote{font-size:13px;color:var(--muted);margin:-4px 6px 12px;line-height:1.45;}
  .gcard{background:var(--card);border-radius:24px;padding:6px 18px;box-shadow:0 8px 24px rgba(120,90,60,.06);}

  /* row */
  .row{display:grid;grid-template-columns:1fr auto 78px 12px;align-items:center;gap:12px;
    padding:17px 2px;cursor:pointer;text-decoration:none;color:inherit;}
  .row + .row{border-top:1px solid var(--hair);}
  .row:active{opacity:.7;}
  .row .name{font-family:"Fraunces",serif;font-weight:500;font-size:19px;color:var(--ink);}
  .row .read{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-top:4px;}
  .row .read i{width:7px;height:7px;border-radius:50%;flex:none;}
  .row .read i.ok{background:var(--sage);}
  .row .read i.soft{background:var(--clay);}
  .row .val{font-family:"Fraunces",serif;font-weight:500;font-size:25px;color:var(--ink);white-space:nowrap;text-align:right;}
  .row .val small{font-size:13px;color:var(--muted);font-weight:400;margin-left:2px;}
  .row .chev{color:var(--muted);font-size:20px;text-align:center;}
  .row.exp{opacity:.82;}
  .spark{min-width:78px;}
  .spark svg{display:block;}

  .empty{background:var(--card);border-radius:24px;padding:28px 22px;text-align:center;
    color:var(--muted);font-size:14.5px;line-height:1.5;box-shadow:0 8px 24px rgba(120,90,60,.06);}

  .fade{opacity:0;transform:translateY(12px);animation:up .7s cubic-bezier(.2,.7,.2,1) forwards;}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  /* ── device sheet (kept from prior build) ── */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(43,34,28,.45);z-index:1000;opacity:0;
    pointer-events:none;transition:opacity .2s ease;}
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:#fbf6ee;
    border-radius:20px 20px 0 0;padding:20px 20px max(24px,env(safe-area-inset-bottom)) 20px;
    transform:translateY(100%);transition:transform .25s ease,box-shadow .25s ease;
    max-height:85vh;overflow-y:auto;box-shadow:none;}
  .sheet.open{transform:translateY(0);box-shadow:0 -10px 30px rgba(43,34,28,.18);}
  .sheet-grip{width:36px;height:4px;background:var(--hair);border-radius:2px;margin:0 auto 12px;}
  .sheet h2{font-family:"Fraunces",serif;font-weight:500;font-size:22px;color:var(--ink);margin:0 0 4px;}
  .sheet .sheet-caption{font-size:13px;color:var(--muted);margin-bottom:16px;}
  .sheet .kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;}
  .sheet .kv .k{color:var(--muted);}
  .sheet .kv .v{color:var(--ink);}
  .sheet .action-row{display:flex;flex-direction:column;gap:10px;margin-top:16px;}

  /* ── pull-to-refresh (kept) ── */
  .ptr{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;
    height:0;overflow:hidden;pointer-events:none;color:var(--muted);font-size:13px;
    background:var(--paper);z-index:50;transition:height .18s ease;}
  html,body{overscroll-behavior-y:contain;}
  .ptr-inner{padding:10px 0;display:flex;align-items:center;gap:8px;}
  .ptr-spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--hair);
    border-top-color:var(--clay);display:inline-block;}
  .ptr.refreshing .ptr-spinner{animation:ptr-spin .8s linear infinite;}
  @keyframes ptr-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="ptr" id="ptr">
  <div class="ptr-inner">
    <span class="ptr-spinner"></span>
    <span id="ptr-text">Pull to refresh</span>
  </div>
</div>

<main class="page">

  <!-- header -->
  <div class="head">
    <div>
      <div class="eyebrow">Ring</div>
      <h1>Your data</h1>
    </div>
    <div class="head-actions">
      <button class="conn" id="ring-pill" onclick="openSheet()" aria-label="Ring details">
        <i id="ring-dot"></i><span id="ring-pill-text">Details</span>
      </button>
      <button class="sync-indicator" id="sync-indicator" type="button"
              onclick="manualSync()" aria-label="Sync now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <polyline points="21 3 21 8 16 8"/>
          <polyline points="3 21 3 16 8 16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Slim tie back to Today's readiness read (the hero lives on Today now) -->
  <a class="fromtoday fade" id="fromtoday" href="/health/v2/today.html">
    <span class="dot"></span><span>Today: <b id="ft-state">…</b></span><span class="go">›</span>
  </a>

  <div class="period">
    <span class="plabel">Trends</span>
    <div class="pseg">
      <button id="range-7"  class="on"  onclick="setRange(7)">7 days</button>
      <button id="range-30" class="off" onclick="setRange(30)">30 days</button>
    </div>
  </div>

  <!-- grouped metric list -->
  <div id="groups"></div>

</main>

<!-- Bottom-sheet modal: device info + actions -->
<div class="sheet-backdrop" id="sheet-bd" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <h2 id="sheet-name">Ring</h2>
  <div class="sheet-caption" id="sheet-state">—</div>
  <div id="sheet-kv"></div>
  <div class="action-row">
    <button class="btn btn-primary" onclick="callNative('reconnectRing'); closeSheet()">Reconnect ring</button>
    <button class="btn btn-ghost"   onclick="callNative('measureHeartRate'); closeSheet()">Measure heart rate</button>
    <button class="btn btn-ghost"   onclick="callNative('syncNow');   closeSheet()">Sync historical data</button>
    <button class="btn btn-ghost"   onclick="callNative('scanForRing'); closeSheet()">Pair another ring</button>
    <a class="btn btn-ghost" href="/health/v2/profile" onclick="closeSheet()" style="text-align:center">Ring profile (More tab)</a>
    <button class="btn btn-ghost" id="sheet-debug" onclick="callNative('openDebug'); closeSheet()" style="display:none">Debug</button>
  </div>
</div>

<div id="nav-mount"></div>

<script src="/health/v2/lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('ring');

// Debug button only shows inside the native shell.
if (window.neeve?.postMessage) {
  document.getElementById('sheet-debug').style.display = 'block';
}

let currentRange = 7;
let cachedLatest = {};                 // metric → {ts, value, unit}
let cachedSamplesByMetric = {};        // metric → [{ts,value,meta}]
let cachedSleep = { sessions: [] };
let cachedBaselines = {};              // metric → {healthy,p30,p90,lifetime,...}
let cachedDevice = null;

// Only the metrics this hub actually surfaces (Overnight / Today /
// Experimental) plus recovery_score — fetched but NEVER shown; it only
// feeds the plain-language pacing hero internally (scores never reach
// the UI), and only when fresh.
//
// Resting HR is NOT fetched as `rhr_derived`: that engine output is
// nightly + currently stale (last value 2026-05-30). We derive resting
// HR live from the overnight HR lows instead (see restingSeries) so the
// row is always honest and current.
const TREND_METRICS = [
  'hr', 'hrv_rmssd', 'spo2', 'respiration_rate',
  'steps', 'bp_sys', 'bp_dia', 'recovery_score',
];

// Row config → real metric keys. Each row: which series + baseline to
// read, where the chevron leads, and how to phrase its read-line.
const GROUPS = [
  { label: 'Overnight', rows: [
    { key:'sleep', name:'Sleep',              metric:'sleep_session', href:'/health/v2/sleep.html', kind:'sleep' },
    { key:'rhr',   name:'Resting heart rate', metric:'rhr_derived', baseFallback:'hr', unit:'bpm', kind:'rhr', href:'/health/v2/metric.html?metric=hr&days=1' },
    { key:'hrv',   name:'HRV',                metric:'hrv_rmssd',   unit:'ms',   kind:'hrv' },
    { key:'resp',  name:'Respiration',        metric:'respiration_rate', unit:'br/min', kind:'resp' },
    { key:'spo2',  name:'Blood oxygen',       metric:'spo2',        unit:'%',    kind:'spo2' },
  ]},
  { label: 'Through the day', rows: [
    { key:'hr',    name:'Heart rate',         metric:'hr',          unit:'bpm',  kind:'hr' },
    { key:'steps', name:'Steps',              metric:'steps',       unit:'',     kind:'steps' },
  ]},
  { label: 'Experimental',
    note: 'Optical estimates from the ring, not clinical readings. Calibrate against a cuff for anything that matters.',
    rows: [
      { key:'bp',  name:'Blood pressure',     metric:'bp',          unit:'',     kind:'bp', exp:true },
    ]},
];

function setRange(days) {
  currentRange = days;
  document.getElementById('range-7').className  = days === 7  ? 'on' : 'off';
  document.getElementById('range-30').className = days === 30 ? 'on' : 'off';
  load();
}

let firstLoad = true;

// ── sync indicator ──────────────────────────────────────────
let _syncInFlight = 0;
function syncStart() {
  _syncInFlight++;
  document.getElementById('sync-indicator')?.classList.add('spinning');
}
function syncEnd() {
  _syncInFlight = Math.max(0, _syncInFlight - 1);
  if (_syncInFlight === 0) document.getElementById('sync-indicator')?.classList.remove('spinning');
}

async function manualSync() {
  syncStart();
  if (window.neeve && window.neeve.postMessage) {
    window.neeve.postMessage(JSON.stringify({ method: 'freshRefresh' }));
  }
  try {
    await load();
    await new Promise(r => setTimeout(r, 16000));
    await load();
  } finally {
    syncEnd();
  }
}

async function load() {
  syncStart();
  try {
    const sleepSince = new Date(Date.now() - 30 * 86400 * 1000).toISOString();
    const sleepQ = `/ring/samples?metric=sleep_session&limit=2000&since=${encodeURIComponent(sleepSince)}`;

    const trendPromises = TREND_METRICS.map(m =>
      api(`/ring/trend?metric=${m}&days=${currentRange}`)
        .then(r => ({ metric: m, samples: r.samples || [], latest: r.latest || null }))
        .catch(() => ({ metric: m, samples: [], latest: null })));

    const [{ devices }, trendResults, sleepRes, baseRes] = await Promise.all([
      api('/ring/status'),
      Promise.all(trendPromises),
      api(sleepQ).catch(() => ({ samples: [] })),
      api('/me/baselines').catch(() => ({ baselines: {} })),
    ]);

    cachedDevice = devices[0];
    cachedSamplesByMetric = {};
    cachedLatest = {};
    for (const r of trendResults) {
      cachedSamplesByMetric[r.metric] = r.samples;
      if (r.latest) cachedLatest[r.metric] = r.latest;
    }
    cachedSleep.sessions = (sleepRes.samples || []).filter(s => s.metric === 'sleep_session');
    cachedBaselines = baseRes.baselines || {};

    renderHeadPill();
    renderFromToday();
    renderGroups();
    firstLoad = false;
  } catch (e) {
    if (firstLoad) {
      document.getElementById('groups').innerHTML =
        `<div class="empty">Couldn't load your data: ${e.message}</div>`;
    }
  } finally {
    syncEnd();
  }
}

load();

// ── live refresh while visible ──────────────────────────────
let _refreshTimer = null;
let _lastLoadAt = 0;
function _loadIfFresh() {
  const now = Date.now();
  if (now - _lastLoadAt < 1500) return;
  _lastLoadAt = now;
  load();
}
function _startRefresh() {
  if (_refreshTimer) return;
  _refreshTimer = setInterval(_loadIfFresh, 5000);
}
function _stopRefresh() {
  if (_refreshTimer) { clearInterval(_refreshTimer); _refreshTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) _stopRefresh(); else { _loadIfFresh(); _startRefresh(); }
});
window.addEventListener('neeve:ring-tick', _loadIfFresh);
if (!document.hidden) _startRefresh();
onResume(_loadIfFresh);

function renderHeadPill() {
  const dot  = document.getElementById('ring-dot');
  const text = document.getElementById('ring-pill-text');
  const d = cachedDevice;
  if (!d) { dot.className = ''; text.textContent = 'Pair'; return; }
  const connOn = d.last_seen_at && (Date.now() - new Date(d.last_seen_at)) < 10 * 60 * 1000;
  dot.className = connOn ? 'on' : '';
  text.textContent = connOn ? 'Connected' : 'Last seen ' + formatAgo(d.last_seen_at);
}

// ── helpers ─────────────────────────────────────────────────
function fmtHm(seconds) {
  if (!seconds || seconds <= 0) return '—';
  const h = Math.floor(seconds / 3600);
  const m = Math.round((seconds % 3600) / 60);
  return `${h}h ${m}m`;
}

// The person's "usual" reference for a metric: prefer the non-flare
// healthy baseline, fall back to recent typical (p30), then lifetime.
function baseRef(b) {
  if (!b) return null;
  const v = b.healthy ?? b.p30 ?? b.lifetime ?? b.p90 ?? null;
  return (v == null || !isFinite(v)) ? null : Number(v);
}

function latestSleepSession() {
  const s = cachedSleep.sessions.slice().sort((a, b) => new Date(b.ts) - new Date(a.ts));
  return s[0] || null;
}

function stepsToday() {
  const samples = cachedSamplesByMetric['steps'] || [];
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const today = samples.filter(s => new Date(s.ts).getTime() >= t0.getTime());
  if (!today.length) return null;
  return Math.max(...today.map(s => Number(s.value)).filter(isFinite));
}

// Resting HR derived live from the overnight HR lows: the lowest
// bucket-averaged HR of each day approximates resting heart rate. We
// build a per-day series (oldest→newest) so the row, sparkline and hero
// all read from current data — the `rhr_derived` engine output is
// nightly + presently stale, so we don't depend on it.
function restingSeries() {
  const samples = cachedSamplesByMetric['hr'] || [];
  const byDay = {};
  for (const s of samples) {
    const v = Number(s.value);
    if (!isFinite(v) || v < 30) continue;          // drop contact-noise zeros
    const d = new Date(s.ts);
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (byDay[key] == null || v < byDay[key]) byDay[key] = v;
  }
  return Object.keys(byDay).sort().map(k => Math.round(byDay[k]));
}
function restingLatest() {
  const arr = restingSeries();
  return arr.length ? arr[arr.length - 1] : null;
}

// Plain-language read-line per row. Gentle, signal-not-condition, never
// alarmed. Returns { text, cls } where cls is 'ok' (sage) or 'soft'
// (clay, experimental only).
function readLine(kind, value, b) {
  const ref = baseRef(b);
  switch (kind) {
    case 'sleep': {
      const h = value / 3600;
      const hrs = h >= 7.75 && h < 8 ? 'nearly eight hours'
        : `${Math.floor(h)}h ${Math.round((h % 1) * 60)}m`;
      const quality = h >= 7.5 ? 'a full night'
        : h >= 6.5 ? 'a decent night'
        : h >= 5.5 ? 'a little short'
        : 'a short night';
      return { text: `${hrs} · ${quality}`, cls: 'ok' };
    }
    case 'rhr': {
      if (ref == null) return { text: 'resting overnight', cls: 'ok' };
      const d = value - ref;
      if (Math.abs(d) <= 3) return { text: 'right around your usual', cls: 'ok' };
      return d > 0
        ? { text: 'a touch higher than usual', cls: 'ok' }
        : { text: 'a little lower than usual', cls: 'ok' };
    }
    case 'hrv': {
      if (ref == null) return { text: 'tracking overnight', cls: 'ok' };
      const d = value - ref;
      if (Math.abs(d) <= Math.max(4, ref * 0.12)) return { text: 'in your usual range', cls: 'ok' };
      return d > 0
        ? { text: 'higher than usual — a good sign', cls: 'ok' }
        : { text: 'a little lower than usual', cls: 'ok' };
    }
    case 'resp': {
      if (ref == null) return { text: 'steady through the night', cls: 'ok' };
      const d = value - ref;
      if (Math.abs(d) <= 1.5) return { text: 'steady through the night', cls: 'ok' };
      return d > 0
        ? { text: 'a little faster than usual', cls: 'ok' }
        : { text: 'a little slower than usual', cls: 'ok' };
    }
    case 'spo2': {
      if (value >= 96) return { text: 'sitting where it usually does', cls: 'ok' };
      return { text: 'a little lower than usual', cls: 'ok' };
    }
    case 'hr': {
      if (ref == null) return { text: 'right now', cls: 'ok' };
      const d = value - ref;
      if (d <= 6) return { text: 'calm right now', cls: 'ok' };
      if (d <= 18) return { text: 'a little up right now', cls: 'ok' };
      return { text: 'raised right now', cls: 'ok' };
    }
    case 'steps': {
      if (value == null || value < 600) return { text: 'a quiet day so far', cls: 'ok' };
      if (value < 4000) return { text: 'moving a little today', cls: 'ok' };
      return { text: 'an active day so far', cls: 'ok' };
    }
    case 'bp':
      return { text: 'estimate only · calibrate to trust', cls: 'soft' };
  }
  return { text: '', cls: 'ok' };
}

// ── pacing hero ─────────────────────────────────────────────
// The readiness read lives on Today now; Ring just ties back to it,
// reading the same engine token via /me/today.
async function renderFromToday() {
  const WORD = { tender: 'a tender day', quiet: 'a quiet day', steady: 'a steady day',
                 open: 'an open day', strong: 'a strong day' };
  try {
    const t = await api('/me/today');
    document.getElementById('ft-state').textContent = t && t.state ? WORD[t.state] : 'today';
  } catch (_) {
    document.getElementById('ft-state').textContent = 'today';
  }
}

// ── grouped rows ────────────────────────────────────────────
function rowValue(row) {
  if (row.kind === 'sleep') {
    const s = latestSleepSession();
    return s ? Number(s.value) : null;
  }
  if (row.kind === 'bp') {
    const sys = cachedLatest['bp_sys'] ? Math.round(cachedLatest['bp_sys'].value) : null;
    const dia = cachedLatest['bp_dia'] ? Math.round(cachedLatest['bp_dia'].value) : null;
    if (sys == null && dia == null) return null;
    return { sys, dia };
  }
  if (row.kind === 'steps') return stepsToday();
  if (row.kind === 'rhr') return restingLatest();
  const l = cachedLatest[row.metric];
  return l ? Number(l.value) : null;
}

function rowSeries(row) {
  if (row.kind === 'sleep') {
    return cachedSleep.sessions.map(s => Number(s.value) / 3600).filter(isFinite);
  }
  if (row.kind === 'bp') {
    return (cachedSamplesByMetric['bp_sys'] || []).map(s => Number(s.value)).filter(isFinite);
  }
  if (row.kind === 'rhr') return restingSeries();
  return (cachedSamplesByMetric[row.metric] || []).map(s => Number(s.value)).filter(isFinite);
}

function valHtml(row, value) {
  if (row.kind === 'sleep') return fmtHm(value);
  if (row.kind === 'bp') {
    const sys = value.sys != null ? value.sys : '—';
    const dia = value.dia != null ? value.dia : '—';
    return `${sys}/${dia}`;
  }
  const num = Math.round(value);
  return row.unit ? `${num}<small>${row.unit}</small>` : `${num}`;
}

function renderGroups() {
  const html = GROUPS.map(g => {
    const rowsHtml = g.rows.map(row => {
      const value = rowValue(row);
      if (value == null) return '';

      const baseline = row.kind === 'rhr'
        ? (cachedBaselines['rhr_derived'] || cachedBaselines[row.baseFallback])
        : cachedBaselines[row.metric];

      const read = readLine(row.kind, value, baseline);
      const href = row.href || `/health/v2/metric.html?metric=${encodeURIComponent(row.metric)}&days=1`;

      return `
        <a class="row${row.exp ? ' exp' : ''}" href="${href}">
          <div>
            <div class="name">${row.name}</div>
            <div class="read"><i class="${read.cls}"></i>${read.text}</div>
          </div>
          <div class="val">${valHtml(row, value)}</div>
          <div class="spark" id="spark-${row.key}"></div>
          <div class="chev">›</div>
        </a>`;
    }).join('');

    if (!rowsHtml.trim()) return '';
    return `
      <div class="group fade">
        <div class="glabel">${g.label}</div>
        ${g.note ? `<div class="gnote">${g.note}</div>` : ''}
        <div class="gcard">${rowsHtml}</div>
      </div>`;
  }).join('');

  const groupsEl = document.getElementById('groups');
  groupsEl.innerHTML = html.trim() ||
    `<div class="empty">No ring readings in this range yet.<br>Wear your ring and they'll appear here.</div>`;

  // Draw sparklines after the rows are in the DOM.
  GROUPS.forEach(g => g.rows.forEach(row => {
    if (rowValue(row) == null) return;
    const el = document.getElementById(`spark-${row.key}`);
    if (el) drawSpark(el, sampleEvenly(rowSeries(row), 7));
  }));
}

// ── mini sparkline (smoothed trend, clay stroke, last dot) ──
const SVG_NS = 'http://www.w3.org/2000/svg';

function sampleEvenly(vals, n) {
  if (!vals || vals.length <= 1) return vals || [];
  if (vals.length <= n) return vals;
  const out = [];
  for (let i = 0; i < n; i++) out.push(vals[Math.round(i * (vals.length - 1) / (n - 1))]);
  return out;
}

function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

function drawSpark(el, data) {
  el.innerHTML = '';
  if (!data || data.length < 2) return;
  const W = 78, H = 30, pad = 4;
  const min = Math.min(...data), max = Math.max(...data), rng = (max - min) || 1;
  const pts = data.map((v, i) => ({
    x: pad + i * (W - 2 * pad) / (data.length - 1),
    y: pad + (1 - (v - min) / rng) * (H - 2 * pad),
  }));
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  const path = document.createElementNS(SVG_NS, 'path');
  path.setAttribute('d', smoothPath(pts));
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#bb6147');
  path.setAttribute('stroke-width', '1.8');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  path.setAttribute('opacity', '.85');
  svg.appendChild(path);
  const last = pts[pts.length - 1];
  const dot = document.createElementNS(SVG_NS, 'circle');
  dot.setAttribute('cx', last.x); dot.setAttribute('cy', last.y);
  dot.setAttribute('r', '2.4'); dot.setAttribute('fill', '#a3472f');
  svg.appendChild(dot);
  el.appendChild(svg);
  const len = path.getTotalLength();
  path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
  path.style.transition = 'stroke-dashoffset 1.1s ease';
  requestAnimationFrame(() => requestAnimationFrame(() => { path.style.strokeDashoffset = 0; }));
}

// ── device sheet ────────────────────────────────────────────
function openSheet() {
  document.getElementById('sheet-bd').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  populateSheet();
}
function closeSheet() {
  document.getElementById('sheet-bd').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
function populateSheet() {
  const d = cachedDevice;
  if (!d) {
    document.getElementById('sheet-name').textContent = 'No ring paired';
    document.getElementById('sheet-state').textContent = 'Tap "Pair another ring" to set one up.';
    document.getElementById('sheet-kv').innerHTML = '';
    return;
  }
  const connOn = d.last_seen_at && (Date.now() - new Date(d.last_seen_at)) < 10 * 60 * 1000;
  document.getElementById('sheet-name').textContent = d.name || 'Ring';
  document.getElementById('sheet-state').textContent =
    connOn ? 'Connected' : `Last seen ${formatAgo(d.last_seen_at)}`;
  const rows = [
    ['Model',     d.model    || '—'],
    ['Firmware',  d.firmware || '—'],
    ['Battery',   d.last_battery_pct != null ? `${d.last_battery_pct}%` : '—'],
    ['Last sync', formatAgo(d.latest_sample_at || d.last_seen_at)],
  ];
  document.getElementById('sheet-kv').innerHTML = rows.map(([k, v]) =>
    `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
}

function callNative(method, args = {}) {
  if (window.neeve?.postMessage) {
    window.neeve.postMessage(JSON.stringify({ method, args }));
  } else {
    alert('That action only works in the Neeve app.');
  }
}

// ── pull-to-refresh ─────────────────────────────────────────
(function setupPTR(){
  const ptr     = document.getElementById('ptr');
  const ptrText = document.getElementById('ptr-text');
  const TRIGGER = 80, MAX_PULL = 140;
  let startY = 0, pulling = false, triggered = false;
  function setHeight(h) { ptr.style.height = Math.max(0, Math.min(MAX_PULL, h)) + 'px'; }
  document.addEventListener('touchstart', e => {
    if (window.scrollY > 0 || triggered) return;
    startY = e.touches[0].clientY; pulling = true;
    ptr.classList.remove('refreshing');
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) { setHeight(0); return; }
    e.preventDefault();
    const eased = dy * 0.55;
    setHeight(eased);
    ptrText.textContent = eased >= TRIGGER ? 'Release to refresh' : 'Pull to refresh';
  }, { passive: false });
  document.addEventListener('touchend', () => {
    if (!pulling) return;
    pulling = false;
    const h = parseFloat(ptr.style.height) || 0;
    if (h >= TRIGGER) {
      triggered = true;
      ptr.classList.add('refreshing');
      ptrText.textContent = 'Refreshing…';
      setHeight(48);
      if (window.neeve?.postMessage) {
        callNative('freshRefresh');
        setTimeout(() => { setHeight(0); triggered = false; }, 30000);
      } else {
        Promise.resolve(load()).finally(() => { setHeight(0); triggered = false; });
      }
    } else {
      setHeight(0);
    }
  });
})();

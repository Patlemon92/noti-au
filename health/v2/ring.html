<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6F0" />
<title>Ring · Neeve</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,50;9..144,500,50;9..144,600,50&family=Inter+Tight:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">
</head>
<body>

<main class="page">
  <p class="label">Ring</p>
  <h1 class="title">Your data</h1>

  <!-- Device status -->
  <section class="card" id="device">
    <div class="empty">Loading…</div>
  </section>

  <!-- Time window toggle -->
  <section class="section">
    <div class="section-head">
      <h2 class="title-sm">Trends</h2>
      <div>
        <button class="pill" id="range-7"  onclick="setRange(7)">7d</button>
        <button class="pill" id="range-30" onclick="setRange(30)">30d</button>
      </div>
    </div>
    <div id="charts"></div>
  </section>

  <!-- Actions — these all call into the native iOS app via the JS bridge -->
  <section class="section" id="actions">
    <h2 class="title-sm">Actions</h2>
    <div class="card">
      <div style="display:flex; flex-direction:column; gap:10px">
        <button class="btn btn-primary" onclick="callNative('measureHeartRate')">Measure heart rate</button>
        <button class="btn btn-ghost"   onclick="callNative('syncNow')">Sync historical data</button>
        <button class="btn btn-ghost"   onclick="callNative('scanForRing')">Pair another ring</button>
      </div>
      <p class="caption" style="margin-top:14px">
        Measurements only work with the ring on your finger. Sync pulls
        anything the ring has stored since the last connection.
      </p>
    </div>
  </section>
</main>

<div id="nav-mount"></div>

<script src="/health/v2/lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('ring');

let currentRange = 7;
let cachedSamples = [];
let cachedDevice = null;

function setRange(days) {
  currentRange = days;
  document.querySelectorAll('[id^=range-]').forEach(b => b.classList.remove('pill-rose'));
  const btn = document.getElementById(`range-${days}`);
  if (btn) btn.classList.add('pill-rose');
  renderCharts();
}

let firstLoad = true;

async function load() {
  try {
    const [{ devices }, { samples }] = await Promise.all([
      api('/ring/status'),
      api('/ring/samples?limit=500'),
    ]);
    cachedDevice = devices[0];
    cachedSamples = samples;
    renderDevice();
    if (firstLoad) { setRange(7); firstLoad = false; }
    else renderCharts();
  } catch (e) {
    if (firstLoad) {
      document.getElementById('device').innerHTML =
        `<div class="empty">Couldn't load: ${e.message}</div>`;
    }
    // On refresh failure, leave the existing data on screen.
  }
}

load();
// Refresh every 90s while visible — ring's own monitoring scheduler
// is on a 2-min cadence so faster polling can't surface new readings.
// Pause when hidden, resume on visibility.
let _refreshTimer = null;
function _startRefresh() {
  if (_refreshTimer) return;
  _refreshTimer = setInterval(load, 90000);
}
function _stopRefresh() {
  if (_refreshTimer) { clearInterval(_refreshTimer); _refreshTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) _stopRefresh(); else { load(); _startRefresh(); }
});
if (!document.hidden) _startRefresh();
onResume(load);

function renderDevice() {
  if (!cachedDevice) {
    document.getElementById('device').innerHTML =
      '<div class="empty">No ring paired yet.</div>';
    return;
  }
  const d = cachedDevice;
  document.getElementById('device').innerHTML = `
    <div class="metric-row">
      <span class="metric-label">${d.name || 'Ring'}</span>
      <span class="pill ${d.last_seen_at ? 'pill-sage' : ''}">
        ${d.last_seen_at ? 'Connected' : 'Offline'}
      </span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Model</span>
      <span class="caption">${d.model || '—'}</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Firmware</span>
      <span class="caption">${d.firmware || '—'}</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Last sync</span>
      <span class="caption">${formatAgo(d.latest_sample_at || d.last_seen_at)}</span>
    </div>
    ${d.last_battery_pct != null ? `
      <div class="metric-row">
        <span class="metric-label">Battery</span>
        <span class="caption">${d.last_battery_pct}%</span>
      </div>` : ''}
  `;
}

function renderCharts() {
  const cutoff = Date.now() - currentRange * 86400 * 1000;
  const recent = cachedSamples.filter(s => new Date(s.ts).getTime() >= cutoff);
  const grouped = groupByMetric(recent);

  // Chart order. 'bp' is a virtual key — combines bp_sys + bp_dia into
  // one card. Skips sleep_stage (hypnogram on Today) + ecg_summary
  // (one-off, not a time series).
  const metrics = [
    'hr', 'hrv_rmssd', 'spo2', 'respiration_rate',
    'steps', 'bp', 'temp_skin', 'stress', 'vo2max',
  ];
  const html = metrics
    .filter(m => m === 'bp'
      ? (grouped.bp_sys && grouped.bp_sys.length > 0) || (grouped.bp_dia && grouped.bp_dia.length > 0)
      : grouped[m] && grouped[m].length > 0)
    .map(m => {
      if (m === 'bp') return renderBpCard(grouped.bp_sys || [], grouped.bp_dia || []);
      const samples = grouped[m];
      const latest = samples[samples.length - 1];
      const avg = (samples.reduce((a, s) => a + s.value, 0) / samples.length);
      const min = Math.min(...samples.map(s => s.value));
      const max = Math.max(...samples.map(s => s.value));
      return `
        <div class="card">
          <div class="section-head" style="margin-bottom:8px">
            <h3 class="title-sm" style="font-size:18px">${metricLabel(m)}</h3>
            <span class="caption">${samples.length} reading${samples.length === 1 ? '' : 's'}</span>
          </div>
          <div class="metric-row" style="border-bottom:none;padding:4px 0">
            <span class="caption">Latest</span>
            <span><span class="metric-value" style="font-size:20px">${formatValue(m, latest.value)}</span>
                  <span class="metric-unit">${metricUnit(m, latest.unit)}</span></span>
          </div>
          <div class="metric-row" style="border-bottom:none;padding:4px 0">
            <span class="caption">Range</span>
            <span class="caption">${formatValue(m, min)} – ${formatValue(m, max)} (avg ${formatValue(m, avg)})</span>
          </div>
          <div class="sparkline" id="spark-${m}"></div>
        </div>
      `;
    }).join('');

  document.getElementById('charts').innerHTML = html || '<div class="empty">No readings in this range yet.</div>';

  // Render sparklines with full samples (so the time axis works).
  // 'bp' renders two stacked lines (sys on top, dia below); the rest one.
  metrics.forEach(m => {
    if (m === 'bp') {
      if (grouped.bp_sys && grouped.bp_sys.length) {
        const el = document.getElementById('spark-bp-sys');
        if (el) renderSparkline(el, grouped.bp_sys, { color: 'var(--terra)' });
      }
      if (grouped.bp_dia && grouped.bp_dia.length) {
        const el = document.getElementById('spark-bp-dia');
        if (el) renderSparkline(el, grouped.bp_dia, { color: 'var(--rose)' });
      }
      return;
    }
    if (grouped[m] && grouped[m].length > 0) {
      const el = document.getElementById(`spark-${m}`);
      if (el) renderSparkline(el, grouped[m]);
    }
  });
}

function renderBpCard(sysS, diaS) {
  const sysLatest = sysS.length ? sysS[sysS.length - 1].value : null;
  const diaLatest = diaS.length ? diaS[diaS.length - 1].value : null;
  const sysAvg = sysS.length ? Math.round(sysS.reduce((a, s) => a + s.value, 0) / sysS.length) : null;
  const diaAvg = diaS.length ? Math.round(diaS.reduce((a, s) => a + s.value, 0) / diaS.length) : null;
  const count = Math.max(sysS.length, diaS.length);
  const latestStr = sysLatest != null && diaLatest != null
    ? `${Math.round(sysLatest)}/${Math.round(diaLatest)}`
    : (sysLatest != null ? `${Math.round(sysLatest)}/—` : `—/${Math.round(diaLatest)}`);
  const avgStr = sysAvg != null && diaAvg != null ? `${sysAvg}/${diaAvg}` : '—';
  return `
    <div class="card">
      <div class="section-head" style="margin-bottom:8px">
        <h3 class="title-sm" style="font-size:18px">Blood pressure</h3>
        <span class="caption">${count} reading${count === 1 ? '' : 's'}</span>
      </div>
      <div class="metric-row" style="border-bottom:none;padding:4px 0">
        <span class="caption">Latest</span>
        <span><span class="metric-value" style="font-size:20px">${latestStr}</span>
              <span class="metric-unit">mmHg</span></span>
      </div>
      <div class="metric-row" style="border-bottom:none;padding:4px 0">
        <span class="caption">Average</span>
        <span class="caption">${avgStr} mmHg</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <span class="caption" style="width:30px">sys</span>
        <div class="sparkline" id="spark-bp-sys" style="flex:1"></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
        <span class="caption" style="width:30px">dia</span>
        <div class="sparkline" id="spark-bp-dia" style="flex:1"></div>
      </div>
    </div>
  `;
}

// JS bridge — Flutter webview_flutter exposes channels as
// window.<channelName>.postMessage(string). (window.webkit.messageHandlers
// is the raw WKWebView API — Flutter's wrapper does NOT register channels
// there, so that check would silently swallow calls.)
function callNative(method, args = {}) {
  if (window.neeve?.postMessage) {
    window.neeve.postMessage(JSON.stringify({ method, args }));
  } else {
    alert('That action only works in the Neeve app.');
  }
}
</script>
</body>
</html>

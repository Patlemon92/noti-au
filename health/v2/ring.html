<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6F0" />
<title>Ring · Neeve</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,50;9..144,500,50;9..144,600,50&family=Inter+Tight:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">

<style>
/* Soft peach-to-cream gradient matching every other v2 surface. */
:root {
  --ink-2: #2b2018;
  --clay-2: #bf5a3c;
  --taupe-2: #9a8369;
  --warm-card: #fffdf9;
}
body {
  background: linear-gradient(180deg, #f6e6d6 0%, #f6efe4 30%, #f6efe4 100%);
  background-attachment: fixed;
  color: var(--ink-2);
}
/* ── Bring Ring in line with the rest of v2 (Today / Record /
   More / Alys) — warm cream cards, Fraunces titles, soft shadows,
   matching pills + eyebrows. */

.page { max-width: 460px; margin: 0 auto; padding: 20px 22px 110px; animation: ring-fade .5s ease; }
@keyframes ring-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Top labels: small eyebrow + big Fraunces title */
.page .label {
  font-family: 'Inter Tight', sans-serif;
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--taupe-2, #9a8369); font-weight: 600;
  margin-bottom: 8px;
}
.page .title {
  font-family: 'Fraunces', serif; font-weight: 500;
  font-size: 38px; letter-spacing: -.8px; line-height: 1;
  color: var(--ink-2, #2b2018); margin-bottom: 28px;
}

/* Trends section header → eyebrow style with clay accent + hairline */
.section-head { margin: 28px 0 12px; }
.section-head h2.title-sm {
  font-family: 'Inter Tight', sans-serif;
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--taupe-2, #9a8369); font-weight: 600;
  display: inline-flex; align-items: center; gap: 10px;
  margin: 0;
}
.section-head h2.title-sm::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--clay-2, #bf5a3c); opacity: .65;
}

/* Range pills match the More / Record range-pills style */
.section-head .pill,
.section-head button.pill {
  border: 1px solid rgba(43, 32, 24, .12);
  background: rgba(255, 255, 255, .65); color: var(--ink-2, #2b2018);
  padding: 6px 12px; border-radius: 99px;
  font-family: 'Inter Tight', sans-serif; font-size: 12.5px; font-weight: 500;
  cursor: pointer;
  margin-left: 4px;
}
.section-head .pill.pill-rose {
  background: var(--ink-2, #2b2018); color: #fff7f0;
  border-color: var(--ink-2, #2b2018);
}

/* Metric cards: warm cream with soft warm shadow (matches Today's
   slot cards + Record's envelope rows + More's group cards) */
.card {
  background: linear-gradient(180deg, #ffffff 0%, #fffaf2 100%);
  border: 1px solid rgba(255, 255, 255, .9);
  border-radius: 18px; padding: 18px 20px; margin-bottom: 12px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 18px 34px -26px rgba(140, 80, 50, .32),
    0 3px 10px -6px rgba(140, 80, 50, .1);
  transition: transform .14s ease;
}
.metric-card-link:active .card { transform: scale(.992); }

/* Metric card title in Fraunces */
.card .section-head h3.title-sm {
  font-family: 'Fraunces', serif !important;
  font-weight: 500;
  font-size: 18px !important;
  letter-spacing: -.2px;
  color: var(--ink-2, #2b2018);
  text-transform: none;
}
.card .section-head h3.title-sm::before { display: none; }

/* Latest / Range labels in small caps */
.card .metric-row .caption {
  font-family: 'Inter Tight', sans-serif;
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--taupe-2, #9a8369); font-weight: 600;
}
.card .metric-row .metric-value {
  font-family: 'Fraunces', serif !important;
  font-weight: 500 !important;
  font-size: 22px !important;
  color: var(--ink-2, #2b2018) !important;
  letter-spacing: -.4px;
}
.card .metric-row .metric-unit {
  font-size: 12px; color: var(--taupe-2, #9a8369);
}

/* Chev arrow on tappable metric cards */
.metric-card-link .chev {
  color: var(--ink-mute, #b9a994);
  font-size: 22px;
}

/* Connection pill matches Today's frosted pill */
.head-pill {
  background: var(--warm-card, #fffdf9) !important;
  color: var(--ink-2, #2b2018) !important;
  border: 1px solid rgba(43, 32, 24, .08) !important;
  font-family: 'Inter Tight', sans-serif;
  font-size: 12.5px; font-weight: 500;
  padding: 7px 14px !important;
  box-shadow: 0 8px 22px -16px rgba(70, 45, 25, .35);
}
.head-pill .dot { background: var(--ink-mute); }
.head-pill .dot-on { background: var(--sage-deep, #94a87a); box-shadow: 0 0 0 3px rgba(148, 168, 122, .22); }

.page-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
  position: relative;
}
/* Sync indicator — top-right. Tap to force a fresh measurement +
   buffer drain on the ring. Also spins on its own while any
   /ring/samples fetch is in flight. */
.sync-indicator {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  color: var(--clay-2, #bf5a3c);
  background: var(--warm-card, #fffdf9);
  border: 1px solid rgba(44, 32, 23, .08);
  cursor: pointer;
  opacity: .85; transition: opacity .2s ease, transform .12s ease;
  margin-left: 8px;
  box-shadow: 0 8px 22px -16px rgba(70, 45, 25, .35);
}
.sync-indicator:active { transform: scale(.94); }
.sync-indicator.active { opacity: 1; }
.sync-indicator svg { width: 18px; height: 18px; transition: transform .3s ease; }
.sync-indicator.spinning svg {
  animation: sync-spin 1s linear infinite;
}
@keyframes sync-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.head-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bone-deep); color: var(--ink-mute);
  border: none; border-radius: 999px; padding: 6px 12px;
  font-family: 'Inter Tight', sans-serif; font-size: 13px; cursor: pointer;
}
.head-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-mute); display: inline-block; }
.head-pill .dot-on { background: var(--sage-deep); }

/* Metric cards become tappable. */
.metric-card-link { display: block; text-decoration: none; color: inherit; }
.metric-card-link:active .card { transform: scale(0.995); }
.metric-card-link .chev {
  font-family: 'Inter Tight', sans-serif; color: var(--ink-mute);
  font-size: 22px; line-height: 1;
}

/* Modal sheet for ring details/actions. */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(43, 34, 28, 0.45);
  z-index: 1000; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1001;
  background: var(--bone); border-radius: 20px 20px 0 0;
  padding: 20px 20px max(24px, env(safe-area-inset-bottom)) 20px;
  transform: translateY(100%);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  max-height: 85vh; overflow-y: auto;
  /* No shadow while closed — the sheet sits just below the viewport with
     bottom:0 + translateY(100%), so a shadow on it always would bleed
     upward as a permanent dark bar at the bottom of the screen. */
  box-shadow: none;
}
.sheet.open {
  transform: translateY(0);
  box-shadow: 0 -10px 30px rgba(43, 34, 28, 0.18);
}

/* Pull-to-refresh indicator */
.ptr {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: center; align-items: flex-end;
  height: 0; overflow: hidden; pointer-events: none;
  color: var(--ink-mute); font-size: 13px;
  background: var(--bone); z-index: 50;
  transition: height 0.18s ease;
}
.ptr-inner { padding: 10px 0; display: flex; align-items: center; gap: 8px; }
.ptr-spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--hair); border-top-color: var(--terra);
  display: inline-block;
}
.ptr.pulling .ptr-spinner { transform: rotate(0deg); }
.ptr.refreshing .ptr-spinner { animation: ptr-spin 0.8s linear infinite; }
@keyframes ptr-spin { to { transform: rotate(360deg); } }
.sheet-grip {
  width: 36px; height: 4px; background: var(--hair); border-radius: 2px;
  margin: 0 auto 12px;
}
.sheet h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; color: var(--ink); margin: 0 0 4px; }
.sheet .sheet-caption { font-size: 13px; color: var(--ink-mute); margin-bottom: 16px; }
.sheet .kv { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
.sheet .kv .k { color: var(--ink-mute); }
.sheet .kv .v { color: var(--ink); }
.sheet .action-row { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
</style>
</head>
<body>

<div class="ptr" id="ptr">
  <div class="ptr-inner">
    <span class="ptr-spinner"></span>
    <span id="ptr-text">Pull to refresh</span>
  </div>
</div>

<main class="page">
  <div class="page-head">
    <div>
      <p class="label">Ring</p>
      <h1 class="title">Your data</h1>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="head-pill" id="ring-pill" onclick="openSheet()" aria-label="Ring details">
        <span class="dot" id="ring-dot"></span>
        <span id="ring-pill-text">Details</span>
      </button>
      <button class="sync-indicator" id="sync-indicator" type="button"
              onclick="manualSync()" aria-label="Sync now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <polyline points="21 3 21 8 16 8"/>
          <polyline points="3 21 3 16 8 16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Trends — metric cards. Each is a tappable card linking to detail. -->
  <!-- Sleep is treated as one of the metric cards (rendered inline below). -->
  <section class="section">
    <div class="section-head">
      <h2 class="title-sm">Trends</h2>
      <div>
        <button class="pill" id="range-7"  onclick="setRange(7)">7d</button>
        <button class="pill" id="range-30" onclick="setRange(30)">30d</button>
      </div>
    </div>
    <div id="charts"></div>
  </section>
</main>

<!-- Bottom-sheet modal: device info + actions -->
<div class="sheet-backdrop" id="sheet-bd" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <h2 id="sheet-name">Ring</h2>
  <div class="sheet-caption" id="sheet-state">—</div>
  <div id="sheet-kv"></div>
  <div class="action-row">
    <button class="btn btn-primary" onclick="callNative('reconnectRing'); closeSheet()">Reconnect ring</button>
    <button class="btn btn-ghost"   onclick="callNative('measureHeartRate'); closeSheet()">Measure heart rate</button>
    <button class="btn btn-ghost"   id="sheet-ecg-btn" onclick="startEcgFromSheet()">Record 30-second ECG</button>
    <p id="sheet-ecg-status" style="font-size:11px;color:var(--ink-50);margin:-4px 0 6px;line-height:1.45;display:none"></p>
    <button class="btn btn-ghost"   onclick="callNative('syncNow');   closeSheet()">Sync historical data</button>
    <button class="btn btn-ghost"   onclick="callNative('scanForRing'); closeSheet()">Pair another ring</button>
    <a class="btn btn-ghost" href="/health/v2/profile" onclick="closeSheet()" style="text-align:center">Ring profile (More tab)</a>
    <button class="btn btn-ghost" id="sheet-debug" onclick="callNative('openDebug'); closeSheet()" style="display:none">Debug</button>
  </div>
</div>

<div id="nav-mount"></div>

<script src="/health/v2/lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('ring');

// Debug button only shows inside the native shell.
if (window.neeve?.postMessage) {
  document.getElementById('sheet-debug').style.display = 'block';
}

let currentRange = 7;
let cachedSamples = [];
let cachedSleep = { stages: [], sessions: [] };
let cachedDevice = null;

// Every metric the trends section can chart. 'bp' is virtual — fetch
// the two real metrics. Sleep is its own card (using sleep_session
// rows) which we also pull in the same single request.
// Steps included here in the deep-dive trends view because raw history
// is useful context. Steps are NOT surfaced as a hero / wellness signal
// on Today, in the widget, or in the doctor PDF — see
// [[feedback-no-steps]] for the rule.
const TREND_METRICS = [
  'strain_score', 'recovery_score',
  'hr', 'hrv_rmssd', 'hrv_index', 'spo2', 'respiration_rate',
  'steps', 'bp_sys', 'bp_dia', 'temp_skin', 'stress', 'pressure_index',
  'load_index', 'body_index', 'vo2max', 'sleep_session', 'sleep_stage',
];

function setRange(days) {
  currentRange = days;
  document.querySelectorAll('[id^=range-]').forEach(b => b.classList.remove('pill-rose'));
  const btn = document.getElementById(`range-${days}`);
  if (btn) btn.classList.add('pill-rose');
  load();
}

let firstLoad = true;

// Sync indicator helpers — top-right spinner shows when a /ring/*
// request is in flight so the user sees the page staying current.
let _syncInFlight = 0;
function syncStart() {
  _syncInFlight++;
  const el = document.getElementById('sync-indicator');
  if (el) el.classList.add('active', 'spinning');
}
function syncEnd() {
  _syncInFlight = Math.max(0, _syncInFlight - 1);
  if (_syncInFlight === 0) {
    const el = document.getElementById('sync-indicator');
    if (el) {
      el.classList.remove('spinning');
      setTimeout(() => {
        if (_syncInFlight === 0) el.classList.remove('active');
      }, 400);
    }
  }
}

// Tap-to-sync — fires a fresh measurement + buffer drain on the
// ring side via the native bridge, then reloads the page data.
async function manualSync() {
  syncStart();
  if (window.neeve && window.neeve.postMessage) {
    window.neeve.postMessage(JSON.stringify({ method: 'freshRefresh' }));
  }
  try {
    await load();
    // Give the ring time to land fresh samples, then reload again.
    await new Promise(r => setTimeout(r, 16000));
    await load();
  } finally {
    syncEnd();
  }
}

async function load() {
  syncStart();
  try {
    const trendsSince = new Date(Date.now() - currentRange * 86400 * 1000).toISOString();
    const trendsQ = `/ring/samples?metric=${TREND_METRICS.join(',')}&limit=5000&since=${encodeURIComponent(trendsSince)}`;
    // Sleep needs its own query — the combined trends pull is saturated
    // with high-frequency HR/HRV/SpO2 samples and the older but vital
    // sleep_session + sleep_stage rows get cut off the bottom of the
    // limit=5000 buffer. Window: 30 days regardless of trend range
    // pill so the sleep card always renders if you've slept this month.
    const sleepSince = new Date(Date.now() - 30 * 86400 * 1000).toISOString();
    const sleepQ = `/ring/samples?metric=sleep_session,sleep_stage&limit=2000&since=${encodeURIComponent(sleepSince)}`;
    const [{ devices }, { samples }, sleepRes] = await Promise.all([
      api('/ring/status'),
      api(trendsQ),
      api(sleepQ).catch(() => ({ samples: [] })),
    ]);
    cachedDevice = devices[0];
    cachedSamples = (samples || []).filter(s => s.metric !== 'sleep_session' && s.metric !== 'sleep_stage');
    const sleepSamples = sleepRes.samples || [];
    cachedSleep.sessions = sleepSamples.filter(s => s.metric === 'sleep_session');
    cachedSleep.stages   = sleepSamples.filter(s => s.metric === 'sleep_stage');
    renderHeadPill();
    if (firstLoad) {
      document.getElementById(`range-${currentRange}`)?.classList.add('pill-rose');
      firstLoad = false;
    }
    renderCharts();
  } catch (e) {
    if (firstLoad) {
      document.getElementById('charts').innerHTML =
        `<div class="empty">Couldn't load: ${e.message}</div>`;
    }
  } finally {
    syncEnd();
  }
}

load();
// Refresh every 5s while visible. The ring's continuous-monitoring
// scheduler is on a 2-min cadence so most ticks won't have new data
// — but on-demand PPG measurements (Tag-a-reading, BP measure, Sync
// now) land within ~12s and Patrick wants the page to reflect them
// without a manual pull. load() is a single GET; cheap to repeat.
// Also listen for explicit ring-tick events from the native bridge so
// new samples land immediately on ingest, not on next poll boundary.
let _refreshTimer = null;
let _lastLoadAt = 0;
function _loadIfFresh() {
  // Debounce: a ring tick + a scheduled tick shouldn't both fire load
  // within a few hundred ms. Skip if a load ran in the last 1.5s.
  const now = Date.now();
  if (now - _lastLoadAt < 1500) return;
  _lastLoadAt = now;
  load();
}
function _startRefresh() {
  if (_refreshTimer) return;
  _refreshTimer = setInterval(_loadIfFresh, 5000);
}
function _stopRefresh() {
  if (_refreshTimer) { clearInterval(_refreshTimer); _refreshTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) _stopRefresh(); else { _loadIfFresh(); _startRefresh(); }
});
window.addEventListener('neeve:ring-tick', _loadIfFresh);
if (!document.hidden) _startRefresh();
onResume(_loadIfFresh);

function renderHeadPill() {
  const pill   = document.getElementById('ring-pill');
  const dot    = document.getElementById('ring-dot');
  const text   = document.getElementById('ring-pill-text');
  const d = cachedDevice;
  if (!d) { dot.className = 'dot'; text.textContent = 'Pair'; pill.onclick = openSheet; return; }
  const connOn = d.last_seen_at && (Date.now() - new Date(d.last_seen_at)) < 10 * 60 * 1000;
  dot.className = 'dot ' + (connOn ? 'dot-on' : '');
  text.textContent = connOn ? 'Connected' : 'Last seen ' + formatAgo(d.last_seen_at);
}

// Sleep is now a card inside the trends list — see renderSleepCard
// called from renderCharts. This stub is kept so a previous load()
// reference doesn't break.
function renderSleep() { /* no-op — handled in renderCharts */ }

function fmtHm(seconds) {
  if (!seconds || seconds <= 0) return '—';
  const h = Math.floor(seconds / 3600);
  const m = Math.round((seconds % 3600) / 60);
  return `${h}h ${m}m`;
}

function renderSleepCard(sessions) {
  if (!sessions.length) return '';
  const sorted = sessions.slice().sort((a, b) => new Date(b.ts) - new Date(a.ts));
  const latest = sorted[0];
  const values = sorted.map(s => Number(s.value)).filter(v => isFinite(v) && v > 0);
  if (!values.length) return '';
  const minS = Math.min(...values);
  const maxS = Math.max(...values);
  const avgS = values.reduce((a, b) => a + b, 0) / values.length;
  const detailUrl = `/health/v2/sleep.html`;

  // Last night's stage breakdown — from cachedSleep.stages within the
  // last 24h. Each sample has a `value` 0=awake, 1=light, 2=deep,
  // 3=REM (per lib.js convention) and a duration. We aggregate.
  const last24h = Date.now() - 24 * 3600 * 1000;
  const recentStages = (cachedSleep.stages || []).filter(s =>
    new Date(s.ts).getTime() > last24h);
  let stagesHtml = '';
  let hypnoHtml = '';
  if (recentStages.length) {
    // Aggregate stage durations (minutes). Each sample's "value"
    // encodes the stage; we infer duration from delta between
    // adjacent timestamps.
    const sorted = recentStages.slice().sort((a, b) =>
      new Date(a.ts) - new Date(b.ts));
    const totals = { 0: 0, 1: 0, 2: 0, 3: 0 };
    for (let i = 0; i < sorted.length; i++) {
      const cur = sorted[i];
      const next = sorted[i + 1];
      const dur = next
        ? Math.max(0, (new Date(next.ts) - new Date(cur.ts)) / 60000)
        : 0;
      const stage = Math.round(Number(cur.value));
      if (totals[stage] != null) totals[stage] += dur;
    }
    const fmt = m => `${Math.floor(m / 60)}h ${Math.round(m % 60)}m`;
    stagesHtml = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)">
        <div><div class="caption" style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute)">Deep</div><div style="font-family:'Fraunces',serif;font-weight:500;font-size:17px;color:var(--ink)">${fmt(totals[2])}</div></div>
        <div><div class="caption" style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute)">Light</div><div style="font-family:'Fraunces',serif;font-weight:500;font-size:17px;color:var(--ink)">${fmt(totals[1])}</div></div>
        <div><div class="caption" style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute)">REM</div><div style="font-family:'Fraunces',serif;font-weight:500;font-size:17px;color:var(--ink)">${fmt(totals[3])}</div></div>
        <div><div class="caption" style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute)">Awake</div><div style="font-family:'Fraunces',serif;font-weight:500;font-size:17px;color:var(--ink)">${fmt(totals[0])}</div></div>
      </div>`;
    // Build a horizontal mini-hypnogram (each stage as a colored bar)
    const t0 = new Date(sorted[0].ts).getTime();
    const t1 = new Date(sorted[sorted.length - 1].ts).getTime();
    const dt = Math.max(1, t1 - t0);
    const stageColor = {
      0: '#cb8270',  // awake (clay)
      1: '#c8a23f',  // light (gold)
      2: '#8f6c86',  // deep (plum)
      3: '#94a87a',  // REM (sage)
    };
    const segments = [];
    for (let i = 0; i < sorted.length - 1; i++) {
      const stage = Math.round(Number(sorted[i].value));
      const x = ((new Date(sorted[i].ts).getTime() - t0) / dt) * 100;
      const w = ((new Date(sorted[i + 1].ts).getTime() - new Date(sorted[i].ts).getTime()) / dt) * 100;
      const color = stageColor[stage] || 'rgba(43,32,24,.2)';
      segments.push(`<div style="position:absolute;left:${x.toFixed(2)}%;width:${w.toFixed(2)}%;top:0;bottom:0;background:${color}"></div>`);
    }
    hypnoHtml = `
      <div style="position:relative;height:24px;border-radius:8px;overflow:hidden;margin-top:12px;background:var(--bone-deep)">
        ${segments.join('')}
      </div>`;
  }

  // Format the last-night window so the user can see when sleep
  // started + ended (e.g. "10:48 pm → 6:33 am").
  let windowStr = '';
  if (recentStages.length) {
    const orderedStages = recentStages.slice().sort((a, b) =>
      new Date(a.ts) - new Date(b.ts));
    const t0 = new Date(orderedStages[0].ts);
    const t1 = new Date(orderedStages[orderedStages.length - 1].ts);
    const fmt = d => d.toLocaleTimeString('en-AU', {
      hour: 'numeric', minute: '2-digit', hour12: true
    }).toLowerCase();
    windowStr = `${fmt(t0)} → ${fmt(t1)}`;
  }

  return `
    <a class="metric-card-link" href="${detailUrl}">
      <div class="card">
        <div class="section-head" style="margin-bottom:6px;display:flex;align-items:flex-start;justify-content:space-between">
          <h3 class="title-sm">Last night</h3>
          <span class="chev">›</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px;margin:6px 0 4px">
          <span style="font-family:'Fraunces',serif;font-weight:500;font-size:32px;letter-spacing:-.7px;color:var(--ink-2,#2b2018);line-height:1">${fmtHm(latest.value)}</span>
        </div>
        ${windowStr ? `<div style="font-size:12.5px;color:var(--taupe-2,#9a8369);font-style:italic">${windowStr}</div>` : ''}
        ${hypnoHtml}
        ${stagesHtml}
      </div>
    </a>
  `;
}

function renderCharts() {
  const cutoff = Date.now() - currentRange * 86400 * 1000;
  const recent = cachedSamples.filter(s => new Date(s.ts).getTime() >= cutoff);
  const grouped = groupByMetric(recent);

  // Sleep sits at the top of the trends list (matches the other cards).
  // Filtered to the visible window so 7d / 30d toggle works.
  const sleepInWindow = cachedSleep.sessions.filter(s =>
    new Date(s.ts).getTime() >= cutoff);

  // Chart order. 'sleep' is virtual — renderSleepCard pulls from
  // cachedSleep.sessions (separate metric filter). 'bp' is virtual —
  // combines bp_sys + bp_dia. Skips sleep_stage and ecg_summary.
  const metrics = [
    'strain_score', 'recovery_score', 'sleep',
    'hr', 'hrv_rmssd', 'hrv_index', 'spo2', 'respiration_rate',
    'steps', 'bp', 'temp_skin', 'stress', 'pressure_index',
    'load_index', 'body_index', 'vo2max',
  ];
  const html = metrics
    .filter(m => {
      if (m === 'sleep') return sleepInWindow.length > 0;
      if (m === 'bp')    return (grouped.bp_sys?.length > 0) || (grouped.bp_dia?.length > 0);
      return grouped[m]?.length > 0;
    })
    .map(m => {
      if (m === 'sleep') return renderSleepCard(sleepInWindow);
      if (m === 'bp') return renderBpCard(grouped.bp_sys || [], grouped.bp_dia || []);
      const samples = grouped[m];
      let latest = samples[samples.length - 1];
      // Steps are a cumulative-today counter — display max-of-today,
      // not latest. Defensive against stray non-monotonic samples that
      // can slip in (e.g. a ring side reset, multi-ring crossover).
      // PRODUCT_BRIEF.md no-steps rule still applies: steps remain in
      // deep-dive trends here, never as a hero on Today.
      if (m === 'steps') {
        const todayStart = new Date(); todayStart.setHours(0,0,0,0);
        const todaySamples = samples.filter(s =>
          new Date(s.ts).getTime() >= todayStart.getTime());
        if (todaySamples.length) {
          const maxToday = Math.max(...todaySamples.map(s => s.value));
          // Spoof the headline reading; keep ts so 'ago' still works.
          latest = { ...latest, value: maxToday };
        }
      }
      const avg = (samples.reduce((a, s) => a + s.value, 0) / samples.length);
      const min = Math.min(...samples.map(s => s.value));
      const max = Math.max(...samples.map(s => s.value));
      const detailUrl = `/health/v2/metric.html?metric=${encodeURIComponent(m)}&days=${currentRange}`;
      return `
        <a class="metric-card-link" href="${detailUrl}">
          <div class="card">
            <div class="section-head" style="margin-bottom:6px;display:flex;align-items:flex-start;justify-content:space-between">
              <h3 class="title-sm">${metricLabel(m)}</h3>
              <span class="chev">›</span>
            </div>
            <div style="display:flex;align-items:baseline;gap:8px;margin:6px 0 4px">
              <span class="metric-value" style="font-family:'Fraunces',serif;font-weight:500;font-size:32px;letter-spacing:-.7px;color:var(--ink-2,#2b2018);line-height:1">${formatValue(m, latest.value)}</span>
              <span class="metric-unit" style="font-size:13px;color:var(--taupe-2,#9a8369)">${metricUnit(m, latest.unit)}</span>
            </div>
            <div style="font-size:12.5px;color:var(--taupe-2,#9a8369);font-style:italic">
              ${formatValue(m, min)}–${formatValue(m, max)} · avg ${formatValue(m, avg)}
            </div>
            <div class="sparkline" id="spark-${m}" style="margin-top:10px"></div>
          </div>
        </a>
      `;
    }).join('');

  document.getElementById('charts').innerHTML = html || '<div class="empty">No readings in this range yet.</div>';

  metrics.forEach(m => {
    if (m === 'sleep') {
      if (sleepInWindow.length) {
        const el = document.getElementById('spark-sleep');
        // Sparkline expects {ts, value}; sleep_session.value is seconds —
        // convert to hours so the y-scale is human.
        if (el) renderSparkline(el,
          sleepInWindow.map(s => ({ ts: s.ts, value: Number(s.value) / 3600 })),
          { color: 'var(--plum)' });
      }
      return;
    }
    if (m === 'bp') {
      if (grouped.bp_sys && grouped.bp_sys.length) {
        const el = document.getElementById('spark-bp-sys');
        if (el) renderSparkline(el, grouped.bp_sys, { color: 'var(--terra)' });
      }
      if (grouped.bp_dia && grouped.bp_dia.length) {
        const el = document.getElementById('spark-bp-dia');
        if (el) renderSparkline(el, grouped.bp_dia, { color: 'var(--rose)' });
      }
      return;
    }
    if (grouped[m] && grouped[m].length > 0) {
      const el = document.getElementById(`spark-${m}`);
      if (el) renderSparkline(el, grouped[m]);
    }
  });
}

function renderBpCard(sysS, diaS) {
  const sysLatest = sysS.length ? sysS[sysS.length - 1].value : null;
  const diaLatest = diaS.length ? diaS[diaS.length - 1].value : null;
  const sysAvg = sysS.length ? Math.round(sysS.reduce((a, s) => a + s.value, 0) / sysS.length) : null;
  const diaAvg = diaS.length ? Math.round(diaS.reduce((a, s) => a + s.value, 0) / diaS.length) : null;
  const latestStr = sysLatest != null && diaLatest != null
    ? `${Math.round(sysLatest)}/${Math.round(diaLatest)}`
    : (sysLatest != null ? `${Math.round(sysLatest)}/—` : `—/${Math.round(diaLatest)}`);
  const avgStr = sysAvg != null && diaAvg != null ? `${sysAvg}/${diaAvg}` : '—';
  // 'Blood pressure' card opens the combined sys+dia detail page.
  const detailUrl = `/health/v2/metric.html?metric=bp&days=${currentRange}`;
  return `
    <a class="metric-card-link" href="${detailUrl}">
      <div class="card">
        <div class="section-head" style="margin-bottom:8px">
          <h3 class="title-sm" style="font-size:18px">Blood pressure</h3>
          <span class="chev">›</span>
        </div>
        <div class="metric-row" style="border-bottom:none;padding:4px 0">
          <span class="caption">Latest</span>
          <span><span class="metric-value" style="font-size:20px">${latestStr}</span>
                <span class="metric-unit">mmHg</span></span>
        </div>
        <div class="metric-row" style="border-bottom:none;padding:4px 0">
          <span class="caption">Average</span>
          <span class="caption">${avgStr} mmHg</span>
        </div>
        <div style="margin-top:10px;padding:8px 10px;background:rgba(220,110,75,.06);border:1px solid rgba(220,110,75,.16);border-radius:8px;font-size:11px;line-height:1.4;color:var(--clay-2,#bf5a3c)">
          <strong>Experimental.</strong> Optical PPG estimates, not a clinical reading. Calibrate against a cuff in More → Your Neeve Ring. Use a real cuff for anything that matters.
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
          <span class="caption" style="width:30px">sys</span>
          <div class="sparkline" id="spark-bp-sys" style="flex:1"></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
          <span class="caption" style="width:30px">dia</span>
          <div class="sparkline" id="spark-bp-dia" style="flex:1"></div>
        </div>
      </div>
    </a>
  `;
}

// ── Bottom sheet ──────────────────────────────────────────
function openSheet() {
  document.getElementById('sheet-bd').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  populateSheet();
}
function closeSheet() {
  document.getElementById('sheet-bd').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
function populateSheet() {
  const d = cachedDevice;
  if (!d) {
    document.getElementById('sheet-name').textContent = 'No ring paired';
    document.getElementById('sheet-state').textContent = 'Tap "Pair another ring" to set one up.';
    document.getElementById('sheet-kv').innerHTML = '';
    return;
  }
  const connOn = d.last_seen_at && (Date.now() - new Date(d.last_seen_at)) < 10 * 60 * 1000;
  document.getElementById('sheet-name').textContent = d.name || 'Ring';
  document.getElementById('sheet-state').textContent =
    connOn ? 'Connected' : `Last seen ${formatAgo(d.last_seen_at)}`;
  const rows = [
    ['Model',    d.model    || '—'],
    ['Firmware', d.firmware || '—'],
    ['Battery',  d.last_battery_pct != null ? `${d.last_battery_pct}%` : '—'],
    ['Last sync', formatAgo(d.latest_sample_at || d.last_seen_at)],
  ];
  document.getElementById('sheet-kv').innerHTML = rows.map(([k, v]) =>
    `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`
  ).join('');
}

function callNative(method, args = {}) {
  if (window.neeve?.postMessage) {
    window.neeve.postMessage(JSON.stringify({ method, args }));
  } else {
    alert('That action only works in the Neeve app.');
  }
}

// ── ECG flow ─────────────────────────────────────────────
// Tap → triggers a 30s on-ring recording via the native bridge. The
// bridge dispatches neeve:ecg-result CustomEvents at each phase
// (starting / recording / done) which we surface inline. The summary
// row lands in ring_samples as 'ecg_summary' — page polling picks it
// up on the next tick.
function startEcgFromSheet() {
  const btn = document.getElementById('sheet-ecg-btn');
  const status = document.getElementById('sheet-ecg-status');
  if (!window.neeve?.postMessage) {
    alert('ECG only works in the Neeve app.');
    return;
  }
  if (btn) btn.disabled = true;
  if (status) { status.style.display = 'block'; status.textContent = 'Starting…'; }
  window.neeve.postMessage(JSON.stringify({ method: 'runEcg' }));
}

if (!window._ecgResultListener) {
  document.addEventListener('neeve:ecg-result', (e) => {
    const btn = document.getElementById('sheet-ecg-btn');
    const status = document.getElementById('sheet-ecg-status');
    const phase = e.detail?.phase || 'done';
    const ok = e.detail?.ok;
    const msg = e.detail?.message;
    if (status) {
      status.style.display = 'block';
      if (phase === 'starting') {
        status.textContent = 'Starting ECG…';
      } else if (phase === 'recording') {
        status.textContent = 'Recording — keep the ring on for 30s.';
      } else {
        status.textContent = (ok ? 'Done. ' : 'Failed. ') + (msg || '');
        if (btn) btn.disabled = false;
        // refresh the data so the new ecg_summary row surfaces
        if (typeof load === 'function') load();
      }
    }
  });
  window._ecgResultListener = true;
}

// ── Pull-to-refresh ──────────────────────────────────────
// Drag down from the top of the page to fire syncNow. The iOS bridge
// handler reloads the WebView on success, so we don't need to do
// anything else after dispatch — but if we're in a browser without
// the bridge, fall back to the in-page load() so the gesture still
// feels responsive.
(function setupPTR(){
  const ptr      = document.getElementById('ptr');
  const ptrText  = document.getElementById('ptr-text');
  const TRIGGER  = 80;   // px pulled to trigger refresh
  const MAX_PULL = 140;  // px clamp so the indicator can't grow forever
  let startY = 0;
  let pulling = false;
  let triggered = false;

  function setHeight(h) { ptr.style.height = Math.max(0, Math.min(MAX_PULL, h)) + 'px'; }

  document.addEventListener('touchstart', e => {
    if (window.scrollY > 0) return;
    if (triggered) return;
    startY = e.touches[0].clientY;
    pulling = true;
    ptr.classList.remove('refreshing');
    ptr.classList.add('pulling');
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) { setHeight(0); return; }
    // Rubber-band: resistance grows with distance.
    const eased = dy * 0.55;
    setHeight(eased);
    ptrText.textContent = eased >= TRIGGER ? 'Release to refresh' : 'Pull to refresh';
  }, { passive: true });

  document.addEventListener('touchend', () => {
    if (!pulling) return;
    pulling = false;
    const h = parseFloat(ptr.style.height) || 0;
    if (h >= TRIGGER) {
      triggered = true;
      ptr.classList.remove('pulling');
      ptr.classList.add('refreshing');
      ptrText.textContent = 'Refreshing…';
      setHeight(48);
      if (window.neeve?.postMessage) {
        // Native shell — freshRefresh triggers a new measurement,
        // waits for the PPG cycle, then syncs and reloads. About
        // 16-20s end-to-end before the banner clears.
        callNative('freshRefresh');
        // Safety: if reload doesn't happen within 30s (slow BLE),
        // drop the banner anyway so the user isn't stuck.
        setTimeout(() => { setHeight(0); triggered = false; }, 30000);
      } else {
        // Browser fallback: just re-run page load.
        Promise.resolve(load()).finally(() => {
          setHeight(0); triggered = false;
        });
      }
    } else {
      setHeight(0);
    }
  });
})();
</script>

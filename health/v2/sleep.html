<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6F0" />
<title>Sleep · Neeve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,50;9..144,500,50;9..144,600,50&family=Inter+Tight:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">
<style>
.tot-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
.tot { padding: 12px 4px; }
.tot .lbl { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 4px; }
.tot .val { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; color: var(--ink); line-height: 1; }
.tot .unit { font-family: 'Inter Tight', sans-serif; font-size: 12px; color: var(--ink-mute); margin-left: 4px; }
.tot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; vertical-align: middle; margin-right: 5px; }
.dot-deep   { background: var(--plum); }
.dot-light  { background: var(--rose-deep); }
.dot-rem    { background: var(--terra); }
.dot-awake  { background: var(--butter-deep); }
.dur-card .total {
  font-family: 'Fraunces', serif; font-size: 36px; font-weight: 500;
  color: var(--ink); margin: 8px 0;
}
.dur-card .range { font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>
<main class="page">
  <p class="label">Sleep</p>
  <h1 class="title">Last night</h1>

  <div class="card" id="hypnogram-card">
    <div class="empty">Loading…</div>
  </div>

  <div class="card dur-card" id="totals" style="margin-top:12px; display:none">
    <p class="caption">Total sleep</p>
    <div class="total" id="total-mins">—</div>
    <div class="range" id="range-text">—</div>
    <div class="tot-grid">
      <div class="tot"><div class="lbl"><span class="dot dot-deep"></span>Deep</div>
                       <div class="val"><span id="deep-h">—</span><span class="unit">h</span><span id="deep-m">—</span><span class="unit">m</span></div></div>
      <div class="tot"><div class="lbl"><span class="dot dot-light"></span>Light</div>
                       <div class="val"><span id="light-h">—</span><span class="unit">h</span><span id="light-m">—</span><span class="unit">m</span></div></div>
      <div class="tot"><div class="lbl"><span class="dot dot-rem"></span>REM</div>
                       <div class="val"><span id="rem-h">—</span><span class="unit">h</span><span id="rem-m">—</span><span class="unit">m</span></div></div>
    </div>
    <div class="tot-grid" style="margin-top:0">
      <div class="tot"><div class="lbl"><span class="dot dot-awake"></span>Awake</div>
                       <div class="val"><span id="awake-m">—</span><span class="unit">m</span></div></div>
    </div>
  </div>

  <p class="caption" style="margin-top:24px">
    The system describes; it doesn't judge. No score here — the breakdown is the data.
  </p>
</main>

<div id="nav-mount"></div>
<script src="/health/v2/lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('today');

async function load() {
  try {
    // Pull sleep_stage + sleep_session over the last ~36h via the metric
    // filter — otherwise live HR/SpO2/HRV rows crowd sleep out of any
    // un-filtered limit window.
    const since = new Date(Date.now() - 36 * 3600 * 1000).toISOString();
    const q = `/ring/samples?metric=sleep_stage,sleep_session&limit=2000&since=${encodeURIComponent(since)}`;
    const { samples } = await api(q);
    const stages   = (samples || []).filter(s => s.metric === 'sleep_stage');
    const sessions = (samples || []).filter(s => s.metric === 'sleep_session');
    const totals = renderHypnogram(
      document.getElementById('hypnogram-card'), stages, sessions);
    if (totals && totals.total > 0) renderTotals(totals);
  } catch (e) {
    document.getElementById('hypnogram-card').innerHTML =
      `<div class="empty">Couldn't load: ${e.message}</div>`;
  }
}
load();
onResume(load);

function hm(m) {
  const h = Math.floor(m / 60);
  const r = Math.round(m % 60);
  return [h, r];
}

function renderTotals(t) {
  document.getElementById('totals').style.display = 'block';
  const [th, tm] = hm(t.total);
  document.getElementById('total-mins').innerHTML =
    `${th}<span class="unit">h</span> ${tm}<span class="unit">m</span>`;
  document.getElementById('range-text').textContent =
    new Date(t.startTs).toLocaleTimeString('en-AU', { hour:'numeric', minute:'2-digit' }) +
    ' → ' +
    new Date(t.endTs).toLocaleTimeString('en-AU', { hour:'numeric', minute:'2-digit' });
  const set = (id, v) => document.getElementById(id).textContent = v;
  const [dh, dm] = hm(t.deep);  set('deep-h', dh); set('deep-m', dm);
  const [lh, lm] = hm(t.light); set('light-h', lh); set('light-m', lm);
  const [rh, rm] = hm(t.rem);   set('rem-h', rh);  set('rem-m', rm);
  set('awake-m', Math.round(t.awake));
}
</script>
</body>
</html>

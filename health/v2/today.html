<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6F0" />
<link rel="manifest" href="/health/manifest-health.json" />
<link rel="apple-touch-icon" href="/health/icon-192.png" />
<title>Today · Neeve</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,50;9..144,500,50;9..144,600,50&family=Inter+Tight:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">
<style>
.greeting-time { color: var(--ink-mute); font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: 14px; margin-bottom: 4px; }
.greeting { font-family: 'Fraunces', serif; font-weight: 500; font-size: 36px; line-height: 1.1; letter-spacing: -0.5px; color: var(--ink); margin-bottom: 28px; }
.greeting em { font-style: italic; color: var(--terra); }

/* Check-in prompt card (prototype style) */
.prompt { background: var(--cream); border: 1px solid var(--hair); border-radius: 22px; padding: 24px; margin-bottom: 24px; }
.prompt .lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--terra); font-weight: 500; margin-bottom: 8px; }
.prompt .title2 { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; color: var(--ink); margin-bottom: 6px; line-height: 1.25; }
.prompt .sub { font-size: 14px; color: var(--ink-soft); margin-bottom: 18px; }
.prompt .actions { display: flex; gap: 10px; }
.prompt .actions .btn { padding: 12px 22px; }
.prompt .est { float: right; font-size: 12px; color: var(--ink-mute); margin-top: 2px; }

/* Ring status + tiles */
.ring-card { background: white; border: 1px solid var(--hair); border-radius: 20px; padding: 20px; margin-bottom: 24px; }
.ring-status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.ring-status .name { font-family: 'Fraunces', serif; font-size: 18px; color: var(--ink); font-weight: 500; }
.ring-status .conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
.ring-status .dot { width: 8px; height: 8px; border-radius: 50%; }
.ring-status .dot-on  { background: var(--sage-deep); }
.ring-status .dot-off { background: var(--ink-mute); }

.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric-tile { background: var(--cream); border-radius: 12px; padding: 14px; }
.metric-tile .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mute); font-weight: 500; margin-bottom: 4px; }
.metric-tile .val { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; color: var(--ink); line-height: 1; }
.metric-tile .unit { font-family: 'Inter Tight', sans-serif; font-size: 12px; color: var(--ink-mute); margin-left: 4px; }
.metric-tile .ago { font-size: 11px; color: var(--ink-mute); margin-top: 4px; }

.ring-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.ring-actions .btn { font-size: 13px; padding: 8px 14px; flex: 1 1 auto; min-width: 0; }

/* This week — recent days (prototype style) */
.section-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mute); font-weight: 500; margin-bottom: 10px; }
.recent-day { background: white; border: 1px solid var(--hair); border-radius: 16px; padding: 16px; margin-bottom: 10px; display: flex; gap: 14px; }
.recent-day .when-col { flex-shrink: 0; text-align: center; }
.recent-day .date { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; color: var(--ink); line-height: 1; }
.recent-day .month { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-mute); margin-top: 2px; }
.recent-day .content { flex: 1; min-width: 0; }
.recent-day .summary { font-size: 14px; color: var(--ink); line-height: 1.5; }
.recent-day .summary em { font-style: normal; font-weight: 600; color: var(--terra); }
.recent-day .note { font-size: 13px; color: var(--ink-soft); margin-top: 6px; font-style: italic; }
</style>
</head>
<body>

<main class="page">
  <p class="greeting-time" id="greeting-time">Today</p>
  <h1 class="greeting" id="greeting">Hey.</h1>

  <!-- Check-in prompt (prototype-style). renderCheckinPrompt rewrites
       the contents based on state + time-of-day; hides when outside
       the check-in window AND nothing logged. -->
  <div class="prompt" id="prompt-card" style="display:none"></div>

  <!-- Quick log — always available, regardless of slot timing.
       Drops one row in `notes` with mood + optional body; Alys
       replies if the user typed something. -->
  <section class="card" id="quicklog-card" style="margin-bottom:22px">
    <p class="lbl" style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:500;margin-bottom:8px">
      Log a note
    </p>
    <div style="font-family:'Fraunces',serif;font-size:18px;color:var(--ink);margin-bottom:10px;line-height:1.35">
      How are you, right now?
    </div>
    <div id="ql-moods" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="pill" data-mood="good"   onclick="selectMood('good')">Good</button>
      <button class="pill" data-mood="ok"     onclick="selectMood('ok')">Ok</button>
      <button class="pill" data-mood="rough"  onclick="selectMood('rough')">Rough</button>
      <button class="pill" data-mood="bad"    onclick="selectMood('bad')">Bad</button>
    </div>
    <textarea id="ql-text" rows="2" placeholder="Anything you want to add (optional)"
      style="width:100%;box-sizing:border-box;background:white;border:1px solid var(--hair);border-radius:12px;padding:10px 12px;font-family:'Inter Tight',sans-serif;font-size:16px;color:var(--ink);resize:vertical;margin-bottom:8px"></textarea>
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:10px">
      <span id="ql-status" class="caption" style="flex:1;min-height:18px"></span>
      <button class="btn btn-primary" id="ql-submit" onclick="submitQuickLog()" disabled>Log it</button>
    </div>
  </section>

  <!-- Ring status + live data -->
  <div class="ring-card" id="ring-card">
    <div class="empty">Loading ring…</div>
  </div>

  <!-- Last night sleep (only renders if there's data) -->
  <section class="section" id="sleep-section" style="display:none">
    <div class="section-head">
      <div class="section-label">Last night</div>
      <a class="section-link" href="/health/v2/sleep.html">See detail →</a>
    </div>
    <div class="card">
      <div id="sleep-hypno"></div>
      <div id="sleep-totals" style="display:flex; justify-content:space-around; margin-top:8px; padding-top:12px; border-top:1px solid var(--hair)"></div>
    </div>
  </section>

  <!-- This week -->
  <section class="section">
    <div class="section-label">Your week so far</div>
    <div id="week">
      <div class="empty">Loading…</div>
    </div>
  </section>
</main>

<div id="nav-mount"></div>

<script src="/health/v2/lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('today');

document.getElementById('greeting-time').textContent =
  new Date().toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });

// Route fresh users to the welcome flow before showing the home
// screen. Runs once on load — once onboarded=true, /me returns it
// and we never bounce again.
(async function gateUnonboarded() {
  try {
    const u = await api('/me');
    if (u && u.id && !u.onboarded) {
      location.replace('/health/v2/welcome.html');
    }
  } catch (_) { /* unauth bounces to login elsewhere */ }
})();

async function load() {
  const name = localStorage.getItem('neeve_name') || '';
  document.getElementById('greeting').innerHTML =
    name ? `Hey <em>${escapeHtml(name)}</em>.` : 'Hey.';

  let devices = [], samples = [], sleepSamples = [], checkins = [];
  try {
    // Sleep is pulled SEPARATELY with a metric filter — otherwise live HR /
    // SpO2 / HRV uploads quickly crowd sleep_stage out of the latest-300 window.
    // since=36h covers last night even after a late-evening reload.
    const since = new Date(Date.now() - 36 * 3600 * 1000).toISOString();
    const sleepQ = `/ring/samples?metric=sleep_stage,sleep_session&limit=1000&since=${encodeURIComponent(since)}`;
    const [ringStatus, ringSamples, sleepRes] = await Promise.all([
      api('/ring/status').catch(() => ({ devices: [] })),
      api('/ring/samples?limit=300').catch(() => ({ samples: [] })),
      api(sleepQ).catch(() => ({ samples: [] })),
    ]);
    devices      = ringStatus.devices || [];
    samples      = ringSamples.samples || [];
    sleepSamples = sleepRes.samples || [];
  } catch (e) { console.error(e); }

  let user = null;
  try {
    const [c, u] = await Promise.all([
      api('/me/checkins?days=7').catch(() => ({ checkins: [] })),
      api('/me').catch(() => null),
    ]);
    checkins = c.checkins || [];
    user = u;
  } catch (e) {}

  renderRingCard(devices[0], samples);
  renderWeek(checkins);
  renderSleepPreview(sleepSamples);
  renderCheckinPrompt(checkins, user);
}

// Render the prompt card based on today's check-in state AND the
// user's scheduled times. Card states:
//   - just-completed slot → summary + Edit (shown for 4h after the slot time)
//   - inside window of pending slot → CTA
//   - outside window      → hide (don't pester — quick-log is always there)
function renderCheckinPrompt(checkins, user) {
  const card = document.getElementById('prompt-card');
  if (!card) return;
  card.style.display = 'none';

  const now    = new Date();
  const today  = now.toDateString();
  const morningMins = parseTime(user?.morningTime || '08:00');
  const eveningMins = parseTime(user?.eveningTime || '19:00');
  const nowMins     = now.getHours() * 60 + now.getMinutes();

  // A slot is in-window if we're within [scheduled-60min, scheduled+240min].
  const inWindow = (mins) => nowMins >= mins - 60 && nowMins <= mins + 240;

  const todayCheckins = (checkins || []).filter(c =>
    new Date(c.completed_at || c.completedAt || c.day).toDateString() === today);
  const morningDone = todayCheckins.find(c => c.slot === 'morning');
  const eveningDone = todayCheckins.find(c => c.slot === 'evening');

  // Pick which slot to focus on: pending one whose window we're in,
  // or just-completed one (summary card) if we're still inside its
  // window. Otherwise hide.
  let focus = null;     // { slot, done }
  if (inWindow(morningMins)) {
    focus = { slot: 'morning', done: morningDone };
  } else if (inWindow(eveningMins)) {
    focus = { slot: 'evening', done: eveningDone };
  } else if (nowMins < morningMins && morningDone == null) {
    // Pre-morning, nothing logged — quiet
  } else {
    // Outside any window — pick the most recently completed slot if
    // it just finished (so the user can still tap into the summary).
    if (eveningDone && nowMins >= eveningMins) focus = { slot: 'evening', done: eveningDone };
    else if (morningDone && nowMins >= morningMins) focus = { slot: 'morning', done: morningDone };
  }
  if (!focus) return;

  card.style.display = '';
  const slotLabel = focus.slot === 'morning' ? 'Morning' : 'Evening';
  if (focus.done) {
    const checkinId = focus.done.checkin_id || focus.done.id;
    const answers   = focus.done.answers || {};
    const summary   = summariseAnswers(answers);
    card.innerHTML = `
      <div class="lbl">${slotLabel} check-in <span class="est">logged</span></div>
      <div class="title2">${summary.headline}</div>
      ${summary.lines.length ? `<div class="sub">${summary.lines.join(' · ')}</div>` : ''}
      <div class="actions">
        <a class="btn btn-ghost" href="/health/v2/checkin.html?checkin=${encodeURIComponent(checkinId)}">Edit answers</a>
      </div>`;
    return;
  }

  const title = focus.slot === 'morning'
    ? 'A few quick things to start your day.'
    : 'A few quick things before the day ends.';
  card.innerHTML = `
    <div class="lbl">Your ${slotLabel.toLowerCase()} check-in <span class="est">~2 min</span></div>
    <div class="title2">${title}</div>
    <div class="sub">Helps the system see how today's going.</div>
    <div class="actions">
      <a class="btn btn-primary" href="/health/v2/checkin.html">Start check-in</a>
      <button class="btn btn-ghost" onclick="document.querySelector('.prompt').style.display='none'">Not today</button>
    </div>`;
}

function parseTime(s) {
  if (!s || typeof s !== 'string') return 8 * 60;
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return 8 * 60;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}

// ── Quick log ───────────────────────────────────────────
let _qlMood = null;
function selectMood(m) {
  _qlMood = m;
  document.querySelectorAll('#ql-moods .pill').forEach(b => {
    b.classList.toggle('pill-rose', b.dataset.mood === m);
  });
  document.getElementById('ql-submit').disabled = false;
}
async function submitQuickLog() {
  if (!_qlMood) return;
  const status = document.getElementById('ql-status');
  const btn    = document.getElementById('ql-submit');
  const text   = document.getElementById('ql-text').value.trim();
  status.textContent = 'Logging…';
  status.style.color = 'var(--ink-mute)';
  btn.disabled = true;
  try {
    const r = await api('/me/note', {
      method: 'POST',
      body: JSON.stringify({ mood: _qlMood, body: text }),
    });
    status.textContent = r?.note?.alys_reply
      ? r.note.alys_reply.slice(0, 80) + (r.note.alys_reply.length > 80 ? '…' : '')
      : 'Logged.';
    status.style.color = 'var(--ink-soft)';
    // Reset
    document.getElementById('ql-text').value = '';
    _qlMood = null;
    document.querySelectorAll('#ql-moods .pill').forEach(b => b.classList.remove('pill-rose'));
  } catch (e) {
    status.textContent = `Couldn't log: ${e.message}`;
    status.style.color = 'var(--rose-deep)';
    btn.disabled = false;
  }
}

// Pluck the most-recognisable scaled keys for the summary line so the
// user sees what they logged at a glance. Falls back to a generic
// 'Logged at HH:mm' if no familiar keys are present.
function summariseAnswers(a) {
  const pairs = [];
  const score = (k, label) => {
    const v = a[k];
    if (v == null || v === '') return;
    pairs.push(`${label} ${v}`);
  };
  score('sleep',    'sleep');
  score('fatigue',  'fatigue');
  score('fog',      'fog');
  score('mood',     'mood');
  score('anxiety',  'anxiety');
  score('energy',   'energy');
  score('pain',     'pain');
  score('headache', 'headache');
  const headline = pairs.length
    ? 'Logged: ' + pairs.slice(0, 3).join(', ')
    : 'Logged a moment ago.';
  return { headline, lines: pairs.slice(3, 7) };
}

load();
// Refresh every 90s while the page is visible — ring data updates on
// 2-min cycles anyway, so polling faster just burns battery without
// surfacing new readings. Pause when hidden; resume on visibility.
let _refreshTimer = null;
function _startRefresh() {
  if (_refreshTimer) return;
  _refreshTimer = setInterval(load, 90000);
}
function _stopRefresh() {
  if (_refreshTimer) { clearInterval(_refreshTimer); _refreshTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) _stopRefresh(); else { load(); _startRefresh(); }
});
if (!document.hidden) _startRefresh();
onResume(load);

function renderSleepPreview(samples) {
  const stages   = (samples || []).filter(s => s.metric === 'sleep_stage');
  const sessions = (samples || []).filter(s => s.metric === 'sleep_session');
  if (!stages.length && !sessions.length) return;
  document.getElementById('sleep-section').style.display = 'block';
  const totals = renderHypnogram(
    document.getElementById('sleep-hypno'), stages, sessions);
  if (!totals) return;
  const m = mins => `${Math.floor(mins/60)}h ${Math.round(mins%60)}m`;
  document.getElementById('sleep-totals').innerHTML = `
    <div style="text-align:center"><div class="caption">Deep</div><div style="font-family:'Fraunces',serif; font-weight:500">${m(totals.deep)}</div></div>
    <div style="text-align:center"><div class="caption">Light</div><div style="font-family:'Fraunces',serif; font-weight:500">${m(totals.light)}</div></div>
    <div style="text-align:center"><div class="caption">REM</div><div style="font-family:'Fraunces',serif; font-weight:500">${m(totals.rem)}</div></div>
  `;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderRingCard(device, samples) {
  const el = document.getElementById('ring-card');
  if (!device) {
    el.innerHTML = `
      <div class="ring-status">
        <span class="name">No ring paired</span>
        <span class="conn"><span class="dot dot-off"></span>Not connected</span>
      </div>
      <p class="caption">Open the Ring tab to pair a ring. Heart rate, blood oxygen, steps and sleep will show here once it's connected.</p>`;
    return;
  }
  const latest = latestPerMetric(samples);
  const tiles = [];
  const t = (m, label) => {
    const s = latest[m]; if (!s) return;
    let valHtml = `<span>${formatValue(m, s.value)}</span><span class="unit">${metricUnit(m, s.unit)}</span>`;
    if (m === 'bp_sys' && latest.bp_dia) {
      valHtml = `<span>${Math.round(s.value)}/${Math.round(latest.bp_dia.value)}</span><span class="unit">mmHg</span>`;
    }
    // Special-case BP — open the combined sys+dia detail rather than just sys.
    const detailMetric = (m === 'bp_sys' || m === 'bp_dia') ? 'bp' : m;
    const detailUrl = `/health/v2/metric.html?metric=${encodeURIComponent(detailMetric)}&days=7`;
    tiles.push(`
      <a class="metric-tile-link" href="${detailUrl}" style="text-decoration:none;color:inherit;display:block">
        <div class="metric-tile">
          <div class="lbl">${label}</div>
          <div class="val">${valHtml}</div>
          <div class="ago">${formatAgo(s.ts)}</div>
        </div>
      </a>`);
  };
  t('hr',                'Heart rate');
  t('spo2',              'Blood oxygen');
  t('steps',             'Steps today');
  t('hrv_rmssd',         'HRV');
  t('respiration_rate',  'Respiration');
  t('bp_sys',            'Blood pressure');
  t('temp_skin',         'Skin temp');
  t('temp_delta',        'Skin temp Δ');
  t('stress',            'Stress');
  t('vo2max',            'VO₂ max');
  t('glucose',           'Glucose');

  const connOn = device.last_seen_at && (Date.now() - new Date(device.last_seen_at)) < 10 * 60 * 1000;
  el.innerHTML = `
    <div class="ring-status">
      <span class="name">${escapeHtml(device.name || 'Ring')}</span>
      <span class="conn">
        <span class="dot ${connOn ? 'dot-on' : 'dot-off'}"></span>
        ${connOn ? 'Connected' : 'Last seen ' + formatAgo(device.last_seen_at)}
      </span>
    </div>
    ${tiles.length
       ? `<div class="metric-grid">${tiles.join('')}</div>`
       : `<p class="caption">No readings yet. Open the Ring tab to take a measurement.</p>`}`;
}

function renderWeek(checkins) {
  const el = document.getElementById('week');
  if (!checkins.length) {
    el.innerHTML = `<div class="empty" style="padding:20px 0">
      Do a couple more check-ins and they'll show up here.
    </div>`;
    return;
  }
  el.innerHTML = checkins.slice(0, 7).map(c => {
    const dt = new Date(c.completed_at || c.started_at || c.created_at);
    const summary = buildSummary(c);
    return `
      <div class="recent-day">
        <div class="when-col">
          <div class="date">${dt.getDate()}</div>
          <div class="month">${dt.toLocaleDateString('en-AU', {weekday: 'short'})}</div>
        </div>
        <div class="content">
          <div class="summary">${summary || '<em>Logged</em>'}</div>
          ${c.note ? `<div class="note">${escapeHtml(c.note)}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

// Build a one-line summary from check-in answers — uses whichever keys
// are populated. Shape varies; defensive.
function buildSummary(c) {
  const a = c.answers || {};
  const parts = [];
  if (a.sleep)    parts.push(`Slept <em>${a.sleep}h</em>`);
  if (a.anxiety)  parts.push(`anxiety <em>${a.anxiety}</em>`);
  if (a.fatigue)  parts.push(`fatigue <em>${a.fatigue}</em>`);
  if (a.mood)     parts.push(`mood <em>${a.mood}</em>`);
  if (a.fog)      parts.push(`fog <em>${a.fog}</em>`);
  return parts.join(', ') + (parts.length ? '.' : '');
}

function callNative(method, args = {}) {
  // Flutter webview_flutter registers channels as window.<channelName> with
  // postMessage(stringPayload). Don't use window.webkit.messageHandlers —
  // that's raw WKWebView and Flutter doesn't surface channels there.
  if (window.neeve?.postMessage) {
    window.neeve.postMessage(JSON.stringify({ method, args }));
  } else {
    alert('That action only works in the Neeve app.');
  }
}
</script>
</body>
</html>

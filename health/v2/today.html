<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f3ead9" />
<link rel="manifest" href="/health/manifest-health.json" />
<link rel="apple-touch-icon" href="/health/icon-192.png" />
<title>Today · Neeve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/health/v2/styles.css">
<style>
  :root{
    --paper:#f3ead9; --card:#fcf8f1; --ink:#3f3128; --ink-soft:#7c6759;
    --muted:#a08a78; --clay:#bb6147; --clay-deep:#a3472f; --sage:#8d8a6a; --hair:#eaddc9;
  }
  body{font-family:"Hanken Grotesk",system-ui,sans-serif;background:var(--paper);background-attachment:fixed;color:var(--ink);}
  .page{max-width:412px;margin:0 auto;
    padding:calc(max(env(safe-area-inset-top,0px), 58px) + 4px) 18px calc(120px + env(safe-area-inset-bottom));}

  /* header */
  .top{display:flex;align-items:center;gap:12px;margin:4px 4px 18px;}
  .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(150deg,#e0a07e,#bb6147);color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-weight:600;font-size:19px;}
  .top .who{flex:1;}
  .top .who .h{font-family:"Fraunces",serif;font-weight:500;font-size:19px;color:var(--ink);line-height:1.1;}
  .top .who .d{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .top .more{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--hair);
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);text-decoration:none;font-size:18px;}

  /* hero card — colour shifts with readiness */
  .hero{position:relative;border-radius:28px;overflow:hidden;isolation:isolate;box-shadow:0 16px 38px rgba(150,100,70,.2);}
  .sky{position:absolute;inset:0;z-index:-2;opacity:0;transition:opacity 1s ease;}
  .s-tender{background:linear-gradient(150deg,#e7d4d6 0%,#d3b8be 100%);}
  .s-quiet {background:linear-gradient(150deg,#efddc8 0%,#ddc3aa 100%);}
  .s-steady{background:linear-gradient(150deg,#f8e1c0 0%,#edc096 100%);}
  .s-open  {background:linear-gradient(150deg,#fdeaca 0%,#f3cb97 100%);}
  .s-strong{background:linear-gradient(150deg,#ffeec9 0%,#f7cd8c 100%);}
  .hero[data-mood=tender] .s-tender,.hero[data-mood=quiet] .s-quiet,.hero[data-mood=steady] .s-steady,
  .hero[data-mood=open] .s-open,.hero[data-mood=strong] .s-strong{opacity:1;}
  .orb{position:absolute;z-index:-1;width:190px;height:190px;right:-30px;top:-40px;border-radius:50%;filter:blur(6px);
    background:radial-gradient(circle,rgba(255,250,240,.85),rgba(255,240,220,.2) 50%,transparent 72%);animation:breathe 9s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.1);opacity:1}}
  .hfg{position:relative;padding:24px 24px 26px;color:#41271d;}
  .hfg .wx{display:inline-flex;align-items:center;gap:6px;background:rgba(255,250,243,.5);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.4);padding:7px 13px;border-radius:30px;font-size:13px;font-weight:500;color:#5c3a2b;}
  .hfg .wx b{color:#41271d;font-weight:600;}
  .hfg .day{font-family:"Fraunces",serif;font-weight:500;font-size:42px;line-height:1.05;letter-spacing:-.01em;margin-top:18px;transition:opacity .4s;}
  .hfg .why{font-size:16.5px;line-height:1.5;margin-top:12px;max-width:30ch;color:#56372a;transition:opacity .4s;}
  .hfg .see{margin-top:18px;font-size:13.5px;font-weight:600;color:#7a4a35;text-decoration:none;display:inline-flex;gap:5px;}

  /* week strip — each day coloured by its readiness */
  .week{display:flex;gap:7px;margin:16px 1px 4px;}
  .wd{flex:1;border-radius:16px;padding:10px 2px 9px;text-align:center;background:var(--card);border:1px solid var(--hair);}
  .wd .wlab{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .wd .wnum{font-family:"Fraunces",serif;font-weight:500;font-size:16px;color:var(--ink);margin-top:4px;}
  .wd.m-tender{background:#e7d4d6;border-color:#dcc4c8;}
  .wd.m-quiet {background:#efddc8;border-color:#e4cdb4;}
  .wd.m-steady{background:#f8e1c0;border-color:#eed1aa;}
  .wd.m-open  {background:#fdeaca;border-color:#f3d9af;}
  .wd.m-strong{background:#ffeec9;border-color:#f6dca6;}
  .wd.today{box-shadow:0 0 0 2px var(--ink);}
  .wd.today .wnum{font-weight:600;}

  /* sections */
  .sec{font-family:"Fraunces",serif;font-weight:500;font-size:21px;color:var(--ink);margin:24px 2px 12px;}
  .glance{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:22px;padding:16px 6px;box-shadow:0 8px 24px rgba(120,90,60,.06);}
  .gstat{text-align:center;text-decoration:none;color:inherit;padding:2px 4px;}
  .gstat + .gstat{border-left:1px solid var(--hair);}
  .gstat .l{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .gstat .v{font-family:"Fraunces",serif;font-weight:500;font-size:22px;margin-top:7px;color:var(--ink);line-height:1;}
  .gstat .v small{font-size:11px;color:var(--muted);font-weight:400;}

  .ncard{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:20px;padding:15px 18px;
    box-shadow:0 8px 24px rgba(120,90,60,.06);text-decoration:none;color:inherit;margin-top:10px;}
  .ncard .ic{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;}
  .ncard.checkin .ic{background:var(--clay);}
  .ncard.noticed .ic{background:var(--sage);}
  .ncard .t{font-family:"Fraunces",serif;font-weight:500;font-size:16.5px;color:var(--ink);}
  .ncard .s{font-size:13px;color:var(--muted);margin-top:2px;}
  .ncard .go{margin-left:auto;color:var(--muted);font-size:20px;}

  .alys{display:flex;gap:13px;background:linear-gradient(150deg,#f7ede1,#f3e3d3);border-radius:22px;padding:18px 20px;align-items:flex-start;}
  .alys .ic{width:34px;height:34px;border-radius:50%;flex:none;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--clay);font-size:16px;box-shadow:0 4px 12px rgba(150,100,70,.12);}
  .alys p{font-family:"Fraunces",serif;font-style:italic;font-weight:500;font-size:16.5px;line-height:1.45;color:var(--ink-soft);}

  .note{margin-top:14px;border:1.5px dashed #d8c6ad;border-radius:22px;padding:16px 20px;width:100%;text-align:left;
    display:flex;align-items:flex-start;gap:13px;cursor:pointer;background:rgba(252,248,241,.4);}
  .note .plus{width:25px;height:25px;border-radius:50%;background:var(--clay);color:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;margin-top:1px;}
  .note p{font-family:"Fraunces",serif;font-style:italic;font-weight:500;font-size:16.5px;line-height:1.35;color:var(--ink-soft);}

  /* quick-log sheet */
  .ql-backdrop{position:fixed;inset:0;background:rgba(43,34,28,.45);z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .ql-backdrop.open{opacity:1;pointer-events:auto;}
  .ql-sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:var(--card);border-radius:22px 22px 0 0;
    padding:18px 20px max(22px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease;max-height:88vh;overflow-y:auto;max-width:460px;margin:0 auto;}
  .ql-sheet.open{transform:translateY(0);box-shadow:0 -10px 30px rgba(43,34,28,.18);}
  .ql-grip{width:36px;height:4px;background:var(--hair);border-radius:2px;margin:0 auto 12px;}
  .ql-sheet h2{font-family:"Fraunces",serif;font-weight:500;font-size:21px;color:var(--ink);margin:0 0 4px;}
  .ql-sheet .sub{font-size:13.5px;color:var(--muted);margin-bottom:14px;line-height:1.45;}
  .ql-sheet textarea{width:100%;min-height:96px;border:1px solid var(--hair);border-radius:14px;padding:12px;font-family:inherit;font-size:15px;color:var(--ink);background:#fffdf9;resize:vertical;}
  .ql-cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 6px;}
  .ql-row{display:flex;flex-wrap:wrap;gap:6px;}
  .ql-chip{font-family:inherit;font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:15px;border:1px solid var(--hair);background:#fcf8f1;color:var(--muted);cursor:pointer;}
  .ql-chip.on{background:var(--ink);color:#f6ecdd;border-color:var(--ink);}
  .ql-actions{display:flex;align-items:center;gap:10px;margin-top:16px;}
  .ql-status{font-size:13px;color:var(--muted);flex:1;}
  .btn{padding:10px 18px;border-radius:99px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--hair);background:#fff;color:var(--ink);}
  .btn-primary{background:var(--ink);color:#f6ecdd;border-color:var(--ink);}
  .btn-primary:disabled{opacity:.45;}
</style>
</head>
<body>
<main class="page">

  <div class="top">
    <div class="av" id="av">P</div>
    <div class="who">
      <div class="h" id="hello">Hello</div>
      <div class="d" id="date">Today</div>
    </div>
    <a class="more" href="/health/v2/more.html" aria-label="More">⋯</a>
  </div>

  <div class="hero" id="hero" data-mood="steady">
    <div class="sky s-tender"></div><div class="sky s-quiet"></div><div class="sky s-steady"></div>
    <div class="sky s-open"></div><div class="sky s-strong"></div>
    <div class="orb"></div>
    <div class="hfg">
      <div class="wx"><span id="wx-clock">—</span>&nbsp;·&nbsp;<b id="wx-temp">—</b>&nbsp;<span id="wx-cond"></span></div>
      <div class="day" id="day">Reading your day…</div>
      <div class="why" id="why"></div>
      <a class="see" href="/health/v2/ring.html">see your data →</a>
    </div>
  </div>

  <div class="week" id="week"></div>

  <div class="sec">Today</div>
  <div class="glance" id="glance">
    <a class="gstat" href="/health/v2/metric.html?metric=hr&days=1"><div class="l">HR</div><div class="v" id="g-hr">—</div></a>
    <a class="gstat" href="/health/v2/metric.html?metric=hrv_rmssd&days=1"><div class="l">HRV</div><div class="v" id="g-hrv">—</div></a>
    <a class="gstat" href="/health/v2/metric.html?metric=spo2&days=1"><div class="l">O₂</div><div class="v" id="g-o2">—</div></a>
    <a class="gstat" href="/health/v2/sleep.html"><div class="l">Sleep</div><div class="v" id="g-sleep">—</div></a>
  </div>
  <div id="next"></div>

  <div id="alys-wrap" style="display:none">
    <div class="sec">From Alys</div>
    <div class="alys"><div class="ic">✦</div><p id="alys-text"></p></div>
  </div>

  <button class="note" type="button" onclick="openLogSheet()">
    <span class="plus">+</span>
    <p>Note something — a thought, a symptom, a moment.</p>
  </button>
</main>

<!-- Quick-log sheet -->
<div class="ql-backdrop" id="ql-backdrop" onclick="closeLogSheet()"></div>
<div class="ql-sheet" id="ql-sheet" role="dialog" aria-modal="true">
  <div class="ql-grip"></div>
  <h2>What's on your mind?</h2>
  <div class="sub">Anything you want noted. Alys reads it; past you might thank you.</div>
  <textarea id="ql-body" placeholder="A symptom, an appointment, something that helped, a thought to remember…"></textarea>
  <div class="ql-cap">Tag it (optional)</div>
  <div class="ql-row" id="ql-kinds">
    <button class="ql-chip" data-kind="symptom"     onclick="selectKind('symptom')">Symptom</button>
    <button class="ql-chip" data-kind="appointment" onclick="selectKind('appointment')">Appointment</button>
    <button class="ql-chip" data-kind="medication"  onclick="selectKind('medication')">Medication</button>
    <button class="ql-chip" data-kind="trigger"     onclick="selectKind('trigger')">Trigger</button>
    <button class="ql-chip" data-kind="event"       onclick="selectKind('event')">Event</button>
    <button class="ql-chip" data-kind="thought"     onclick="selectKind('thought')">Thought</button>
  </div>
  <div class="ql-actions">
    <span class="ql-status" id="ql-status"></span>
    <button class="btn" onclick="closeLogSheet()">Cancel</button>
    <button class="btn btn-primary" id="ql-submit" onclick="submitQuickLog()" disabled>Log it</button>
  </div>
</div>

<div id="nav-mount"></div>
<script src="/health/v2/lib.js"></script>
<script>
document.getElementById('nav-mount').innerHTML = renderNav('today');
(async function gate(){ try{ const u=await api('/me'); if(u&&u.id&&!u.onboarded) location.replace('/health/v2/welcome.html'); }catch(_){} })();

const DAY_FALLBACK={tender:'A tender day.',quiet:'A quiet day.',steady:'A steady day.',open:'An open day.',strong:'A strong day.'};
const STATE_BY_ORD={1:'tender',2:'quiet',3:'steady',4:'open',5:'strong'};
function greet(h){return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}
function wmo(c){if(c==null)return'';if(c===0)return'clear';if(c<=2)return'mostly clear';if(c===3)return'cloudy';if(c<=48)return'fog';if(c<=67)return'rain';if(c<=77)return'snow';if(c<=82)return'showers';if(c<=99)return'storms';return'';}
function fmtSleep(s){if(!s||s<=0)return'—';const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return `${h}<small>h</small>${m}<small>m</small>`;}

function renderWeek(samples){
  const byDay={};
  for(const s of (samples||[])){ const d=new Date(s.ts); const k=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; byDay[k]=Math.round(Number(s.value)); }
  const cells=[]; const now=new Date();
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(now.getDate()-i);
    const k=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const ord=byDay[k]; const state=ord?STATE_BY_ORD[ord]:null;
    cells.push(`<div class="wd ${state?('m-'+state):''} ${i===0?'today':''}"><div class="wlab">${d.toLocaleDateString('en-AU',{weekday:'short'})}</div><div class="wnum">${d.getDate()}</div></div>`);
  }
  document.getElementById('week').innerHTML=cells.join('');
}

async function load(){
  document.getElementById('wx-clock').textContent=new Date().toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}).toLowerCase();
  document.getElementById('date').textContent='Today, '+new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long'});
  const [me,t,flags,week,obs]=await Promise.all([
    api('/me').catch(()=>null),
    api('/me/today').catch(()=>null),
    api('/me/flagged-events?only_open=1&days=7').catch(()=>({events:[]})),
    api('/ring/trend?metric=readiness_state&days=7').catch(()=>({samples:[]})),
    api('/me/today-observation').catch(()=>null),
  ]);
  const name=me?.name?me.name.split(' ')[0]:'there';
  document.getElementById('av').textContent=(name[0]||'•').toUpperCase();
  document.getElementById('hello').textContent='Hello, '+name;

  // Notifications: the local check-in reminders only get scheduled when
  // the app is told to — and permission is only requested then. Trigger
  // it here so iOS actually asks + schedules at the user's real times
  // (no paid Apple account / app rebuild needed — local notifications).
  try{
    if(window.neeve?.postMessage && me){
      const mt=(me.morning_time||'07:30').slice(0,5), et=(me.evening_time||'20:00').slice(0,5);
      if(!localStorage.getItem('neeve_notif_setup')){
        window.neeve.postMessage(JSON.stringify({method:'enableNotifications', morningTime:mt, eveningTime:et}));
        localStorage.setItem('neeve_notif_setup','1');
      } else {
        window.neeve.postMessage(JSON.stringify({method:'updateReminderTimes', morningTime:mt, eveningTime:et}));
      }
    }
  }catch(_){}
  renderWeek(week.samples||[]);

  if(t){
    const state=t.state||'steady';
    document.getElementById('hero').dataset.mood=state;
    document.getElementById('day').textContent=t.day_word||DAY_FALLBACK[state]||'Today.';
    document.getElementById('why').textContent=t.why||'';
    if(t.weather){ document.getElementById('wx-temp').textContent=t.weather.temperature!=null?Math.round(t.weather.temperature)+'°':'—'; document.getElementById('wx-cond').textContent=wmo(t.weather.weather_code); }
    const i=t.inputs||{};
    document.getElementById('g-hr').innerHTML=(i.hr??'—')+'<small> bpm</small>';
    document.getElementById('g-hrv').innerHTML=(i.hrv??'—')+'<small> ms</small>';
    document.getElementById('g-o2').innerHTML=(i.spo2??'—')+'<small> %</small>';
    document.getElementById('g-sleep').innerHTML=fmtSleep(i.sleep_s);
    let next='';
    if(t.checkin&&t.checkin.due){ const slot=t.checkin.slot==='evening'?'Evening':'Morning';
      next+=`<a class="ncard checkin" href="/health/v2/checkin.html?slot=${t.checkin.slot}"><span class="ic">✎</span><div><div class="t">${slot} check-in</div><div class="s">a couple of minutes, when you're ready</div></div><span class="go">›</span></a>`; }
    const ev=(flags&&flags.events)||[];
    if(ev.length){ next+=`<a class="ncard noticed" href="/health/v2/today.html"><span class="ic">◔</span><div><div class="t">Noticed</div><div class="s">${ev.length} thing${ev.length>1?'s':''} worth a look</div></div><span class="go">›</span></a>`; }
    document.getElementById('next').innerHTML=next;
  }
  const line=obs&&(obs.text||obs.summary||obs.observation);
  if(line){ document.getElementById('alys-text').textContent=line; document.getElementById('alys-wrap').style.display='block'; }
}

// ── quick-log ──
let _qlKind=null;
function openLogSheet(){ document.getElementById('ql-backdrop').classList.add('open'); document.getElementById('ql-sheet').classList.add('open'); setTimeout(()=>document.getElementById('ql-body').focus(),200); }
function closeLogSheet(){ document.getElementById('ql-backdrop').classList.remove('open'); document.getElementById('ql-sheet').classList.remove('open'); }
function selectKind(k){ _qlKind=_qlKind===k?null:k; document.querySelectorAll('#ql-kinds .ql-chip').forEach(b=>b.classList.toggle('on',b.dataset.kind===_qlKind)); refreshQlSubmit(); }
function refreshQlSubmit(){ document.getElementById('ql-submit').disabled=!(document.getElementById('ql-body').value||'').trim(); }
document.getElementById('ql-body').addEventListener('input', refreshQlSubmit);
async function submitQuickLog(){
  const status=document.getElementById('ql-status'),btn=document.getElementById('ql-submit');
  const text=document.getElementById('ql-body').value.trim(); if(!text) return;
  status.textContent='Logging…'; btn.disabled=true;
  try{
    await api('/me/note',{method:'POST',body:JSON.stringify({kind:_qlKind,body:text})});
    status.textContent='Logged.'; document.getElementById('ql-body').value=''; _qlKind=null;
    document.querySelectorAll('.ql-chip').forEach(b=>b.classList.remove('on'));
    setTimeout(()=>{ closeLogSheet(); status.textContent=''; load(); }, 1000);
  }catch(e){ status.textContent=`Couldn't log: ${e.message}`; btn.disabled=false; }
}

load();
onResume(load);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
window.addEventListener('neeve:ring-tick', load);
</script>
</body>
</html>

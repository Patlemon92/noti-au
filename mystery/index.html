<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#161318" />
<title>The Reveal — Murder Mystery Party</title>
<style>
  :root {
    --bg:      #161318;
    --panel:   #201b26;
    --panel-2: #2a2431;
    --ink:     #f3ecdf;
    --muted:   #a99fb0;
    --gold:    #c8a24a;
    --gold-dim:#8a713a;
    --blood:   #a23b3b;
    --line:    rgba(200,162,74,.22);
    --radius:  18px;
    --serif:   Georgia, 'Times New Roman', serif;
    --sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(120% 80% at 50% -10%, #241d2b 0%, var(--bg) 55%) fixed;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  /* phone frame ---------------------------------------------------------- */
  .stage {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .screen {
    flex: 1;
    padding: 22px 20px 30px;
    display: flex;
    flex-direction: column;
    animation: fade .35s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: .01em; }
  .eyebrow {
    font-family: var(--sans); font-size: 11px; letter-spacing: .28em;
    text-transform: uppercase; color: var(--gold); font-weight: 700;
  }
  .muted { color: var(--muted); }
  .serif { font-family: var(--serif); }

  /* buttons -------------------------------------------------------------- */
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 15px 18px; border-radius: 14px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1c150a; font-weight: 800; font-size: 16px; letter-spacing: .02em;
    box-shadow: 0 8px 22px rgba(200,162,74,.22);
  }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); box-shadow: none; font-weight: 600;
  }
  .btn.blood {
    background: linear-gradient(180deg, #b84545 0%, #7c2727 100%);
    color: #fff; box-shadow: 0 8px 22px rgba(162,59,59,.28);
  }
  .btn:disabled { opacity: .4; }

  /* cards ---------------------------------------------------------------- */
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }
  .card + .card { margin-top: 12px; }

  /* avatars -------------------------------------------------------------- */
  .ava {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--serif); font-weight: 700; font-size: 17px; color: #fff;
    flex: 0 0 auto; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18);
  }
  .ava.lg { width: 66px; height: 66px; font-size: 26px; }

  /* device switcher (demo only) ----------------------------------------- */
  .switcher {
    position: sticky; top: 0; z-index: 20;
    background: rgba(18,15,21,.86); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px;
  }
  .switcher .lbl {
    font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--gold); font-weight: 700; margin: 0 2px 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
    padding: 6px 12px 6px 7px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid transparent;
    color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .chip .dot { width: 20px; height: 20px; border-radius: 50%; display:grid; place-items:center; font-size:11px; color:#fff; font-family:var(--serif); }
  .chip.host .dot { background: var(--gold); color:#1c150a; }
  .chip.on { color: var(--ink); border-color: var(--gold); background: #2f2836; }

  /* misc ----------------------------------------------------------------- */
  .rule { height: 1px; background: var(--line); margin: 16px 0; border: 0; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: rgba(200,162,74,.14); color: var(--gold); border: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 6px; margin: 4px 0 14px; }
  .tab {
    flex: 1; text-align: center; padding: 9px 4px; border-radius: 11px;
    background: var(--panel); border: 1px solid transparent; color: var(--muted);
    font-size: 12.5px; font-weight: 700; letter-spacing: .02em;
  }
  .tab.on { color: #1c150a; background: var(--gold); }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
  .list-row + .list-row { border-top: 1px solid var(--line); }
  .flush { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .spacer { flex: 1; }
  .footer-cta { padding-top: 14px; }
  .center { text-align: center; }
  .big-code {
    font-family: var(--serif); font-size: 46px; letter-spacing: .18em;
    color: var(--gold); font-weight: 700; text-align: center;
  }
  .fade-in-slow { animation: fade .6s ease; }
  .shimmer {
    background: linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 50%, var(--panel) 75%);
    background-size: 200% 100%; animation: sh 1.3s infinite;
    border-radius: 10px; height: 14px;
  }
  @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .action-box {
    background: linear-gradient(180deg, rgba(162,59,59,.16), rgba(162,59,59,.06));
    border: 1px solid rgba(162,59,59,.4); border-radius: 14px; padding: 14px 15px;
  }
  .reveal-box {
    background: linear-gradient(180deg, rgba(200,162,74,.12), rgba(200,162,74,.03));
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 15px;
  }
  .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; }
  .demo-note {
    font-size: 11.5px; color: var(--muted); text-align: center;
    padding: 10px 16px; border-top: 1px solid var(--line);
  }
  ul.clean { margin: 8px 0 0; padding-left: 18px; }
  ul.clean li { margin: 6px 0; }

  /* interactive documents ------------------------------------------------ */
  .scrim {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(8,6,10,.74); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 22px;
    animation: fade .18s ease;
  }
  .doc-close {
    position: fixed; top: 14px; right: 14px; z-index: 62;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.28); font-size: 18px;
  }
  .doc {
    width: 100%; max-width: 360px; max-height: 82vh; overflow: auto; border-radius: 7px;
    box-shadow: 0 26px 64px rgba(0,0,0,.6);
    animation: pop .34s cubic-bezier(.2,.9,.3,1.25) both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.86) translateY(12px) rotate(-1deg); } to { opacity: 1; transform: none; } }
  .doc-inner { padding: 24px 22px; }
  .doc .dt { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; opacity: .65; margin-bottom: 10px; }
  .doc .dh { font-size: 19px; margin-bottom: 13px; }
  .doc .db { font-size: 15px; line-height: 1.62; white-space: pre-line; }
  .doc .reveal-btn {
    margin-top: 18px; width: 100%; padding: 13px; border-radius: 10px; font-weight: 800; font-size: 14px;
    background: linear-gradient(180deg,#b84545,#7c2727); color: #fff; border: none;
  }
  .doc .revealed-tag { margin-top: 16px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #7c2727; }
  /* paper variants */
  .doc.note, .doc.document, .doc.paper { background: #efe7d3; color: #2a2117; }
  .doc.note .db, .doc.document .db { font-family: var(--serif); }
  .doc.letter { background: #f2ead8; color: #2a2117; }
  .doc.letter .db { font-family: var(--serif); font-style: italic; }
  .doc.letter.charred {
    background: linear-gradient(180deg,#ece0c4 0%,#d8c39c 78%,#7c623c 100%);
    box-shadow: 0 26px 64px rgba(0,0,0,.6), inset 0 -46px 42px -22px rgba(30,10,0,.55);
  }
  .doc.will { background: #f5efdb; color: #241d10; text-align: center; }
  .doc.will .db { font-family: var(--serif); }
  .doc.telegram { background: #e8e6dd; color: #20201a; }
  .doc.telegram .dt { color: #7c2727; }
  .doc.telegram .db { font-family: 'Courier New', monospace; text-transform: uppercase; letter-spacing: .03em; font-size: 13px; }
  .doc.ledger { background: #eceadf; color: #20201a; }
  .doc.ledger .db { font-family: 'Courier New', monospace; font-size: 13.5px; }
  .doc.object { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .doc.object .dh, .doc.object .db { }
  .doc.object .db { font-family: var(--serif); font-style: italic; }
  /* casebook cards */
  .clue-card {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer;
  }
  .clue-card + .clue-card { margin-top: 9px; }
  .clue-card:active { transform: translateY(1px); }
  .clue-ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 19px; background: var(--panel-2); flex: 0 0 auto; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: 0 0 auto; }
  .tab-badge {
    display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; margin-left: 5px;
    border-radius: 8px; background: var(--blood); color: #fff; font-size: 10px; font-weight: 800; line-height: 1;
  }
  .empty-note { font-size: 12.5px; color: var(--muted); padding: 4px 2px; }
</style>
</head>
<body>
  <div class="stage" id="stage"></div>
  <script src="mystery-data.js"></script>
  <script>
  // ===================================================================
  //  THE REVEAL — single-device prototype
  //  One data model (window.MYSTERY) drives every screen. The "switch
  //  phone" bar lets one person preview the host + all six dossiers.
  // ===================================================================

  const LIB = window.MYSTERIES;
  const TOTAL_ROUNDS = 3;
  const NAME_POOL = ["You", "Priya", "Marcus", "Tom", "Leah", "Sam", "Ada", "Jo", "Ravi", "Mia"];

  // Selected mystery + the cast that's live at the chosen player count.
  let M = LIB[0];
  let CHARS = [];               // set by syncCast()
  function syncCast() {
    CHARS = M.characters.filter((c) => c.minPlayers <= state.playerCount);
  }
  const playerNames = () => NAME_POOL.slice(0, state.playerCount);

  const state = {
    screen: "intro",   // intro · setup · preparing · lobby · game · reveal
    mysteryId: "blackwood",
    playerCount: 4,
    viewAs: "host",     // 'host' or a character id
    round: 1,           // 1..3, then voting
    phase: "round",     // round · voting · results
    tab: "who",         // dossier tab
    joined: 0,          // players shown in lobby
    myVote: null,       // the human's whodunit vote
    roundStartedAt: null, // ms timestamp for the elapsed timer
    code: "GHTK",
    // interactive layer
    found: {},          // charId -> Set(clueId) gathered by investigating
    opened: new Set(),  // `${charId}:${docId}` — for unread badges
    revealed: new Set(),// item ids revealed to the whole table (public)
    prime: {},          // charId -> suspectId (prime suspect, prefills the vote)
    doc: null,          // the document currently open in the overlay
  };

  const el = (id) => document.getElementById(id);
  const stage = el("stage");
  const charById = (id) => CHARS.find((c) => c.id === id);
  // short display name for question targets (searches the full cast, not just active)
  const nameOf = (id) => {
    const c = M.characters.find((x) => x.id === id);
    if (!c) return "them";
    const parts = c.name.split(" ");
    if (parts[0] === "Dr.") return "Dr. " + parts[parts.length - 1];   // Dr. Hart
    if (/^(Lady|Mr\.|Mrs\.|Miss)$/.test(parts[0])) return parts[1];     // Vivian, Cordelia…
    return parts[0];
  };

  // ---- interactive-layer helpers ----
  const KIND_ICON = { note: "📄", document: "📜", object: "🔎", letter: "✉️", will: "📜", telegram: "📨", ledger: "📒" };
  const iconFor = (k) => KIND_ICON[k] || "📄";
  const foundSet = (cid) => (state.found[cid] || (state.found[cid] = new Set()));
  const isOpened = (id) => state.opened.has(state.viewAs + ":" + id);
  // every character's item, indexed by id (for rendering revealed props anywhere)
  const allItems = () => {
    const m = {};
    M.characters.forEach((c) => (c.items || []).forEach((it) => (m[it.id] = { ...it, owner: c.id })));
    return m;
  };
  function openDoc(payload) {
    state.doc = payload;
    state.opened.add(state.viewAs + ":" + payload.id);
    render();
  }
  const initials = (name) => name.split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const ava = (c, cls = "") =>
    `<div class="ava ${cls}" style="background:${c.color}">${initials(c.title === "The Stranger" ? c.name.split(" ")[0] : c.name.replace(/^(Lady|Dr\.|Mr\.|Mrs\.|Miss) /, ""))}</div>`;

  function go(screen, opts = {}) { Object.assign(state, opts, { screen }); render(); }
  function setView(v) { state.viewAs = v; state.tab = "who"; render(); }

  // -------------------------------------------------------------- render
  function render() {
    let html = "";
    if (state.screen === "game") html += switcher();
    switch (state.screen) {
      case "intro":      html += screenIntro(); break;
      case "setup":      html += screenSetup(); break;
      case "preparing":  html += screenPreparing(); break;
      case "lobby":      html += screenLobby(); break;
      case "game":       html += (state.viewAs === "host") ? screenHost() : screenPlayer(); break;
      case "reveal":     html += screenReveal(); break;
    }
    if (state.doc) html += docOverlay();

    // preserve scroll position across in-place re-renders (opening a doc,
    // marking a suspect, investigating); only jump to top on a real nav.
    const key = state.screen + ":" + state.viewAs + ":" + state.tab;
    const keep = key === state._lastKey;
    const sy = window.scrollY;
    stage.innerHTML = html;
    bind();
    if (keep) window.scrollTo(0, sy); else { stage.scrollTop = 0; window.scrollTo(0, 0); }
    state._lastKey = key;
  }

  // ------------------------------------------------- document overlay
  function docOverlay() {
    const d = state.doc;
    const cls = "doc " + (d.kind || "note") + (d.charred ? " charred" : "");
    const revealed = d.id && state.revealed.has(d.id);
    const source = d.kind === "telegram" ? "Telegram"
      : d.where ? "Found in " + d.where
      : d.hideNote ? "In your possession"
      : d.revealable ? "In your possession" : "Document";
    const revealBtn = (d.revealable && !revealed)
      ? `<button class="reveal-btn" data-reveal-item="${d.id}">${d.revealLabel || "Reveal to the table"}</button>` : "";
    const revealedTag = revealed ? `<div class="revealed-tag">◆ Revealed to the table</div>` : "";
    const hideTag = d.hideNote ? `<div class="revealed-tag" style="color:#8a713a;">🔒 ${d.hideNote}</div>` : "";
    return `
      <div class="scrim" data-scrim>
        <button class="doc-close" data-doc-close>✕</button>
        <div class="${cls}">
          <div class="doc-inner">
            <div class="dt">${source}</div>
            <div class="dh serif">${d.title}</div>
            <div class="db">${d.body}</div>
            ${revealedTag}${hideTag}${revealBtn}
          </div>
        </div>
      </div>`;
  }

  // ---------------------------------------------------- device switcher
  function switcher() {
    const chip = (id, label, color, isHost) => {
      const on = state.viewAs === id ? "on" : "";
      const dot = isHost
        ? `<span class="dot">★</span>`
        : `<span class="dot" style="background:${color}">${initials(label)}</span>`;
      return `<button class="chip ${isHost ? "host" : ""} ${on}" data-view="${id}">${dot}${label}</button>`;
    };
    return `
      <div class="switcher">
        <div class="lbl">📱 Demo · tap a phone to view it</div>
        <div class="chips">
          ${chip("host", "Host", "", true)}
          ${CHARS.map((c) => chip(c.id, c.name.split(" ").slice(-1)[0], c.color, false)).join("")}
        </div>
      </div>`;
  }

  // --------------------------------------------------------------- intro
  function screenIntro() {
    return `
      <div class="screen center" style="justify-content:center; gap:0;">
        <div class="spacer"></div>
        <div class="eyebrow">A murder mystery party</div>
        <h1 style="font-size:52px; line-height:1.02; margin:14px 0 6px;">The<br/>Reveal</h1>
        <p class="muted" style="max-width:300px; margin:8px auto 0;">
          Gather your friends. One of them is a killer. Your phones know who.
        </p>
        <div class="spacer"></div>
        <div style="width:100%; max-width:320px; margin:0 auto;">
          <button class="btn" data-go="setup">Host a game</button>
          <button class="btn ghost" style="margin-top:10px;" data-go="setup">Join with a code</button>
        </div>
        <p class="muted" style="font-size:11px; margin-top:22px;">Prototype · no sign-up · plays on any phone</p>
        <div class="spacer"></div>
      </div>`;
  }

  // --------------------------------------------------------------- setup
  function screenSetup() {
    // ---- step 1: pick a mystery from the library ----
    const picked = LIB.find((m) => m.meta.id === state.mysteryId);
    const library = `
      <div class="k" style="color:var(--gold); margin-bottom:9px;">Choose a mystery</div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        ${LIB.map((m) => {
          const ready = m.meta.status === "ready";
          const on = state.mysteryId === m.meta.id && ready;
          return `
            <button class="card" ${ready ? `data-pick="${m.meta.id}"` : ""}
              style="text-align:left; padding:15px; ${on ? "border-color:var(--gold);" : ready ? "" : "opacity:.5;"}">
              <div class="flush">
                <div class="serif" style="font-size:17px;">${m.meta.title}</div>
                ${ready ? (on ? `<span class="pill">Chosen</span>` : "")
                        : `<span class="muted" style="font-size:10px; letter-spacing:.14em;">IN THE WORKS</span>`}
              </div>
              <div class="muted" style="font-size:12.5px; margin:3px 0 9px;">${m.meta.blurb}</div>
              <div style="display:flex; gap:14px; font-size:11px; letter-spacing:.04em;" class="muted">
                <span>👥 ${m.meta.minPlayers}–${m.meta.maxPlayers}</span>
                <span>⏱ ${m.meta.duration}</span>
                <span>◆ ${m.meta.difficulty}</span>
              </div>
            </button>`;
        }).join("")}
      </div>`;

    // ---- step 2: player count, with the live scaling note ----
    const mn = picked.meta.minPlayers, mx = picked.meta.maxPlayers;
    const count = Math.min(Math.max(state.playerCount, mn), mx);
    const castNow = picked.characters.filter((c) => c.minPlayers <= count);
    const scaleNote = picked.meta.scaling ? (picked.meta.scaling[count] || "") : "";

    const counter = `
      <div class="k" style="color:var(--gold); margin:20px 0 9px;">How many players?</div>
      <div class="card">
        <div class="flush">
          <button class="chip" data-count="${count - 1}" ${count <= mn ? "disabled style='opacity:.3'" : ""} style="width:44px; height:44px; justify-content:center; font-size:22px; padding:0;">−</button>
          <div class="center">
            <div class="serif" style="font-size:34px; line-height:1;">${count}</div>
            <div class="muted" style="font-size:11px;">players · ${mn}–${mx}</div>
          </div>
          <button class="chip" data-count="${count + 1}" ${count >= mx ? "disabled style='opacity:.3'" : ""} style="width:44px; height:44px; justify-content:center; font-size:22px; padding:0;">+</button>
        </div>
        ${scaleNote ? `<div class="reveal-box" style="margin-top:14px; padding:11px 13px;">
          <span style="color:var(--gold);">✦ Adapts:</span> <span style="font-size:13.5px;">${scaleNote}</span></div>` : ""}
        <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:6px;">
          ${castNow.map((c) => `<span class="chip" style="padding:4px 10px 4px 6px; font-size:12px;">
             <span class="dot" style="background:${c.color}">${initials(c.name)}</span>${c.title}</span>`).join("")}
        </div>
      </div>`;

    return `
      <div class="screen">
        <div class="eyebrow">New game</div>
        <h2 style="font-size:27px; margin:8px 0 4px;">Set the scene</h2>
        <p class="muted" style="margin:0 0 18px;">Hand-crafted mysteries — new ones added all the time. Pick one, then size it to your group.</p>
        ${library}
        ${counter}
        <div class="spacer"></div>
        <div class="footer-cta">
          <button class="btn" data-go="preparing">Set up the game →</button>
        </div>
      </div>`;
  }

  // ---------------------------------------------------------- preparing
  function screenPreparing() {
    // Brief "dealing the roles" beat — no AI, the mystery is pre-authored.
    syncCast();
    const lines = [
      `Setting the scene: ${M.meta.theme.toLowerCase()}…`,
      `Casting ${CHARS.length} suspects for ${state.playerCount} players…`,
      "Sealing each secret in its own envelope…",
      "Opening the room…",
    ];
    setTimeout(() => go("lobby", { joined: 1 }), 2300);
    return `
      <div class="screen center" style="justify-content:center;">
        <div class="spacer"></div>
        <div class="eyebrow">Preparing your game</div>
        <h2 class="serif" style="font-size:26px; margin:12px 0 20px;">${M.meta.title}</h2>
        <div style="width:100%; max-width:290px; margin:0 auto; text-align:left; display:flex; flex-direction:column; gap:12px;">
          ${lines.map((l, i) => `
            <div style="display:flex; align-items:center; gap:10px; animation:fade .5s ${i * .4}s both;">
              <span style="color:var(--gold);">✦</span>
              <span class="muted" style="font-size:13.5px;">${l}</span>
            </div>`).join("")}
        </div>
        <div class="spacer"></div>
        <div class="spacer"></div>
      </div>`;
  }

  // --------------------------------------------------------------- lobby
  function screenLobby() {
    // reveal players one at a time for a live-joining feel
    const names = playerNames();
    if (state.joined < names.length) {
      setTimeout(() => { state.joined++; render(); }, 600);
    }
    const rows = names.slice(0, state.joined).map((n, i) => {
      const c = CHARS[i];
      return `
        <div class="list-row fade-in-slow">
          <div class="ava" style="background:${c.color}; width:38px; height:38px; font-size:14px;">${initials(n)}</div>
          <div style="flex:1;">
            <div style="font-weight:700;">${n}${i === 0 ? '<span class="muted" style="font-weight:400;"> · you</span>' : ""}</div>
            <div class="muted" style="font-size:12px;">Ready</div>
          </div>
          <span style="color:#6fbf73;">●</span>
        </div>`;
    }).join("");
    const all = state.joined >= names.length;
    return `
      <div class="screen">
        <div class="center">
          <div class="eyebrow">Room code</div>
          <div class="big-code">${state.code.split("").join(" ")}</div>
          <p class="muted" style="font-size:12.5px; margin:4px 0 0;">Friends open the app and type this to join</p>
        </div>
        <hr class="rule" />
        <div class="flush" style="margin-bottom:2px;">
          <div class="k" style="color:var(--gold);">In the parlour</div>
          <div class="muted" style="font-size:12px;">${state.joined}/${state.playerCount}</div>
        </div>
        <div class="card" style="padding:6px 16px;">${rows}</div>
        <div class="spacer"></div>
        <div class="footer-cta">
          <button class="btn ${all ? "" : ""}" data-start ${all ? "" : "disabled"}>
            ${all ? "Begin the night ✦" : "Waiting for guests…"}
          </button>
        </div>
      </div>`;
  }

  // ------------------------------------------------ host / game-board screen
  // Public-safe: shows the pacing guide + shared evidence only. No secrets,
  // no killer — whoever runs the night is a suspect like everyone else.
  function screenHost() {
    const evidenceSoFar = [];
    for (let r = 1; r <= state.round; r++) (M.evidence[r] || []).forEach((e) => evidenceSoFar.push({ r, e }));
    const guide = M.meta.roundGuide[state.round];
    const voting = state.phase === "voting" || state.phase === "results";

    let control;
    if (state.phase === "round" && state.round < TOTAL_ROUNDS) {
      control = `<button class="btn" data-advance>Wrap up · start ${M.meta.roundGuide[state.round + 1].title} →</button>
                 <p class="muted center" style="font-size:12px; margin-top:8px;">Advance when: ${guide.advanceWhen}</p>`;
    } else if (state.phase === "round" && state.round === TOTAL_ROUNDS) {
      control = `<button class="btn blood" data-tovote>Everyone ready? Call the vote ⚖</button>
                 <p class="muted center" style="font-size:12px; margin-top:8px;">Advance when: ${guide.advanceWhen}</p>`;
    } else {
      control = `<button class="btn blood" data-reveal>Reveal the killer</button>
                 <p class="muted center" style="font-size:12px; margin-top:8px;">Votes are in. Time for the truth.</p>`;
    }

    // top block: either the scripted round run-sheet, or a voting banner
    const topBlock = voting
      ? `<div class="card" style="margin-top:14px;">
           <div class="k" style="color:var(--gold); margin-bottom:6px;">The vote</div>
           <p class="serif" style="margin:0; font-size:15px;">Everyone opens their own phone and names the guest they believe killed Edmund. No peeking at each other's screens.</p>
         </div>`
      : `<div class="card" style="margin-top:14px;">
           <div class="flush" style="align-items:flex-start;">
             <div>
               <div class="k" style="color:var(--gold);">Round ${state.round} of ${TOTAL_ROUNDS}</div>
               <div class="serif" style="font-size:20px; margin-top:2px;">${guide.title}</div>
             </div>
             <div class="center" style="min-width:78px;">
               <div class="serif" style="font-size:20px; line-height:1;"><span id="elapsed">0:00</span></div>
               <div class="muted" style="font-size:10px; letter-spacing:.06em;">~${guide.minutes} min</div>
             </div>
           </div>
         </div>
         <div class="reveal-box" style="margin-top:12px;">
           <div class="k" style="color:var(--gold); margin-bottom:6px;">📜 Read this aloud to the room</div>
           <p class="serif" style="margin:0; font-size:14.5px; line-height:1.55;">${guide.narration}</p>
         </div>
         <div class="card" style="margin-top:12px;">
           <div class="k" style="color:var(--gold); margin-bottom:10px;">Then run the round</div>
           <ol style="margin:0; padding-left:20px; font-size:14px;">
             ${guide.steps.map((s) => `<li style="margin:8px 0; padding-left:2px;">${s}</li>`).join("")}
           </ol>
         </div>`;

    return `
      <div class="screen">
        <div class="flush">
          <div><div class="eyebrow">Host · game board</div><h2 class="serif" style="font-size:22px;">${M.meta.title}</h2></div>
          <span class="pill">${voting ? "Voting" : "Round " + state.round + "/" + TOTAL_ROUNDS}</span>
        </div>

        ${topBlock}

        <div class="k" style="color:var(--gold); margin:18px 0 8px;">The case board · everyone can see this</div>
        <div class="card">
          ${evidenceSoFar.map((x) => `
            <div class="list-row">
              <span style="color:var(--gold);">✦</span>
              <div style="flex:1; font-size:13.5px;">${x.e}<span class="muted" style="font-size:11px;"> · R${x.r}</span></div>
            </div>`).join("")}
          ${[...state.revealed].map((id) => allItems()[id]).filter(Boolean).map((it) => `
            <div class="list-row">
              <span style="color:var(--blood);">◆</span>
              <div style="flex:1; font-size:13.5px;">${it.title}<span class="muted" style="font-size:11px;"> · revealed by ${nameOf(it.owner)}</span></div>
            </div>`).join("")}
        </div>

        <div class="k" style="color:var(--gold); margin:18px 0 8px;">Who's at the table</div>
        <div class="card" style="padding:8px 16px;">
          ${CHARS.map((c) => `
            <div class="list-row">
              ${ava(c)}
              <div style="flex:1;">
                <div style="font-weight:700; font-size:14px;">${c.name}</div>
                <div class="muted" style="font-size:12px;">${c.title}</div>
              </div>
            </div>`).join("")}
        </div>

        <div class="spacer"></div>
        <div class="footer-cta">${control}</div>
        <p class="demo-note" style="border:0; padding-top:14px;">You run the pacing — nobody's secrets show here. Everyone's phone follows when you advance.</p>
      </div>`;
  }

  // -------------------------------------------------------- player screen
  function screenPlayer() {
    const c = charById(state.viewAs);
    const rd = c.rounds[state.round];
    const evidenceSoFar = [];
    for (let r = 1; r <= state.round; r++) (M.evidence[r] || []).forEach((e) => evidenceSoFar.push(e));

    // header
    const header = `
      <div class="flush" style="align-items:flex-start;">
        <div style="display:flex; gap:13px; align-items:center;">
          ${ava(c, "lg")}
          <div>
            <div class="eyebrow" style="color:${c.color === "#a23b3b" ? "var(--gold)" : "var(--gold)"};">${c.title}</div>
            <h2 class="serif" style="font-size:21px; line-height:1.1;">${c.name}</h2>
          </div>
        </div>
        <span class="pill">R${state.round}</span>
      </div>`;

    // voting phase overrides tabs
    if (state.phase === "voting") return `<div class="screen">${header}${votePanel(c)}</div>`;

    // --- casebook contents for this character ---
    const items = allItems();
    const gathered = M.clues.filter((cl) => cl.round <= state.round && foundSet(c.id).has(cl.id));
    const myItems = c.items || [];
    const revealedDocs = [...state.revealed].map((id) => items[id]).filter(Boolean);
    let unread = 0;
    gathered.forEach((cl) => { if (!state.opened.has(c.id + ":" + cl.id)) unread++; });
    myItems.forEach((it) => { if (!state.opened.has(c.id + ":" + it.id)) unread++; });
    revealedDocs.forEach((it) => { if (it.owner !== c.id && !state.opened.has(c.id + ":" + it.id)) unread++; });

    const tabBar = `
      <div class="tabs">
        ${tab("who", "You")}
        ${tab("round", "This round")}
        ${tab("case", "Casebook" + (unread ? `<span class="tab-badge">${unread}</span>` : ""))}
      </div>`;

    let body = "";
    if (state.tab === "who") {
      body = `
        <div class="card">
          <div class="k" style="color:var(--gold); margin-bottom:6px;">Who you are</div>
          <p style="margin:0 0 14px; font-size:14.5px;">${c.publicRole}</p>
          <div class="reveal-box">
            <div class="k" style="color:var(--gold); margin-bottom:6px;">🤫 Your secret — for your eyes only</div>
            <p style="margin:0; font-size:14.5px;">${c.secret}</p>
          </div>
          <div style="margin-top:12px; font-size:13px;" class="muted">
            <strong style="color:var(--ink);">You must hide:</strong> ${c.mustHide}
          </div>
        </div>
        <div class="card" style="margin-top:12px;">
          <div class="k" style="color:var(--gold); margin-bottom:10px;">Your objectives tonight</div>
          <ul class="clean" style="font-size:14.5px;">
            ${c.objectives.map((o) => `<li>${o}</li>`).join("")}
          </ul>
          <hr class="rule" />
          <div class="k" style="color:var(--gold); margin-bottom:6px;">You happen to know</div>
          <p style="margin:0; font-size:14px;">${c.knows}</p>
        </div>`;
    } else if (state.tab === "round") {
      const guide = M.meta.roundGuide[state.round];
      const target = nameOf(rd.question.to);
      const stepNo = (n, label) =>
        `<span class="k" style="display:inline-flex; align-items:center; gap:7px; color:var(--gold); margin-bottom:6px;">
           <span style="width:18px; height:18px; border-radius:50%; background:var(--gold); color:#1c150a; display:grid; place-items:center; font-size:11px;">${n}</span>${label}</span>`;
      const thisRoundClues = M.clues.filter((cl) => cl.round === state.round);
      const ungathered = thisRoundClues.filter((cl) => !foundSet(c.id).has(cl.id));
      const investigate = thisRoundClues.length ? `
        <div class="card" style="margin-top:12px; border-color:var(--gold);">
          ${stepNo(3, "GATHER THE EVIDENCE")}
          ${ungathered.length
            ? `<p class="muted" style="margin:2px 0 10px; font-size:13px;">${ungathered.length} new ${ungathered.length === 1 ? "clue is" : "clues are"} waiting to be found this round.</p>
               <button class="btn" data-investigate style="padding:11px;">🔎 Investigate the manor</button>`
            : `<p class="muted" style="margin:2px 0 0; font-size:13px;">✓ Gathered. Open your <strong style="color:var(--ink);">Casebook</strong> to examine what you found.</p>`}
        </div>` : "";
      body = `
        <div class="card" style="padding:12px 15px; background:var(--panel-2);">
          <div class="k" style="color:var(--gold); margin-bottom:4px;">Round ${state.round} · ${guide.title}</div>
          <p class="muted" style="margin:0; font-size:13px;">${guide.goal}</p>
        </div>

        <div class="reveal-box" style="margin-top:12px;">
          <div class="k" style="color:var(--gold); margin-bottom:6px;">✦ What you now know — private</div>
          <p style="margin:0; font-size:14.5px;">${rd.learned}</p>
        </div>

        <div class="card" style="margin-top:12px; border-color:var(--gold);">
          ${stepNo(1, "SAY THIS ALOUD")}
          <p class="serif" style="margin:0; font-size:15.5px; line-height:1.5;">“${rd.sayAloud}”</p>
        </div>

        <div class="card" style="margin-top:12px; border-color:var(--gold);">
          ${stepNo(2, "ASK " + target.toUpperCase())}
          <p class="serif" style="margin:0; font-size:15px; line-height:1.5;">“${rd.question.text}”</p>
        </div>

        ${investigate}

        <div class="action-box" style="margin-top:12px;">
          <div class="k" style="color:#e39a9a; margin-bottom:6px;">🎯 Your secret goal this round</div>
          <p style="margin:0; font-size:14px;">${rd.secretGoal}</p>
        </div>

        <div class="card" style="margin-top:12px;">
          <div class="k" style="color:var(--muted); margin-bottom:6px;">🛡 If someone accuses you</div>
          <p style="margin:0; font-size:14px;">${rd.ifAccused}</p>
        </div>`;
    } else {
      // ---- Casebook ----
      const ungatheredNow = M.clues.filter((cl) => cl.round === state.round && !foundSet(c.id).has(cl.id));
      const primeId = state.prime[c.id];
      body = `
        <div class="k" style="color:var(--gold); margin:2px 0 9px;">Evidence you've gathered</div>
        ${gathered.length
          ? gathered.map((cl) => clueCard(cl, c.id, false)).join("")
          : `<div class="empty-note">Nothing yet. Tap <strong style="color:var(--ink);">🔎 Investigate</strong> in ‘This round’ to gather the clues on the table.</div>`}
        ${ungatheredNow.length
          ? `<div class="empty-note" style="margin-top:8px; color:var(--gold);">✦ More evidence is out this round — Investigate to collect it.</div>` : ""}

        <div class="k" style="color:var(--gold); margin:20px 0 9px;">In your possession</div>
        ${myItems.length
          ? myItems.map((it) => clueCard(it, c.id, true)).join("")
          : `<div class="empty-note">You carry nothing of note.</div>`}

        ${revealedDocs.length ? `
          <div class="k" style="color:var(--gold); margin:20px 0 9px;">Revealed to the table</div>
          ${revealedDocs.map((it) => clueCard(it, c.id, false)).join("")}` : ""}

        <div class="k" style="color:var(--gold); margin:20px 0 9px;">Who do you suspect?</div>
        <div class="card" style="padding:6px 16px;">
          ${CHARS.filter((s) => s.id !== c.id).map((s) => {
            const on = primeId === s.id;
            return `
              <div class="list-row" data-prime="${s.id}" style="cursor:pointer;">
                ${ava(s)}
                <div style="flex:1;">
                  <div style="font-weight:700; font-size:14px;">${s.name}</div>
                  <div class="muted" style="font-size:12px;">${s.title}</div>
                </div>
                <span style="width:22px; height:22px; border-radius:50%; border:2px solid ${on ? "var(--gold)" : "var(--line)"}; display:grid; place-items:center;">
                  ${on ? '<span style="color:var(--gold);">✓</span>' : ""}
                </span>
              </div>`;
          }).join("")}
        </div>
        <p class="muted" style="font-size:12px; margin:9px 2px 0;">${primeId ? `Marked as your prime suspect — ready for the final vote.` : `Tap the guest you most suspect. It'll be waiting when the vote comes.`}</p>`;
    }

    return `<div class="screen">${header}<div style="height:14px;"></div>${tabBar}${body}
        <p class="demo-note" style="border:0; padding-top:16px;">This screen is private to ${c.name.split(" ").slice(-1)[0]}. Every suspect sees a different one.</p>
      </div>`;
  }

  function tab(key, label) {
    return `<button class="tab ${state.tab === key ? "on" : ""}" data-tab="${key}">${label}</button>`;
  }

  // a tappable evidence/possession card that opens the document overlay
  function clueCard(d, cid, isItem) {
    const unread = !state.opened.has(cid + ":" + d.id);
    let tag = "";
    if (isItem) tag = d.revealable ? (state.revealed.has(d.id) ? "Revealed" : "Can be revealed") : "Secret · yours to hide";
    return `
      <button class="clue-card" data-open="${d.id}">
        <div class="clue-ic">${iconFor(d.kind)}</div>
        <div style="flex:1; min-width:0;">
          <div style="font-weight:700; font-size:14px;">${d.title}</div>
          <div class="muted" style="font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${d.teaser}${tag ? " · " + tag : ""}</div>
        </div>
        ${unread ? '<span class="unread-dot"></span>' : ""}
      </button>`;
  }

  function votePanel(c) {
    const prime = state.prime[c.id];
    const selected = state.myVote || prime || null;
    const prefilled = !state.myVote && prime;
    return `
      <div style="margin-top:16px;">
        <div class="k" style="color:var(--gold);">The vote</div>
        <h3 class="serif" style="font-size:19px; margin:4px 0 4px;">Who killed Lord Edmund?</h3>
        <p class="muted" style="font-size:13px; margin:0 0 14px;">${prefilled ? `Your Casebook marked <strong style="color:var(--ink);">${nameOf(prime)}</strong> — tap to confirm, or change your mind.` : `Weigh the evidence you gathered. You are ${c.name.split(" ").slice(-1)[0]} — vote as they would.`}</p>
        <div class="card" style="padding:6px 16px;">
          ${CHARS.map((s) => {
            const on = selected === s.id;
            return `
              <div class="list-row" data-vote="${s.id}" style="cursor:pointer;">
                ${ava(s)}
                <div style="flex:1;">
                  <div style="font-weight:700; font-size:14px;">${s.name}</div>
                  <div class="muted" style="font-size:12px;">${s.title}</div>
                </div>
                <span style="width:22px; height:22px; border-radius:50%; border:2px solid ${on ? "var(--gold)" : "var(--line)"}; display:grid; place-items:center;">
                  ${on ? '<span style="color:var(--gold);">✓</span>' : ""}
                </span>
              </div>`;
          }).join("")}
        </div>
        ${state.myVote ? `<p class="muted center" style="font-size:12px; margin-top:12px;">Vote locked. Switch to the Host phone to reveal the killer.</p>` : ""}
      </div>`;
  }

  // -------------------------------------------------------------- reveal
  function screenReveal() {
    const killer = charById(M.solution.killer);
    const guessedRight = state.myVote === M.solution.killer;
    const inCast = (id) => CHARS.some((c) => c.id === id);
    const awards = M.solution.awards.filter((a) => inCast(a.who));
    return `
      <div class="screen">
        <div class="center">
          <div class="eyebrow">The truth</div>
          <div style="margin:18px auto 10px;">${ava(killer, "lg")}</div>
          <h2 class="serif" style="font-size:26px;">${killer.name}</h2>
          <span class="pill" style="background:rgba(162,59,59,.16); color:#e39a9a; border-color:rgba(162,59,59,.4);">The killer</span>
        </div>

        <div class="card" style="margin-top:18px;">
          <div class="k" style="color:var(--gold); margin-bottom:6px;">How it was done</div>
          <p style="margin:0 0 12px; font-size:14px;">${M.solution.method}</p>
          <div class="k" style="color:var(--gold); margin-bottom:6px;">Why</div>
          <p style="margin:0 0 12px; font-size:14px;">${M.solution.motive}</p>
          <hr class="rule" />
          <p class="serif" style="margin:0; font-size:14.5px;">${M.solution.explanation}</p>
        </div>

        <div class="card ${guessedRight ? "" : ""}" style="margin-top:12px; ${guessedRight ? "border-color:#6fbf73;" : "border-color:var(--blood);"}">
          <div class="flush">
            <div>
              <div class="k" style="color:${guessedRight ? "#6fbf73" : "var(--blood)"};">Your verdict</div>
              <div class="serif" style="font-size:17px;">${state.myVote ? (guessedRight ? "You caught the killer!" : "The killer walked free.") : "You didn't vote"}</div>
            </div>
            <div style="font-size:26px;">${guessedRight ? "🎉" : "🕯️"}</div>
          </div>
          ${state.myVote && !guessedRight ? `<p class="muted" style="font-size:13px; margin:8px 0 0;">You accused ${charById(state.myVote).name}. Sebastian's deflection worked on you.</p>` : ""}
        </div>

        <div class="k" style="color:var(--gold); margin:18px 0 8px;">Tonight's honours</div>
        <div class="card" style="padding:8px 16px;">
          ${awards.map((a) => {
            const w = charById(a.who);
            return `<div class="list-row">${ava(w)}
              <div style="flex:1;"><div style="font-weight:700; font-size:14px;">${a.title}</div>
              <div class="muted" style="font-size:12px;">${w.name.split(" ").slice(-1)[0]} · ${a.note}</div></div></div>`;
          }).join("")}
        </div>

        <div class="spacer"></div>
        <div class="footer-cta">
          <button class="btn" data-restart>Play another night</button>
        </div>
      </div>`;
  }

  // ---------------------------------------------------------------- bind
  function bind() {
    stage.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => setView(b.dataset.view));
    stage.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => go(b.dataset.go));
    stage.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; render(); });

    // setup: pick a mystery + clamp player count to its range
    stage.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => {
      state.mysteryId = b.dataset.pick;
      M = LIB.find((m) => m.meta.id === state.mysteryId);
      state.playerCount = Math.min(Math.max(state.playerCount, M.meta.minPlayers), M.meta.maxPlayers);
      render();
    });
    stage.querySelectorAll("[data-count]").forEach((b) => b.onclick = () => {
      state.playerCount = parseInt(b.dataset.count, 10); render();
    });

    const start = stage.querySelector("[data-start]");
    if (start) start.onclick = () => { syncCast(); state.roundStartedAt = Date.now(); go("game", { viewAs: "host", round: 1, phase: "round" }); };

    const adv = stage.querySelector("[data-advance]");
    if (adv) adv.onclick = () => { state.round++; state.roundStartedAt = Date.now(); render(); };

    const tv = stage.querySelector("[data-tovote]");
    if (tv) tv.onclick = () => { state.phase = "voting"; render(); };

    const rv = stage.querySelector("[data-reveal]");
    if (rv) rv.onclick = () => go("reveal");

    stage.querySelectorAll("[data-vote]").forEach((r) => r.onclick = () => { state.myVote = r.dataset.vote; render(); });

    // interactive layer: open documents, investigate, mark suspects, reveal
    const resolveDoc = (id) => M.clues.find((x) => x.id === id) || allItems()[id] || null;
    stage.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => {
      const d = resolveDoc(b.dataset.open);
      if (d) openDoc(d);
    });
    const inv = stage.querySelector("[data-investigate]");
    if (inv) inv.onclick = () => {
      M.clues.filter((cl) => cl.round === state.round).forEach((cl) => foundSet(state.viewAs).add(cl.id));
      render();
    };
    stage.querySelectorAll("[data-prime]").forEach((r) => r.onclick = () => {
      state.prime[state.viewAs] = (state.prime[state.viewAs] === r.dataset.prime) ? null : r.dataset.prime;
      render();
    });
    const scrim = stage.querySelector("[data-scrim]");
    if (scrim) scrim.onclick = (e) => { if (e.target === scrim) { state.doc = null; render(); } };
    const dc = stage.querySelector("[data-doc-close]");
    if (dc) dc.onclick = () => { state.doc = null; render(); };
    const ri = stage.querySelector("[data-reveal-item]");
    if (ri) ri.onclick = () => { state.revealed.add(ri.dataset.revealItem); render(); };

    const rs = stage.querySelector("[data-restart]");
    if (rs) rs.onclick = () => { Object.assign(state, { screen: "intro", viewAs: "host", round: 1, phase: "round", tab: "who", joined: 0, myVote: null, roundStartedAt: null, found: {}, opened: new Set(), revealed: new Set(), prime: {}, doc: null }); render(); };
  }

  // live elapsed timer on the game board — updates only its own node so the
  // rest of the screen (and scroll position) is untouched.
  setInterval(() => {
    const e = document.getElementById("elapsed");
    if (!e || !state.roundStartedAt) return;
    const s = Math.max(0, Math.floor((Date.now() - state.roundStartedAt) / 1000));
    e.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }, 1000);

  render();
  </script>
</body>
</html>
